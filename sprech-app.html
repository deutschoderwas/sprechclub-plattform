<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deutschoderwas · Sprechclub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tuerkis:#2DD4BF; --tuerkis-d:#14B8A6; --tuerkis-soft:#A7F3D0; --auf-tuerkis:#06403A;
  --anthrazit:#1A1A1A; --rot:#DD0000; --gold:#FFCE00;
  --creme:#FFF8E0; --creme-hell:#FFFCF5; --weich:#6B7280; --rahmen:#F0E5D8; --weiss:#fff;
  --schatten:0 4px 18px rgba(0,0,0,.06); --schatten-l:0 2px 8px rgba(0,0,0,.05);
  /* Niveau-Akzent (wird je nach Niveau überschrieben) – Standard = neutral */
  --akz:#1A1A1A; --akz-soft:#EDE7D6; --akz-text:#1A1A1A; --akz-grad:linear-gradient(135deg,#2DD4BF,#14B8A6); --akz-tint:#FFF8E0; --akz-bar:#FFF8E0;
}
/* Niveau färbt die GANZE Seite – drei klar verschiedene Farben */
body[data-niveau="ab"]{ --akz:#E8A400; --akz-soft:#FBE7A8; --akz-text:#6E4E00; --akz-grad:linear-gradient(135deg,#FFCE00,#E8A400); --akz-tint:#FFF6DA; --akz-bar:#FDEEBE; } /* Gold */
body[data-niveau="bb"]{ --akz:#0FB5A6; --akz-soft:#BEEFE8; --akz-text:#064B45; --akz-grad:linear-gradient(135deg,#2DD4BF,#0FB5A6); --akz-tint:#DFF6F2; --akz-bar:#C7F2EC; } /* Türkis */
body[data-niveau="bc"]{ --akz:#5B52E0; --akz-soft:#DAD7FA; --akz-text:#2E278F; --akz-grad:linear-gradient(135deg,#8B83F0,#5B52E0); --akz-tint:#EEEDFD; --akz-bar:#DEDAFB; } /* Indigo */

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--akz-tint);color:var(--anthrazit);-webkit-font-smoothing:antialiased;transition:background .25s;}
h1,h2,h3{font-family:'Space Grotesk','Segoe UI',sans-serif;}

/* dünnes Niveau-Band ganz oben */
.band{height:5px;background:var(--akz-grad);}

/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--akz-tint);border-bottom:1px solid var(--rahmen);padding:12px 20px 12px;transition:background .25s;}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.marke{font-family:'Space Grotesk';font-weight:700;font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap;}
.marke .o{color:var(--tuerkis-d);}
.marke small{display:block;font-family:'Inter';font-weight:600;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--weich);margin-top:1px;}
.suche{flex:1 1 220px;position:relative;min-width:160px;}
.suche input{width:100%;border:1px solid var(--rahmen);background:var(--weiss);border-radius:999px;padding:11px 16px 11px 40px;font-family:'Inter';font-size:.95rem;color:var(--anthrazit);outline:none;}
.suche input:focus{border-color:var(--akz);box-shadow:0 0 0 3px color-mix(in srgb,var(--akz) 22%,transparent);}
.suche .lupe{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--weich);}
.niv{display:flex;gap:6px;flex-wrap:wrap;}
.niv button{border:1.5px solid var(--rahmen);background:var(--weiss);border-radius:999px;padding:9px 14px;font-family:'Space Grotesk';font-weight:600;font-size:.82rem;cursor:pointer;color:var(--anthrazit);transition:.12s;}
.niv button:hover{border-color:var(--akz);}
.niv button.on{color:#fff;border-color:transparent;background:var(--akz);}
.niv button[data-n="ab"].on{background:#CA8A04;} .niv button[data-n="bb"].on{background:#14B8A6;} .niv button[data-n="bc"].on{background:#16A34A;}
.niv button[data-n="all"].on{background:var(--anthrazit);}

/* Reihe-Label */
.reihe{display:inline-flex;align-items:center;gap:7px;margin-left:auto;background:var(--akz-soft);color:var(--akz-text);border-radius:999px;padding:7px 14px;font-family:'Space Grotesk';font-weight:600;font-size:.82rem;}

/* ---------- Layout ---------- */
.wrap{display:grid;grid-template-columns:300px 1fr;max-width:1500px;margin:0 auto;min-height:calc(100vh - 95px);position:relative;transition:grid-template-columns .22s;}
body.zu .wrap{grid-template-columns:0 1fr;}

.liste{border-right:1px solid var(--rahmen);padding:16px 12px 40px;overflow:auto;background:var(--creme-hell);position:relative;}
body.zu .liste{display:none;}
.gruppe-h{font-family:'Space Grotesk';font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--weich);padding:14px 10px 8px;}
.gruppe-h:first-child{padding-top:2px;}
.b-item{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:10px 11px;margin-bottom:2px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:10px;}
.b-item:hover{background:var(--creme);}
.b-item.on{background:var(--akz-soft);border-color:var(--akz);}
.b-item .em{flex:none;width:30px;height:30px;border-radius:9px;background:var(--creme);display:flex;align-items:center;justify-content:center;font-size:1.02rem;}
.b-item.on .em{background:#fff;}
.b-item .bn{flex:1;font-weight:600;font-size:.93rem;line-height:1.2;}
.b-item .ct{flex:none;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;color:var(--weich);background:rgba(0,0,0,.05);border-radius:999px;padding:1px 8px;}
.b-item.on .ct{color:var(--akz-text);background:#fff;}
.b-item.leer .bn,.b-item.leer .ct{opacity:.5;}

/* Zieher / Toggle */
.zieher{position:absolute;top:14px;right:-13px;z-index:20;width:26px;height:26px;border-radius:999px;border:1px solid var(--rahmen);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--schatten-l);font-size:.9rem;color:var(--weich);}
.zieher:hover{color:var(--akz);border-color:var(--akz);}
.auf{position:fixed;left:12px;top:104px;z-index:40;display:none;align-items:center;gap:7px;background:#fff;border:1px solid var(--rahmen);border-radius:999px;padding:8px 14px;font-family:'Space Grotesk';font-weight:600;font-size:.84rem;cursor:pointer;box-shadow:var(--schatten);color:var(--anthrazit);}
body.zu .auf{display:inline-flex;}
.auf:hover{border-color:var(--akz);}

/* ---------- Hauptbereich ---------- */
.detail{padding:26px 34px 70px;overflow:auto;}

/* Willkommen */
.welc{max-width:680px;margin:5vh auto 0;text-align:center;}
.welc .em{font-size:3.2rem;}
.welc h1{font-size:2rem;margin:10px 0 8px;}
.welc p{color:var(--weich);font-size:1.05rem;line-height:1.6;margin:0 auto 6px;max-width:520px;}
.welc .hint{margin-top:22px;display:inline-flex;gap:8px;align-items:center;background:var(--akz-soft);color:var(--akz-text);border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;}

/* Themenkarten im Bereich */
.b-kopf{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.b-kopf .em{width:48px;height:48px;border-radius:14px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.b-kopf h1{font-size:1.7rem;margin:0;}
.b-kopf .sub{color:var(--weich);font-size:.9rem;font-weight:600;}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:22px;}
.karte{text-align:left;background:var(--weiss);border:1px solid var(--rahmen);border-radius:16px;padding:16px 18px;cursor:pointer;transition:.12s;box-shadow:var(--schatten-l);}
.karte:hover{border-color:var(--akz);transform:translateY(-2px);box-shadow:var(--schatten);}
.karte .kt{font-family:'Space Grotesk';font-weight:600;font-size:1.1rem;line-height:1.2;}
.karte .kmeta{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--weich);font-size:.82rem;}
.karte .pfeil{margin-top:12px;color:var(--akz);font-weight:700;font-size:.85rem;}
.keine{margin-top:26px;background:var(--creme-hell);border:1px dashed var(--rahmen);border-radius:16px;padding:26px;text-align:center;color:var(--weich);}

.lv{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;border-radius:999px;padding:2px 9px;white-space:nowrap;}
.lv-ab{background:#FEF3C7;color:#854D0E;} .lv-bb{background:var(--tuerkis-soft);color:var(--auf-tuerkis);} .lv-bc{background:#DCFCE7;color:#166534;}

/* Theme-Detail */
.zurueck{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--akz-text);font-family:'Space Grotesk';font-weight:600;font-size:.9rem;cursor:pointer;padding:4px 0;margin-bottom:8px;}
.d-kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.d-breadcrumb{font-size:.82rem;color:var(--weich);font-weight:600;}
.d-titel{font-family:'Space Grotesk';font-weight:700;font-size:2rem;line-height:1.1;margin:4px 0 0;}
.d-tools{display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--rahmen);background:var(--creme-hell);border-radius:999px;padding:9px 15px;font-family:'Space Grotesk';font-weight:600;font-size:.84rem;cursor:pointer;color:var(--anthrazit);display:inline-flex;align-items:center;gap:7px;}
.btn:hover{border-color:var(--akz);}
.btn-prim{background:var(--akz-grad);color:#fff;border:none;box-shadow:var(--schatten-l);}

.sek{margin-top:26px;}
.sek-h{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--akz-text);margin-bottom:14px;}
.frage{display:flex;gap:14px;align-items:flex-start;background:var(--creme-hell);border:1px solid var(--rahmen);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.12s;}
.frage:hover{border-color:var(--akz);}
.frage.aktiv{background:#fff;border-color:var(--akz);box-shadow:var(--schatten);}
.frage .nr{flex:none;width:30px;height:30px;border-radius:999px;background:var(--anthrazit);color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.frage.aktiv .nr{background:var(--akz);}
.frage .ft{font-size:1.02rem;line-height:1.5;padding-top:3px;}
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.rm-karte{background:#fff;border:1px solid var(--rahmen);border-radius:16px;padding:16px 18px;box-shadow:var(--schatten-l);}
.rm-karte h4{font-family:'Space Grotesk';font-weight:600;font-size:.98rem;margin:0 0 10px;color:var(--akz-text);display:flex;align-items:center;gap:8px;}
.rm-karte ul{margin:0;padding:0;list-style:none;}
.rm-karte li{font-size:.98rem;line-height:1.45;padding:7px 0;border-bottom:1px dashed var(--rahmen);}
.rm-karte li:last-child{border-bottom:none;}
.vok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
.vok{background:var(--creme-hell);border:1px solid var(--rahmen);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.12s;}
.vok:hover{border-color:var(--akz);}
.vok .w{font-family:'Space Grotesk';font-weight:600;font-size:1.02rem;}
.vok .bsp{font-size:.86rem;color:var(--weich);margin-top:3px;line-height:1.4;}
.vok .ue{font-size:.9rem;color:var(--akz-text);font-weight:600;margin-top:6px;display:none;}
.vok.show .ue{display:block;}
.vok .tipp{font-size:.72rem;color:var(--weich);margin-top:6px;}
.vok.show .tipp{display:none;}

/* Präsentiermodus */
body.praesi .top .suche,body.praesi .liste,body.praesi .reihe{display:none;}
body.praesi .wrap{grid-template-columns:1fr;}
body.praesi .auf{display:none;}
body.praesi .detail{padding:30px max(40px,6vw) 80px;}
body.praesi .d-titel{font-size:2.5rem;}
body.praesi .frage .ft{font-size:1.18rem;}

@media(max-width:860px){
  .wrap{grid-template-columns:1fr;}
  .liste{border-right:none;border-bottom:1px solid var(--rahmen);max-height:40vh;}
  body.zu .liste{display:none;}
  .rm-grid{grid-template-columns:1fr;}
  .detail{padding:20px 18px 60px;}
  .zieher{display:none;}
  .reihe{margin-left:0;}
}
</style>
</head>
<body data-niveau="all">
<div class="band"></div>

<div class="top">
  <div class="top-row">
    <div class="marke">deutsch<span class="o">oderwas</span><small>Sprechclub</small></div>
    <div class="suche"><span class="lupe">🔍</span><input id="suche" type="text" placeholder="Thema suchen …" autocomplete="off"></div>
    <div class="niv" id="niv"></div>
    <div class="reihe">🗣️ Freies Sprechen &amp; Debatten</div>
  </div>
</div>

<div class="wrap">
  <aside class="liste">
    <button class="zieher" id="zieher" title="Leiste einklappen" onclick="toggleListe()">‹</button>
    <div id="bereiche"></div>
  </aside>
  <main class="detail" id="detail"></main>
</div>
<button class="auf" onclick="toggleListe()">☰ Bereiche</button>

<script>
const BAENDER={ ab:{label:'A2·B1',cls:'lv-ab'}, bb:{label:'B1·B2',cls:'lv-bb'}, bc:{label:'B2·C1',cls:'lv-bc'} };

/* Bereiche – Reihe „Freies Sprechen & Debatten", für alle Niveaus gleich */
const BEREICHE=[
  { gruppe:'Alltag & Leben', items:[
    {n:'Alltag & Routinen', em:'☕'},
    {n:'Familie & Beziehungen', em:'👪'},
    {n:'Freundschaft & Kontakte', em:'🤝'},
    {n:'Wohnen & Nachbarschaft', em:'🏠'},
    {n:'Essen & Ernährung', em:'🍽️'},
    {n:'Gesundheit & Wohlbefinden', em:'💚'},
    {n:'Freizeit & Hobbys', em:'🎨'},
    {n:'Reisen & Urlaub', em:'✈️'},
    {n:'Geld & Konsum', em:'💶'},
    {n:'Medien & Digitales', em:'📱'},
    {n:'Umwelt & Nachhaltigkeit', em:'🌱'},
    {n:'Persönlichkeit & Werte', em:'🧭'},
    {n:'Gesellschaft & Aktuelles', em:'🗞️'},
  ]},
  { gruppe:'Beruf & Bildung', items:[
    {n:'Arbeit & Berufsalltag', em:'💼'},
    {n:'Bewerbung & Karriere', em:'📈'},
    {n:'Zusammenarbeit & Team', em:'👥'},
    {n:'Ausbildung & Weiterbildung', em:'🎓'},
    {n:'Work-Life-Balance', em:'⚖️'},
    {n:'Behörden & Formelles', em:'🏛️'},
  ]},
];
const EMOJI={}; BEREICHE.forEach(g=>g.items.forEach(b=>EMOJI[b.n]=b.em));

/* Beispiel-Themen (Detailinhalte folgen pro Bereich) */
const THEMEN=[
  { id:'gedaechtnis', titel:'Gedächtnis verbessern', bereich:'Gesundheit & Wohlbefinden', niveau:'bb',
    fragen:['Glaubst du, dass man sein Gedächtnis durch Techniken verbessern kann?','Welche Gedächtnistechniken kennst du?','Hast du schon eine Methode ausprobiert, um dir etwas zu merken?','Hat das Alter einen Einfluss auf das Gedächtnis?','Welche Rolle spielt die Ernährung für die geistige Leistung?','Wie wichtig ist regelmäßige geistige Aktivität?','Was hältst du von Gedächtnis-Apps – hilfreich oder Ablenkung?','Wie beeinflussen Stress und Schlafmangel das Gedächtnis?','Stärkt das Lernen einer Sprache das Gedächtnis? Warum?','Welchen Tipp gibst du jemandem, der sein Gedächtnis verbessern will?'],
    redemittel:[{h:'🗣️ Meinung ausdrücken',l:['Ich glaube, dass …','Meiner Meinung nach …','Ich finde es faszinierend, wie …']},{h:'🤝 Zustimmen & relativieren',l:['Das sehe ich genauso.','Da ist etwas dran, aber …','Es kommt darauf an, ob …']}],
    antworten:['Ich glaube, dass Gedächtnistraining wichtig für unser geistiges Wohlbefinden ist.','Eine ausgewogene Ernährung hat positive Effekte auf das Gedächtnis.','Regelmäßige Aktivität ist nicht nur für den Körper, sondern auch fürs Gedächtnis wichtig.'],
    vokabeln:[{w:'die Gedächtnistechnik',ue:'memory technique',bsp:'Mit einer Technik merkt man sich Namen leichter.'},{w:'kognitiv',ue:'cognitive',bsp:'Schach trainiert die kognitiven Fähigkeiten.'},{w:'die Ernährung',ue:'nutrition / diet',bsp:'Gesunde Ernährung hilft dem Gehirn.'},{w:'der Schlafmangel',ue:'sleep deprivation',bsp:'Bei Schlafmangel kann man sich schlecht konzentrieren.'},{w:'die Ablenkung',ue:'distraction',bsp:'Das Handy ist oft eine große Ablenkung.'},{w:'der Einfluss',ue:'influence',bsp:'Stress hat großen Einfluss auf das Gedächtnis.'}] },
  { id:'haustiere', titel:'Hund oder Katze?', bereich:'Persönlichkeit & Werte', niveau:'ab',
    fragen:['Bist du eher ein Hundemensch oder ein Katzenmensch?','Hast du ein Haustier? Welches hättest du gern?','Welches Tier passt zu deinem Charakter? Warum?','Was ist schöner: ein verspielter Hund oder eine unabhängige Katze?','Welche Vorteile und Nachteile hat ein Haustier im Alltag?','Sind Haustiere gut für Kinder? Warum?','Wie viel Zeit sollte man für ein Haustier haben?','Was kostet ein Haustier ungefähr im Monat?','Gibt es in deinem Heimatland typische Haustiere?','Lieber ein exotisches oder ein normales Haustier?'],
    redemittel:[{h:'❤️ Vorlieben nennen',l:['Ich bin eher ein …','Ich mag lieber …, weil …','Für mich passt … besser, weil …']},{h:'⚖️ Vergleichen',l:['… ist treuer als …','… ist unabhängiger als …','Beide haben Vor- und Nachteile.']}],
    antworten:['Ich bin eher ein Katzenmensch, weil Katzen ruhig und unabhängig sind.','Ein Hund passt zu mir, weil ich gern draußen bin.','Für Kinder sind Haustiere gut, weil sie Verantwortung lernen.'],
    vokabeln:[{w:'der Hundemensch',ue:'dog person',bsp:'Mein Bruder ist ein echter Hundemensch.'},{w:'treu',ue:'loyal',bsp:'Hunde sind sehr treu.'},{w:'unabhängig',ue:'independent',bsp:'Katzen sind ziemlich unabhängig.'},{w:'verspielt',ue:'playful',bsp:'Der junge Hund ist sehr verspielt.'},{w:'die Verantwortung',ue:'responsibility',bsp:'Ein Haustier bedeutet viel Verantwortung.'},{w:'füttern',ue:'to feed',bsp:'Ich füttere die Katze jeden Morgen.'}] },
  { id:'aemter', titel:'Gespräche mit Ämtern', bereich:'Behörden & Formelles', niveau:'bb',
    fragen:['Welche Erfahrungen hast du mit deutschen Ämtern gemacht?','Welches Amt findest du am kompliziertesten und warum?','Was machst du, wenn du ein Formular nicht verstehst?','Wie bereitest du dich auf einen Termin vor?','Hast du schon einmal einen Termin verpasst?','Sind die Beamten eher freundlich oder streng?','Was würdest du an deutschen Ämtern verändern?','Wie wichtig ist es, höflich und geduldig zu bleiben?','Welche Unterlagen braucht man in deinem Heimatland für Anträge?','Welchen Tipp gibst du jemandem beim ersten Amtsbesuch?'],
    redemittel:[{h:'🏢 Höflich am Amt',l:['Könnten Sie mir bitte helfen?','Ich möchte einen Antrag auf … stellen.','Könnten Sie das bitte wiederholen?']},{h:'💬 Erfahrung & Meinung',l:['Meine Erfahrung mit … war …','Am meisten stört mich, dass …','Zum Glück hat am Ende alles geklappt.']}],
    antworten:['Ich finde das Bürgeramt am kompliziertesten, weil man lange auf Termine wartet.','Wenn ich ein Formular nicht verstehe, frage ich jemanden oder nutze ein Wörterbuch.','Mein Tipp: früh einen Termin buchen und freundlich bleiben.'],
    vokabeln:[{w:'das Amt',ue:'public office',bsp:'Das Amt ist nur vormittags geöffnet.'},{w:'der Antrag',ue:'application',bsp:'Ich stelle einen Antrag auf einen Pass.'},{w:'das Formular',ue:'form',bsp:'Bitte füllen Sie das Formular aus.'},{w:'die Unterlagen',ue:'documents',bsp:'Bringen Sie alle Unterlagen mit.'},{w:'die Bescheinigung',ue:'certificate',bsp:'Ich brauche eine Bescheinigung vom Arbeitgeber.'},{w:'zuständig sein',ue:'to be responsible',bsp:'Welches Amt ist dafür zuständig?'}] },
];

const S={ niveau:'all', bereich:null, sel:null };

function themenVon(bereich){ return THEMEN.filter(t=>t.bereich===bereich && (S.niveau==='all'||t.niveau===S.niveau)); }
function anzahl(bereich){ return themenVon(bereich).length; }

function renderNiv(){
  document.getElementById('niv').innerHTML=[['all','Alle'],['ab','A2·B1'],['bb','B1·B2'],['bc','B2·C1']]
    .map(([k,l])=>`<button data-n="${k}" class="${S.niveau===k?'on':''}" onclick="setNiv('${k}')">${l}</button>`).join('');
}
function renderBereiche(){
  const q=document.getElementById('suche').value.trim().toLowerCase();
  let html='';
  BEREICHE.forEach(g=>{
    const items=g.items.filter(b=>!q || b.n.toLowerCase().includes(q));
    if(!items.length) return;
    html+=`<div class="gruppe-h">${g.gruppe}</div>`;
    html+=items.map(b=>{ const c=anzahl(b.n);
      return `<button class="b-item ${S.bereich===b.n?'on':''} ${c?'':'leer'}" onclick="selBereich('${b.n.replace(/'/g,"\\'")}')">
        <span class="em">${b.em}</span><span class="bn">${b.n}</span><span class="ct">${c}</span></button>`;
    }).join('');
  });
  document.getElementById('bereiche').innerHTML=html||`<div style="padding:16px 10px;color:var(--weich);font-size:.9rem">Kein Bereich gefunden.</div>`;
}
function renderDetail(){
  const d=document.getElementById('detail');
  if(S.sel){ const t=THEMEN.find(x=>x.id===S.sel); return renderThema(d,t); }
  if(S.bereich){ return renderBereichView(d,S.bereich); }
  d.innerHTML=`<div class="welc"><div class="em">🗣️</div>
    <h1>Worüber möchtet ihr sprechen?</h1>
    <p>Wählt oben euer <b>Niveau</b> – die ganze Seite färbt sich dann in eurer Stufe. Sucht euch links einen <b>Bereich</b> aus und legt los.</p>
    <div class="hint">👈 Bereich links wählen</div></div>`;
}
function renderBereichView(d,b){
  const ts=themenVon(b);
  const karten = ts.length
    ? `<div class="karten">${ts.map(t=>`<button class="karte" onclick="selThema('${t.id}')">
        <div class="kt">${t.titel}</div>
        <div class="kmeta"><span class="lv ${BAENDER[t.niveau].cls}">${BAENDER[t.niveau].label}</span> · ${t.fragen.length} Fragen</div>
        <div class="pfeil">Öffnen →</div></button>`).join('')}</div>`
    : `<div class="keine">📝 In diesem Bereich sind noch keine Themen hinterlegt${S.niveau!=='all'?' für dieses Niveau':''} – wir füllen sie Schritt für Schritt.</div>`;
  d.innerHTML=`<div class="b-kopf"><div class="em">${EMOJI[b]||'💬'}</div>
    <div><h1>${b}</h1><div class="sub">Freies Sprechen &amp; Debatten</div></div></div>${karten}`;
}
function renderThema(d,t){
  const fragen=t.fragen.map((f,i)=>`<div class="frage" onclick="this.classList.toggle('aktiv')"><div class="nr">${i+1}</div><div class="ft">${f}</div></div>`).join('');
  const rm=t.redemittel.map(r=>`<div class="rm-karte"><h4>${r.h}</h4><ul>${r.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  const antw=`<div class="rm-karte"><h4>💡 So kannst du antworten</h4><ul>${t.antworten.map(a=>`<li>„${a}"</li>`).join('')}</ul></div>`;
  const vok=t.vokabeln.map(v=>`<div class="vok" onclick="this.classList.toggle('show')"><div class="w">${v.w}</div><div class="bsp">${v.bsp}</div><div class="ue">→ ${v.ue}</div><div class="tipp">tippen für Übersetzung</div></div>`).join('');
  d.innerHTML=`<button class="zurueck" onclick="zurueckZumBereich()">‹ ${t.bereich}</button>
    <div class="d-kopf"><div><div class="d-breadcrumb">${t.bereich}</div><h1 class="d-titel">${t.titel}</h1></div>
      <div class="d-tools"><span class="lv ${BAENDER[t.niveau].cls}" style="font-size:.84rem;padding:5px 12px">${BAENDER[t.niveau].label}</span>
      <button class="btn" id="btn-praesi" onclick="togglePraesi()">🖥️ Präsentieren</button></div></div>
    <div class="sek"><div class="sek-h">💬 Fragen für die Gruppe</div>${fragen}</div>
    <div class="sek"><div class="sek-h">🧩 Redemittel &amp; Antworten</div><div class="rm-grid">${rm}${antw}</div></div>
    <div class="sek"><div class="sek-h">📚 Vokabeln · tippen für Übersetzung</div><div class="vok-grid">${vok}</div></div>`;
}

function setNiv(k){ S.niveau=k; document.body.dataset.niveau=k;
  if(S.sel){ const t=THEMEN.find(x=>x.id===S.sel); if(t && k!=='all' && t.niveau!==k) S.sel=null; }
  renderNiv(); renderBereiche(); renderDetail(); }
function selBereich(b){ S.bereich=b; S.sel=null; renderBereiche(); renderDetail(); document.getElementById('detail').scrollTop=0; }
function selThema(id){ S.sel=id; renderDetail(); document.getElementById('detail').scrollTop=0; }
function zurueckZumBereich(){ S.sel=null; renderDetail(); }
function toggleListe(){ document.body.classList.toggle('zu'); const z=document.getElementById('zieher'); if(z) z.textContent=document.body.classList.contains('zu')?'›':'‹'; }
function togglePraesi(){ document.body.classList.toggle('praesi'); const on=document.body.classList.contains('praesi'); const b=document.getElementById('btn-praesi'); if(b){ b.textContent=on?'✕ Normal':'🖥️ Präsentieren'; b.classList.toggle('btn-prim',on);} }

document.getElementById('suche').addEventListener('input',renderBereiche);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.body.classList.contains('praesi')) togglePraesi(); });

renderNiv(); renderBereiche(); renderDetail();
</script>
</body>
</html>
