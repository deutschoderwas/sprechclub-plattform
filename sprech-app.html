<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deutschoderwas · Sprechclub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1B16; --soft:#6E6456; --line:#EADFC9; --bg:#FBF5EA; --card:#FFFFFF;
  --primary:#D42A21; --turq:#1B9BC0; --accent:#FFCE00; --green:#4E9E12; --coral:#E8302A;
  --radius:20px; --shadow:0 3px 14px rgba(30,27,22,.07); --shadow-m:0 14px 32px rgba(30,27,22,.12);
  /* Niveau-Akzent – je Niveau überschrieben; Standard = Marken-Türkis (warm & freundlich) */
  --akz:#1B9BC0; --akz-soft:#DFF1F4; --akz-text:#10627A; --akz-tint:#FBF5EA;
}
body[data-niveau="ab"]{ --akz:#1B9BC0; --akz-soft:#DBF0F3; --akz-text:#0F5C6B; --akz-tint:#F4FAF7; } /* Türkis */
body[data-niveau="bb"]{ --akz:#D39A00; --akz-soft:#FBEFC2; --akz-text:#6B4E00; --akz-tint:#FCF6E2; } /* Gold */
body[data-niveau="bc"]{ --akz:#E8302A; --akz-soft:#FBDDD9; --akz-text:#9A1C16; --akz-tint:#FCF0EB; } /* Koralle */

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--akz-tint);-webkit-font-smoothing:antialiased;transition:background .25s;}
h1,h2,h3,h4{font-family:'Space Grotesk','Segoe UI',sans-serif;}

/* Niveau-Akzentlinie oben */
.band{height:5px;background:linear-gradient(90deg,var(--akz),color-mix(in srgb,var(--akz) 45%,#fff));transition:background .25s;}

/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.marke{font-family:'Space Grotesk';font-weight:700;font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:9px;}
.marke .logo{width:34px;height:34px;border-radius:999px;object-fit:cover;border:2px solid var(--turq);background:var(--akz-soft);flex:none;}
.marke .wm{color:var(--ink);}
.marke .club{color:var(--turq);margin-left:5px;}
.marke small{display:block;font-family:'Inter';font-weight:600;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-top:2px;}
.nivbadge{font-family:'Space Grotesk';font-weight:600;font-size:.82rem;border:1px solid var(--akz);color:var(--akz-text);background:var(--akz-soft);border-radius:999px;padding:3px 12px;}
.suche{flex:1 1 200px;position:relative;min-width:150px;}
.suche input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px 10px 38px;font-family:'Inter';font-size:.95rem;color:var(--ink);outline:none;transition:.12s;}
.suche input:focus{border-color:var(--akz);background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--akz) 15%,transparent);}
.suche .lupe{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soft);}
.niv{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.niv .cap{font-weight:600;font-size:.78rem;color:var(--soft);}
.niv button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-family:'Space Grotesk';font-weight:600;font-size:.82rem;cursor:pointer;color:var(--ink);transition:.12s;display:inline-flex;align-items:center;gap:7px;}
.niv button .dot{width:9px;height:9px;border-radius:999px;display:inline-block;}
.niv button[data-n="ab"] .dot{background:#1B9BC0;}
.niv button[data-n="bb"] .dot{background:#C9A200;}
.niv button[data-n="bc"] .dot{background:#D42A21;}
.niv button[data-n="all"] .dot{background:var(--soft);}
.niv button:hover{border-color:var(--akz);}
.niv button.on{color:#fff;border-color:transparent;}
.niv button[data-n="ab"].on{background:#1B9BC0;} .niv button[data-n="bb"].on{background:#C9A200;} .niv button[data-n="bc"].on{background:#D42A21;} .niv button[data-n="all"].on{background:var(--ink);}
.niv button.on .dot{background:#fff;}
.reihe{display:inline-flex;align-items:center;gap:7px;margin-left:auto;background:var(--akz-soft);color:var(--akz-text);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.84rem;}

/* ---------- Layout ---------- */
.wrap{display:grid;grid-template-columns:300px 1fr;max-width:1500px;margin:0 auto;min-height:calc(100vh - 95px);position:relative;transition:grid-template-columns .2s;}
body.zu .wrap{grid-template-columns:0 1fr;}
.liste{border-right:1px solid var(--line);background:var(--card);padding:16px 12px 40px;overflow:auto;position:relative;}
body.zu .liste{display:none;}
.niv-ribbon{display:flex;align-items:center;gap:9px;background:var(--akz-soft);border:1px solid color-mix(in srgb,var(--akz) 35%,transparent);border-radius:12px;padding:9px 12px;margin:0 2px 12px;font-family:'Space Grotesk';font-weight:600;font-size:.9rem;color:var(--akz-text);}
.niv-ribbon .pt{width:12px;height:12px;border-radius:999px;}
.gruppe-h{font-weight:700;font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--soft);padding:14px 10px 8px;}
.b-item{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 11px;margin-bottom:2px;cursor:pointer;transition:.1s;display:flex;align-items:center;gap:11px;}
.b-item:hover{background:var(--bg);}
.b-item.on{background:var(--akz-soft);border-color:color-mix(in srgb,var(--akz) 30%,transparent);}
.b-item .em{flex:none;width:32px;height:32px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.b-item.on .em{background:#fff;}
.b-item .bn{flex:1;font-weight:600;font-size:.92rem;line-height:1.2;color:var(--ink);}
.b-item .ct{flex:none;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;color:var(--soft);background:var(--bg);border-radius:999px;padding:1px 8px;}
.b-item.on .ct{color:var(--akz-text);background:#fff;}
.b-item.leer .bn,.b-item.leer .ct{opacity:.5;}

.zieher{position:absolute;top:14px;right:-13px;z-index:20;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--soft);box-shadow:var(--shadow);}
.zieher:hover{color:var(--akz);border-color:var(--akz);}
.auf{position:fixed;left:14px;top:106px;z-index:40;display:none;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-m);border-radius:999px;padding:8px 14px;font-family:'Space Grotesk';font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink);}
body.zu .auf{display:inline-flex;}

/* ---------- Haupt ---------- */
.detail{padding:28px 36px 70px;overflow:auto;}
.welc{max-width:640px;margin:7vh auto 0;text-align:center;}
.welc .em{font-size:2.6rem;width:94px;height:94px;border-radius:999px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.welc h1{font-size:2rem;margin:10px 0 10px;letter-spacing:-.01em;}
.welc p{color:var(--soft);font-size:1.05rem;line-height:1.6;margin:0 auto;max-width:500px;}
.welc .hint{margin-top:22px;display:inline-flex;gap:8px;align-items:center;background:var(--akz);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow-m);}

.b-kopf{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.b-kopf .em{width:50px;height:50px;border-radius:14px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.b-kopf h1{font-size:1.7rem;margin:0;letter-spacing:-.01em;}
.b-kopf .sub{color:var(--soft);font-size:.88rem;font-weight:600;}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:15px;margin-top:22px;}
.karte{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;cursor:pointer;transition:.14s;box-shadow:var(--shadow);}
.karte:hover{border-color:var(--akz);box-shadow:var(--shadow-m);transform:translateY(-2px);}
.karte .kem{width:40px;height:40px;border-radius:12px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:12px;}
.karte .kt{font-family:'Space Grotesk';font-weight:600;font-size:1.12rem;line-height:1.2;}
.karte .kmeta{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--soft);font-size:.82rem;}
.karte .pfeil{margin-top:13px;color:var(--akz-text);font-weight:600;font-size:.84rem;}
.keine{margin-top:26px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--soft);}

.lv{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;border-radius:999px;padding:2px 9px;white-space:nowrap;}
.lv-ab{background:#E1F2F7;color:#0F5C6B;} .lv-bb{background:#FBF1C4;color:#6B4E00;} .lv-bc{background:#FBE3E1;color:#9A1C16;}

.zurueck{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--akz-text);font-family:'Space Grotesk';font-weight:600;font-size:.9rem;cursor:pointer;padding:4px 0;margin-bottom:10px;}
.d-kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.d-breadcrumb{font-size:.82rem;color:var(--soft);font-weight:600;}
.d-titel{font-family:'Space Grotesk';font-weight:700;font-size:2rem;line-height:1.1;margin:4px 0 0;letter-spacing:-.01em;}
.d-tools{display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-family:'Space Grotesk';font-weight:600;font-size:.84rem;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:.12s;}
.btn:hover{border-color:var(--akz);}
.btn-prim{background:var(--akz);color:#fff;border-color:transparent;}

.sek{margin-top:28px;}
.sek-h{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-weight:700;font-size:.94rem;letter-spacing:0;text-transform:none;color:#fff;background:var(--akz);border-radius:999px;padding:8px 17px;margin-bottom:16px;box-shadow:var(--shadow);}
.frage{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);}
.frage:hover{border-color:var(--akz);}
.frage.aktiv{border-color:var(--akz);box-shadow:inset 3px 0 0 var(--akz),var(--shadow);}
.frage .nr{flex:none;width:28px;height:28px;border-radius:999px;background:var(--akz-soft);color:var(--akz-text);font-family:'Space Grotesk';font-weight:700;font-size:.86rem;display:flex;align-items:center;justify-content:center;}
.frage.aktiv .nr{background:var(--akz);color:#fff;}
.frage .ft{font-size:1.02rem;line-height:1.5;padding-top:3px;}
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.rm-karte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.rm-karte h4{font-family:'Space Grotesk';font-weight:600;font-size:.98rem;margin:0 0 10px;color:var(--akz-text);display:flex;align-items:center;gap:8px;}
.rm-karte ul{margin:0;padding:0;list-style:none;}
.rm-karte li{font-size:.97rem;line-height:1.45;padding:7px 0;border-bottom:1px solid var(--line);}
.rm-karte li:last-child{border-bottom:none;}
.vok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:11px;}
.vok{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);}
.vok:hover{border-color:var(--akz);}
.vok .w{font-family:'Space Grotesk';font-weight:600;font-size:1.04rem;}
.vok .bsp{font-size:.86rem;color:var(--soft);margin-top:4px;line-height:1.4;}
.vok .ue{font-size:.92rem;color:var(--akz-text);font-weight:600;margin-top:6px;display:none;}
.vok.show .ue{display:block;}
.vok .tipp{font-size:.72rem;color:var(--soft);margin-top:6px;}
.vok.show .tipp{display:none;}

/* ---- Visuelle Auffrischung (Bildchen & Eyecatcher) ---- */
.hero{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;background:linear-gradient(125deg,var(--akz-soft),#FFFDF7 74%);border:1.5px solid var(--line);border-radius:28px;padding:40px 44px;box-shadow:var(--shadow-m);max-width:940px;margin:4vh auto 0;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;top:-70px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--akz) 20%,transparent),transparent 70%);}
.hero-text{position:relative;z-index:1;}
.hero .eyebrow{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:.76rem;letter-spacing:.05em;color:var(--akz-text);background:#fff;border:1px solid color-mix(in srgb,var(--akz) 30%,transparent);border-radius:999px;padding:5px 13px;margin-bottom:14px;}
.hero h1{font-size:2.4rem;margin:0 0 12px;letter-spacing:-.015em;line-height:1.06;}
.hero p{color:var(--soft);font-size:1.05rem;line-height:1.55;margin:0;max-width:440px;}
.hero .hint{margin-top:18px;display:inline-flex;gap:8px;align-items:center;background:var(--akz);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow-m);}
.hero-art{width:190px;max-width:34vw;position:relative;z-index:1;}
.hero-art svg{width:100%;height:auto;display:block;}
@media(max-width:680px){.hero{grid-template-columns:1fr;text-align:center;padding:26px 24px;}.hero p{margin:0 auto;}.hero-art{margin:6px auto 0;width:150px;}}
.karte{position:relative;overflow:hidden;}
.karte::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--akz),transparent);}
.karte .kem{background:linear-gradient(135deg,var(--akz-soft),#fff)!important;border:1px solid color-mix(in srgb,var(--akz) 22%,transparent);}
.b-kopf{background:linear-gradient(120deg,var(--akz-soft),#fff 70%);border:1px solid var(--line);border-radius:22px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:6px;}
.b-kopf .em{background:#fff;border:1px solid color-mix(in srgb,var(--akz) 25%,transparent);box-shadow:var(--shadow);}
body.praesi .top .suche,body.praesi .liste,body.praesi .reihe{display:none;}
body.praesi .wrap{grid-template-columns:1fr;}
body.praesi .auf{display:none;}
body.praesi .detail{padding:30px max(40px,6vw) 80px;}
body.praesi .d-titel{font-size:2.5rem;}
body.praesi .frage .ft{font-size:1.18rem;}

@media(max-width:860px){
  .wrap{grid-template-columns:1fr;}
  .liste{border-right:none;border-bottom:1px solid var(--line);max-height:40vh;}
  body.zu .liste{display:none;}
  .rm-grid{grid-template-columns:1fr;}
  .detail{padding:20px 18px 60px;}
  .zieher{display:none;}
  .reihe{margin-left:0;}
}
</style>
</head>
<body data-niveau="all">
<div class="band"></div>

<div class="top">
  <div class="top-row">
    <div class="marke"><span class="wm">deutschoderwas</span><span class="club">club</span><span class="nivbadge" id="nivbadge">alle Niveaus</span></div>

</div>

    redemittel:[{h:'❤️ Vorlieben nennen',l:['Ich bin eher ein …','Ich mag lieber …, weil …','Für mich passt … besser, weil …']},{h:'⚖️ Vergleichen',l:['… ist treuer als …','… ist unabhängiger als …','Beide haben Vor- und Nachteile.']}],
    antworten:['Ich bin eher ein Katzenmensch, weil Katzen ruhig und unabhängig sind.','Ein Hund passt zu mir, weil ich gern draußen bin.','Für Kinder sind Haustiere gut, weil sie Verantwortung lernen.'],
    vokabeln:[{w:'der Hundemensch',ue:'dog person',bsp:'Mein Bruder ist ein echter Hundemensch.'},{w:'treu',ue:'loyal',bsp:'Hunde sind sehr treu.'},{w:'unabhängig',ue:'independent',bsp:'Katzen sind ziemlich unabhängig.'},{w:'verspielt',ue:'playful',bsp:'Der junge Hund ist sehr verspielt.'},{w:'die Verantwortung',ue:'responsibility',bsp:'Ein Haustier bedeutet viel Verantwortung.'},{w:'füttern',ue:'to feed',bsp:'Ich füttere die Katze jeden Morgen.'}] },
  { id:'aemter', titel:'Gespräche mit Ämtern', bereich:'Behörden & Formelles', niveau:'bb',
    fragen:['Welche Erfahrungen hast du mit deutschen Ämtern gemacht?','Welches Amt findest du am kompliziertesten und warum?','Was machst du, wenn du ein Formular nicht verstehst?','Wie bereitest du dich auf einen Termin vor?','Hast du schon einmal einen Termin verpasst?','Sind die Beamten eher freundlich oder streng?','Was würdest du an deutschen Ämtern verändern?','Wie wichtig ist es, höflich und geduldig zu bleiben?','Welche Unterlagen braucht man in deinem Heimatland für Anträge?','Welchen Tipp gibst du jemandem beim ersten Amtsbesuch?'],
    redemittel:[{h:'🏢 Höflich am Amt',l:['Könnten Sie mir bitte helfen?','Ich möchte einen Antrag auf … stellen.','Könnten Sie das bitte wiederholen?']},{h:'💬 Erfahrung & Meinung',l:['Meine Erfahrung mit … war …','Am meisten stört mich, dass …','Zum Glück hat am Ende alles geklappt.']}],
    antworten:['Ich finde das Bürgeramt am kompliziertesten, weil man lange auf Termine wartet.','Wenn ich ein Formular nicht verstehe, frage ich jemanden oder nutze ein Wörterbuch.','Mein Tipp: früh einen Termin buchen und freundlich bleiben.'],
    vokabeln:[{w:'das Amt',ue:'public office',bsp:'Das Amt ist nur vormittags geöffnet.'},{w:'der Antrag',ue:'application',bsp:'Ich stelle einen Antrag auf einen Pass.'},{w:'das Formular',ue:'form',bsp:'Bitte füllen Sie das Formular aus.'},{w:'die Unterlagen',ue:'documents',bsp:'Bringen Sie alle Unterlagen mit.'},{w:'die Bescheinigung',ue:'certificate',bsp:'Ich brauche eine Bescheinigung vom Arbeitgeber.'},{w:'zuständig sein',ue:'to be responsible',bsp:'Welches Amt ist dafür zuständig?'}] },
];

const ART=`<svg viewBox="0 0 220 182" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <circle cx="198" cy="34" r="14" fill="#FFCE00"/>
  <circle cx="18" cy="152" r="9" fill="#E8302A"/>
  <circle cx="204" cy="150" r="6" style="fill:var(--akz-soft)"/>
  <rect x="12" y="20" width="134" height="86" rx="26" style="fill:var(--akz)"/>
  <polygon points="46,106 46,134 84,106" style="fill:var(--akz)"/>
  <circle cx="55" cy="63" r="9" fill="#fff"/><circle cx="82" cy="63" r="9" fill="#fff"/><circle cx="109" cy="63" r="9" fill="#fff"/>
  <rect x="100" y="84" width="112" height="72" rx="24" fill="#fff" style="stroke:var(--akz)" stroke-width="4"/>
  <polygon points="178,156 178,182 150,156" fill="#fff"/>
  <line x1="121" y1="108" x2="194" y2="108" stroke="#FFCE00" stroke-width="9" stroke-linecap="round"/>
  <line x1="121" y1="131" x2="174" y2="131" stroke="#E8302A" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
</svg>`;
const S={ niveau:'all', bereich:null, sel:null };
function themenVon(b){ return THEMEN.filter(t=>t.bereich===b && (S.niveau==='all'||t.niveau===S.niveau)); }
function anzahl(b){ return themenVon(b).length; }

function renderNiv(){
  document.getElementById('niv').innerHTML=`<span class="cap">Niveau:</span>`+[['all','Alle'],['ab','A2·B1'],['bb','B1·B2'],['bc','B2·C1']]
    .map(([k,l])=>`<button data-n="${k}" class="${S.niveau===k?'on':''}" onclick="setNiv('${k}')"><span class="dot"></span>${l}</button>`).join('');
  document.getElementById('nivbadge').textContent = S.niveau==='all' ? 'alle Niveaus' : BAENDER[S.niveau].label;
}
function nivRibbon(){
  if(S.niveau==='all') return `<div class="niv-ribbon"><span class="pt" style="background:var(--soft)"></span>Alle Niveaus</div>`;
  const b=BAENDER[S.niveau];
  return `<div class="niv-ribbon"><span class="pt" style="background:${b.farbe}"></span>Niveau ${b.label} · ${b.wort}</div>`;
}
function renderBereiche(){
  const q=document.getElementById('suche').value.trim().toLowerCase();
  let html=nivRibbon();
  BEREICHE.forEach(g=>{
    const items=g.items.filter(b=>!q||b.n.toLowerCase().includes(q));
    if(!items.length) return;
    html+=`<div class="gruppe-h">${g.gruppe}</div>`;
    html+=items.map(b=>{ const c=anzahl(b.n);
      return `<button class="b-item ${S.bereich===b.n?'on':''} ${c?'':'leer'}" onclick="selBereich('${b.n.replace(/'/g,"\\'")}')">
        <span class="em" style="background:${g.farbe}">${b.em}</span><span class="bn">${b.n}</span><span class="ct">${c}</span></button>`;}).join('');
  });
  document.getElementById('bereiche').innerHTML=html;
}
function renderDetail(){
  const d=document.getElementById('detail');
  if(S.sel){ return renderThema(d, THEMEN.find(x=>x.id===S.sel)); }
  if(S.bereich){ return renderBereichView(d,S.bereich); }
  d.innerHTML=`<div class="hero"><div class="hero-text">
      <div class="eyebrow">🗣️ Freies Sprechen & Debatten</div>
      <h1>Worüber möchtet ihr sprechen?</h1>
      <p>Wählt oben euer <b>Niveau</b> – die ganze Seite stellt sich darauf ein. Sucht euch links einen <b>Bereich</b> aus und legt los.</p>
      <div class="hint">👈 Bereich links wählen</div>
    </div><div class="hero-art">${ART}</div></div>`;
}
function renderBereichView(d,b){
  const ts=themenVon(b);
  const karten = ts.length
    ? `<div class="karten">${ts.map(t=>`<button class="karte" onclick="selThema('${t.id}')"><div class="kem">${EMOJI[t.bereich]||'💬'}</div><div class="kt">${t.titel}</div>
        <div class="kmeta"><span class="lv ${BAENDER[t.niveau].cls}">${BAENDER[t.niveau].label}</span> · ${t.fragen.length} Fragen</div>
        <div class="pfeil">Öffnen →</div></button>`).join('')}</div>`
    : `<div class="keine">📝 In diesem Bereich sind noch keine Themen hinterlegt${S.niveau!=='all'?' für dieses Niveau':''} – wir füllen sie Schritt für Schritt.</div>`;
  d.innerHTML=`<div class="b-kopf"><div class="em">${EMOJI[b]||'💬'}</div>
    <div><h1>${b}</h1><div class="sub">Freies Sprechen &amp; Debatten</div></div></div>${karten}`;
}
function renderThema(d,t){
  const fragen=t.fragen.map((f,i)=>`<div class="frage" onclick="this.classList.toggle('aktiv')"><div class="nr">${i+1}</div><div class="ft">${f}</div></div>`).join('');
  const rm=t.redemittel.map(r=>`<div class="rm-karte"><h4>${r.h}</h4><ul>${r.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  const antw=`<div class="rm-karte"><h4>💡 So kannst du antworten</h4><ul>${t.antworten.map(a=>`<li>„${a}"</li>`).join('')}</ul></div>`;
  const vok=t.vokabeln.map(v=>`<div class="vok" onclick="this.classList.toggle('show')"><div class="w">${v.w}</div><div class="bsp">${v.bsp}</div><div class="ue">→ ${v.ue}</div><div class="tipp">tippen für Übersetzung</div></div>`).join('');
  d.innerHTML=`<button class="zurueck" onclick="zurueckZumBereich()">‹ ${t.bereich}</button>
    <div class="d-kopf"><div><div class="d-breadcrumb">${t.bereich}</div><h1 class="d-titel">${t.titel}</h1></div>
      <div class="d-tools"><span class="lv ${BAENDER[t.niveau].cls}" style="font-size:.84rem;padding:4px 12px">${BAENDER[t.niveau].label}</span>
      <button class="btn" id="btn-praesi" onclick="togglePraesi()">🖥️ Präsentieren</button></div></div>
    <div class="sek"><div class="sek-h">💬 Fragen für die Gruppe</div>${fragen}</div>
    <div class="sek"><div class="sek-h">🧩 Redemittel &amp; Antworten</div><div class="rm-grid">${rm}${antw}</div></div>
    <div class="sek"><div class="sek-h">📚 Vokabeln · tippen für Übersetzung</div><div class="vok-grid">${vok}</div></div>`;
}

function setNiv(k){ S.niveau=k; document.body.dataset.niveau=k;
  if(S.sel){ const t=THEMEN.find(x=>x.id===S.sel); if(t&&k!=='all'&&t.niveau!==k) S.sel=null; }
  renderNiv(); renderBereiche(); renderDetail(); }
function selBereich(b){ S.bereich=b; S.sel=null; renderBereiche(); renderDetail(); document.getElementById('detail').scrollTop=0; }
function selThema(id){ S.sel=id; renderDetail(); document.getElementById('detail').scrollTop=0; }
function zurueckZumBereich(){ S.sel=null; renderDetail(); }
function toggleListe(){ document.body.classList.toggle('zu'); const z=document.getElementById('zieher'); if(z) z.textContent=document.body.classList.contains('zu')?'›':'‹'; }
function togglePraesi(){ document.body.classList.toggle('praesi'); const on=document.body.classList.contains('praesi'); const b=document.getElementById('btn-praesi'); if(b){ b.textContent=on?'✕ Normal':'🖥️ Präsentieren'; b.classList.toggle('btn-prim',on);} }

document.getElementById('suche').addEventListener('input',renderBereiche);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.body.classList.contains('praesi')) togglePraesi(); });
renderNiv(); renderBereiche(); renderDetail();
</script>
</body>
</html>
