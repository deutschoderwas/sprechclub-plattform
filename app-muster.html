<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   deutschoderwas — App, Muster der Startseite (2. Fassung)

   Julia, 28.10.2026: "Kannst du das noch robuster machen? ... Soll
   ich vielleicht etwas dafuer installieren dass es wirklich
   professionell und robust ausschaut? Als ob es mir ein Webdesigner
   gemacht hat."

   Installiert werden musste nichts ausser einem Symbolsatz. Was den
   Unterschied macht, steht hier — und es ist Handwerk, kein Werkzeug:

   1. ECHTE SYMBOLE statt Emoji. Emoji sehen auf jedem Geraet anders
      aus (Apple zeichnet sie bunt und plastisch, Android flach,
      Windows wieder anders) und verraten sofort, dass niemand das
      gestaltet hat. Hier liegen 24 Zeichen aus Lucide inline als
      <symbol>: ein Satz, eine Strichstaerke, eine Sprache, und sie
      nehmen die Farbe ihres Textes an (currentColor). MIT-Lizenz.
   2. SICHERE RAENDER. env(safe-area-inset-*) — ohne das sitzt die
      untere Leiste auf dem iPhone unter dem Strich zum Entsperren,
      und genau daran erkennt man eine Webseite im App-Kostuem.
   3. KEIN BROWSER-VERHALTEN. Kein blaues Aufblitzen beim Tippen,
      kein Markieren von Beschriftungen, kein Ueberziehen der Seite
      beim Scrollen am Rand.
   4. ANTWORT AUF JEDE BERUEHRUNG. Jeder Knopf wird beim Druecken
      kurz kleiner. Das ist der Unterschied zwischen "es passiert
      etwas" und "hat es den Klick genommen?".
   5. LADEN OHNE SPRINGEN. Was aus dem Netz kommt, hat vorher einen
      grauen Platzhalter in genau seiner Groesse. Nichts rutscht
      nach, wenn die Daten da sind.
   6. KEINE NAMEN, DIE SICH TREFFEN. Beim Pruefen trugen die Zeichen
      in der unteren Leiste ploetzlich den dunklen Verlauf der grossen
      Karte: die Karte hiess .gross, und die groessere Zeichengroesse
      hiess .ic.gross — beide trafen dasselbe Element. Die Karte heisst
      jetzt .wochenkarte, die Groessen .ic-gross und .ic-klein. Genau
      solche Zusammenstoesse sind es, die eine Oberflaeche an einem
      Geraet heil und am naechsten kaputt aussehen lassen.

   7. NICHT ZU VIEL. Julia, 28.10.2026, mit vier Bildschirmen von
      Finanzguru: "schau dir bitte nochmal die Professionalitaet und
      die Staerke dieser App an, merkst du das? ... so muss es auch
      bei uns sein: NICHT ZU VIEL."

      Stimmt: jeder ihrer Bildschirme traegt vier Bloecke, nicht mehr.
      Diese Startseite trug acht. Geblieben sind vier — die Woche, Frag
      Amanda, die Fertigkeiten, der Unterricht. Wort der Woche,
      Weitermachen und der Podcast gehoeren unter "Üben" und "Medien",
      nicht auf die erste Seite. Was hier steht, ist die Antwort auf
      "wo stehe ich und was ist als Naechstes dran" — alles andere
      verduennt sie nur.

   8. EIN MASSRASTER. Alle Abstaende sind Vielfache von 4, alle
      Rundungen aus einer Leiter. Sieht man nicht einzeln, aber man
      sieht, wenn es fehlt.

   FARBEN AUS DEM LOGO, 28.10.2026. Julia: "Koennten wir die Farbe
   etwas tuerkiser machen? das ist ja mein Logo, das sind meine
   eigentlichen Farben." Aus dem Logo gemessen: der Kreis traegt
   #80D8F0 (helles Himmel-Tuerkis) und eine Mintzone #A8E8D8. Daraus
   ist hier eine Leiter gebaut — #80D8F0 hell, #3FBDDC mittel,
   #1FA6C6 fuer Boegen auf Weiss, #0E6D85 fuer Text und Linien,
   #0A4E62 fuer das Ende der Verlaeufe. Das vorherige #0F766E war
   gruenstichig und hatte mit dem Logo wenig zu tun.

   Die Farben bleiben die Marke: Tuerkis #80D8F0/#3FBDDC als
   Signatur, Rot #DD0000 und Gold #FFCE00 als Akzente, Space Grotesk
   und Inter wie ueberall.
   ============================================================ */

:root{
  --grund:#F2EFE6; --karte:#FFFFFF;
  --ink:#14232A; --ink2:#5B6A70; --ink3:#93A2A8;
  --rand:#E8E2D4; --rand2:#F1ECE1;
  --tq:#80D8F0; --tq-d:#3FBDDC; --tq-tief:#0E6D85; --tq-t:#053A47; --tq-soft:#E8F7FC;
  --rot:#DD0000; --rot-soft:#FDECEB;
  --gold:#FFCE00; --gold-soft:#FFF4CC;
  /* Masse: alles Vielfache von 4 */
  --r1:12px; --r2:16px; --r3:20px; --r4:24px;
  --schatten:0 1px 2px rgba(20,35,42,.04), 0 8px 24px rgba(20,35,42,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--grund); color:var(--ink);
  font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
/* Nichts fuehlt sich so sehr nach Browser an wie ein blauer Kasten
   um ein Wort, das man nur antippen wollte. */
body, button{-webkit-tap-highlight-color:transparent}
button, .titel, .abschnitt, .kopfz h2, nav{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.025em;font-weight:700}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tq-tief);outline-offset:2px;border-radius:6px}

/* Jeder Knopf antwortet. */
.druck{transition:transform .13s cubic-bezier(.2,.7,.3,1), background-color .13s}
.druck:active{transform:scale(.973)}
@media (prefers-reduced-motion: reduce){
  .druck,.druck:active{transition:none;transform:none}
  .skel::after{animation:none}
}

/* Symbole */
.ic{width:20px;height:20px;flex:none;stroke-width:1.75;display:block}
.ic-gross{width:22px;height:22px}
.ic-klein{width:16px;height:16px}

.huelle{max-width:520px;margin:0 auto;padding:0 16px}

/* ---------- Kopfzeile ---------- */
.kopf{display:flex;align-items:center;gap:8px;
  padding:calc(12px + env(safe-area-inset-top)) 0 4px}
.kopf .platz{flex:1}
.kopf .knopf{width:40px;height:40px;border-radius:var(--r1);border:1px solid var(--rand);
  background:var(--karte);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.kopf .ich{width:40px;height:40px;border-radius:999px;border:none;
  background:linear-gradient(135deg,var(--tq),var(--tq-d));color:var(--tq-t);
  font-weight:700;font-size:14px;letter-spacing:.02em;cursor:pointer}

.titel{font-size:32px;line-height:1.12;margin:8px 0 4px}
.unter{display:flex;align-items:center;gap:6px;margin:0 0 16px;font-size:14px;color:var(--ink2)}
.unter .ic{color:var(--rot)}

/* ---------- Die grosse Karte ---------- */
.wochenkarte{background:linear-gradient(140deg,#0E6D85 0%,#0A4E62 100%);
  border-radius:var(--r4);padding:16px 20px 20px;color:#fff;
  box-shadow:0 12px 28px rgba(10,78,98,.26);display:block;width:100%;
  border:none;text-align:left;cursor:pointer}
.wochenkarte .reihe{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wochenkarte .marke{background:var(--gold);color:#1A1A1A;font-size:11px;font-weight:700;
  border-radius:6px;padding:3px 7px;letter-spacing:.03em}
.wochenkarte .was{font-size:14px;font-weight:600}
.wochenkarte .rechts{margin-left:auto;display:flex;align-items:center;gap:2px;
  font-size:13px;color:#A9DEEE;font-weight:500}
.wochenkarte .zahl{font-family:"Space Grotesk",sans-serif;font-size:34px;font-weight:700;
  line-height:1.06;font-variant-numeric:tabular-nums}
.wochenkarte .zahl small{font-size:14px;font-weight:400;color:#A9DEEE;margin-left:8px;
  font-family:Inter,sans-serif;letter-spacing:0}
.wochenkarte .balken{height:6px;border-radius:999px;background:rgba(255,255,255,.17);
  margin-top:16px;overflow:hidden}
.wochenkarte .balken i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--gold),#FFB020)}

/* ---------- Amanda fragen ----------
   Julia, 28.10.2026, mit einem Bild von Finanzguru: "siehst du das
   Feldchen oben, Stelle eine Frage? Sowas brauchen wir auch."

   Bei Finanzguru fragt man nach seinem Geld. Hier fragt man seine
   Lehrerin — und das ist der Unterschied, den die App ausmacht:
   zwischen zwei Live-Stunden ist Amanda da, rund um die Uhr, und
   antwortet wie im Unterricht. Darum steht das Feld weit oben und
   nicht irgendwo unter "mehr". */
.am{margin-top:20px}
.am .band{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.am .band .wer{display:flex;align-items:center;gap:7px;font-family:"Space Grotesk",sans-serif;
  font-size:17px;font-weight:700;color:var(--ink);flex:1;min-width:0}
.am .band .wer .ic{color:var(--tq-d)}
.am .band .mehr{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;
  color:var(--tq-tief);background:none;border:none;cursor:pointer;white-space:nowrap}
.am .feld{padding:14px 14px 13px}
.am .eingabe{display:flex;align-items:flex-end;gap:10px;background:#F6F3EB;
  border:1px solid var(--rand2);border-radius:var(--r2);padding:12px 12px 12px 14px}
.am textarea{flex:1;min-width:0;border:none;background:none;resize:none;outline:none;
  font-family:inherit;font-size:15px;line-height:1.45;color:var(--ink);
  max-height:96px;padding:0;margin:0}
.am textarea::placeholder{color:var(--ink3)}
.am .mikro{flex:none;width:36px;height:36px;border-radius:999px;border:none;background:none;
  color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.am .senden{flex:none;width:38px;height:38px;border-radius:999px;border:none;
  background:linear-gradient(135deg,var(--tq),var(--tq-d));color:var(--tq-t);
  display:grid;place-items:center;cursor:pointer}
.am .oder{margin:13px 0 9px;font-size:13px;color:var(--ink2)}
/* Zwei Spalten, nicht eine Liste untereinander: vier Vorschlaege
   gehoeren auf zwei Zeilen, sonst schiebt sich alles darunter weg. */
.am .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:340px){.am .chips{grid-template-columns:1fr}}
.am .chip{display:flex;align-items:center;gap:7px;min-width:0;text-align:left;background:#F6F3EB;
  border:1px solid var(--rand2);border-radius:var(--r1);padding:9px 13px;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.am .chip .ic{width:16px;height:16px;color:var(--tq-tief)}

/* ---------- Ringe ---------- */
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:var(--r3);
  box-shadow:var(--schatten)}
.ringkarte{padding:18px 0 14px;margin-top:12px}
.ringkarte .kopfz{padding:0 18px}
.kopfz{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.kopfz h2{font-size:16px;flex:1;min-width:0}
.kopfz .mehr{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;
  color:var(--tq-tief);background:none;border:none;padding:4px 0;cursor:pointer;white-space:nowrap}

/* Die Reihe laeuft bis an den Rand und darueber hinaus — mit einem
   weichen Auslauf rechts. Dass es weitergeht, zeigt man, man schneidet
   es nicht einfach ab. */
.ringfeld{position:relative}
.ringfeld::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 72%);pointer-events:none}
.ringe{display:flex;gap:4px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.ringe::-webkit-scrollbar{display:none}
.ring{flex:0 0 auto;width:76px;text-align:center;border:none;background:none;padding:2px 0 4px;
  cursor:pointer;scroll-snap-align:center}
/* display:block ist hier kein Schoenheitsfehler, sondern noetig: ein
   <span> ist inline, Breite und Hoehe gelten nicht, und die Scheibe
   darin richtete sich an der Textzeile statt am Ring aus — sie sass
   als hohe Pille rechts neben der Mitte. */
.ring .kreis{position:relative;display:block;width:62px;height:62px;margin:0 auto}
.ring svg.bogen{transform:rotate(-90deg);display:block}
/* Das Zeichen sitzt auf einer eigenen Scheibe. Ohne sie schwebt ein
   duenner Umriss in der Mitte eines grossen Rings und sieht aus, als
   fehle da noch etwas. */
.ring .scheibe{position:absolute;inset:11px;border-radius:999px;display:grid;place-items:center}
.ring .scheibe .ic{width:21px;height:21px;stroke-width:2}
.ring b{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-top:8px;
  line-height:1.25;letter-spacing:-.01em}
.ring i{display:block;font-family:"Space Grotesk",sans-serif;font-style:normal;font-size:12px;
  font-weight:700;color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}
/* Drei Staende, drei Farben — nach einer Regel, nicht nach Gefuehl:
   ab 70 Prozent gut, ab 40 unterwegs, darunter liegen geblieben. */
.ring.gut   .scheibe{background:#DFF5EF;color:#0E7E99}
.ring.mitte .scheibe{background:#FFF4CC;color:#9A7100}
.ring.wenig .scheibe{background:#FDECEB;color:#C21C14}
.ring.gut   i{color:#0E7E99}
.ring.mitte i{color:#9A7100}
.ring.wenig i{color:#C21C14}

/* ---------- Abschnitte ---------- */
.abschnitt{font-size:21px;margin:28px 0 12px}

/* ---------- Tipp ---------- */
.tipp{padding:18px 18px 18px;position:relative}
.tipp .band{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tq-tief);margin-bottom:8px}
.tipp h3{font-size:18px;margin:0 40px 6px 0;line-height:1.25}
.tipp p{margin:0 0 16px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.tipp .zu{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:999px;
  border:none;background:#F1ECE1;color:var(--ink2);cursor:pointer;display:grid;place-items:center}
.tipp .tun{display:inline-flex;align-items:center;gap:7px;background:var(--tq-soft);
  color:var(--tq-tief);border:none;border-radius:var(--r1);padding:11px 16px;
  font-size:14.5px;font-weight:600;cursor:pointer}

/* ---------- Listen ---------- */
.liste{overflow:hidden}
.zeile{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;
  border:none;border-bottom:1px solid var(--rand2);background:var(--karte);
  text-align:left;cursor:pointer}
.zeile:last-child{border-bottom:none}
.zeile:active{background:#FAF8F3}
.kachel{flex:none;width:40px;height:40px;border-radius:var(--r1);background:var(--tq-soft);
  display:grid;place-items:center;color:var(--tq-tief)}
.kachel.rot{background:var(--rot-soft);color:var(--rot)}
.kachel.gold{background:var(--gold-soft);color:#8A6608}
.zeile .tx{flex:1;min-width:0}
.zeile .tx b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.zeile .tx span{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.zeile .wert{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700;
  color:var(--tq-tief);font-variant-numeric:tabular-nums}
.zeile .pfeil{color:var(--ink3)}
.schild{font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px}
.schild.jetzt{background:var(--rot);color:#fff}
.schild.frei{background:var(--tq-soft);color:var(--tq-tief)}
.schild .punkt{width:6px;height:6px;border-radius:999px;background:#fff;
  animation:pulsen 1.6s ease-in-out infinite}
@keyframes pulsen{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- Podcast ---------- */
.pod{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;
  border:1px solid var(--rand);background:var(--karte);border-radius:var(--r3);
  box-shadow:var(--schatten);text-align:left;cursor:pointer;margin-top:12px}
.pod .bild{flex:none;width:56px;height:56px;border-radius:var(--r2);
  background:linear-gradient(140deg,#80D8F0,#0E6D85);display:grid;place-items:center;color:#053A47}
.pod .tx{flex:1;min-width:0}
.pod .tx b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.pod .tx span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.pod .ab{flex:none;width:40px;height:40px;border-radius:999px;
  background:linear-gradient(135deg,var(--tq),var(--tq-d));color:var(--tq-t);
  display:grid;place-items:center}

/* ---------- Platzhalter beim Laden ----------
   Die Flaeche steht schon in voller Groesse da, bevor die Daten
   kommen. Deshalb rutscht beim Nachladen nichts. */
.skel{position:relative;overflow:hidden;background:#EDE8DD;border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
  animation:wisch 1.4s ease-in-out infinite}
@keyframes wisch{100%{transform:translateX(100%)}}
.skel.z1{height:13px;width:62%} .skel.z2{height:11px;width:40%;margin-top:7px}
.skel.kachel{width:40px;height:40px;border-radius:var(--r1);background:#EDE8DD}

/* ---------- Untere Leiste ---------- */
.leiste{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:none;
  padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.leiste .innen{max-width:496px;margin:0 auto;pointer-events:auto;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  border:1px solid var(--rand);border-radius:var(--r4);
  box-shadow:0 2px 6px rgba(20,35,42,.05), 0 12px 32px rgba(20,35,42,.14);
  display:flex;align-items:flex-start;justify-content:space-between;padding:8px 8px 7px}
.leiste button{border:none;background:none;cursor:pointer;flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  border-radius:var(--r2);color:var(--ink2);font-size:10px;font-weight:600;white-space:nowrap}

/* Julia, 28.10.2026: "unten die Buttons Start, Buchen, Chat und Mein
   Bereich gerne wieder etwas farblich ... gute Laune, man hat Lust
   Deutsch zu lernen."

   Jeder Reiter traegt seine eigene Farbe — aber keine gegriffene:
   alle vier kommen aus der Marke. Tuerkis aus dem Logo, Gold und Rot
   aus der Flagge, Mint aus dem Logokreis. Im Ruhezustand nur das
   Zeichen farbig, damit die Leiste nicht flimmert; der offene Reiter
   bekommt die Flaeche dazu und traegt seine Farbe auch in der
   Schrift. So ist sie bunt und trotzdem geordnet. */
.leiste button .ic{color:var(--eigen,var(--ink2))}
.leiste button{--eigen:var(--ink2)}
.leiste button.r-start{--eigen:#1FA6C6; --eigen-soft:#E3F6FC}
.leiste button.r-ueben{--eigen:#D99500; --eigen-soft:#FFF4D6}
.leiste button.r-chat {--eigen:#0E9E86; --eigen-soft:#E1F7F1}
.leiste button.r-mein {--eigen:#D32F23; --eigen-soft:#FDEBE9}
.leiste button.an{background:var(--eigen-soft);color:var(--eigen);font-weight:800}
.leiste button.an .ic{color:var(--eigen)}
.leiste .mitte{flex:0 0 auto;width:62px;padding:0;gap:5px;margin-top:-24px;
  color:var(--tq-tief);font-weight:700;background:none}
/* Der Knopf in der Mitte faellt nicht unter die Reiterfarben: sein
   Zeichen sitzt auf der hellen Scheibe und braucht den dunklen Ton. */
.leiste .mitte .haube .ic{color:var(--tq-t)}
.leiste .mitte{--eigen:var(--tq-tief)}
.leiste .mitte .haube{width:52px;height:52px;border-radius:999px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--tq),var(--tq-d));color:var(--tq-t);
  box-shadow:0 6px 16px rgba(63,189,220,.40)}
.leiste .umzeichen{position:relative;display:grid;place-items:center}
.leiste .punkt{position:absolute;top:-2px;right:-3px;width:9px;height:9px;border-radius:999px;
  background:var(--rot);border:2px solid #fff}

@media(max-width:374px){
  .titel{font-size:28px} .abschnitt{font-size:19px} .huelle{padding:0 14px}
  .leiste button{font-size:9.5px}
}
</style>
</head>
<body>

<!-- Der Symbolsatz, einmal im Dokument. Jedes <use> holt sich ein
     Zeichen daraus; es gibt keine zweite Datei und keinen Ladefehler. -->

<script>
/* Der Tipp verschwindet, ohne dass die Seite springt: erst zusammen-
   fahren, dann aus dem Fluss nehmen. */
function tippZu(){
  var t = document.getElementById('tipp'); if(!t) return;
  t.style.transition = 'opacity .18s, transform .18s';
  t.style.opacity = '0'; t.style.transform = 'scale(.97)';
  setTimeout(function(){ t.style.display = 'none'; }, 180);
}

/* Das Nachlade-Beispiel stand unter "Weitermachen" und ist mit dem
   Block gegangen. Der Platzhalter-Stil bleibt — er wird gebraucht,
   sobald echte Daten kommen. */

/* Reiter unten umschalten. */
document.querySelectorAll('.leiste .innen > button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.leiste .innen > button').forEach(function(x){
      x.classList.remove('an'); x.removeAttribute('aria-current'); });
    if(!b.classList.contains('mitte')){ b.classList.add('an'); b.setAttribute('aria-current','page'); }
  });
});
</script>
