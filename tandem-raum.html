<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Euer Tandem-Raum – deutschoderwas club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1012">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0E1012; --dark2:#1A1D21; --line-d:#2A2E34;
  --ink:#171717; --ink2:#6E6A63; --ink3:#9A958C;
  --line:#EBE7DF; --line2:#F4F1EA; --surface:#fff; --bg:#FBF9F5;
  --acc:#1B9BC0; --acc-d:#14708B; --acc-soft:#E6F8FC; --acc-line:#C7E9F3;
  --gold-soft:#FDF8EA; --gold-line:#F0E2BD;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--dark);color:#fff;overflow:hidden}
.ic{flex:none;vertical-align:-.15em}

.bar{height:56px;display:flex;align-items:center;gap:13px;padding:0 16px;background:var(--dark2);border-bottom:1px solid var(--line-d)}
.bar a.zurueck{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-d);color:#B9BEC6;display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none;transition:.2s}
.bar a.zurueck:hover{color:#fff;border-color:#4A5059}
.bar .ti{flex:1;min-width:0}
.bar .ti .k{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5EE0CE}
.bar .ti .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tg{border:1px solid var(--line-d);background:transparent;color:#B9BEC6;border-radius:99px;padding:8px 15px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s;flex:none}
.bar .tg:hover{color:#fff;border-color:#4A5059}
.bar .tg.on{background:var(--acc);border-color:var(--acc);color:#fff}

.main{display:flex;height:calc(100% - 56px)}
#jitsi{flex:1;min-width:0;background:#000}
#jitsi .lade{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#8A9099;text-align:center;padding:30px;font-size:14.5px;line-height:1.6}
#jitsi .lade .sp{width:26px;height:26px;border-radius:50%;border:3px solid #2A2E34;border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#jitsi .lade a{color:var(--acc);font-weight:600}

/* Missionsspalte */
.miss{width:380px;flex:none;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;border-left:1px solid var(--line-d)}
.miss.zu{display:none}
.miss .mim{display:block;width:100%;aspect-ratio:16/7;object-fit:cover;background:var(--line2)}
.miss .mh{background:linear-gradient(135deg,#14708B,#1B9BC0);color:#fff;padding:16px 18px}
.miss .mh .kk{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.85;margin-bottom:5px}
.miss .mh h2{margin:0 0 6px;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.miss .mh p{margin:0;font-size:13.5px;line-height:1.5;opacity:.94}
.miss .mm{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.miss .mm span{font-size:11px;font-weight:600;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 9px}
.miss .body{padding:16px 18px 40px}
.sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 9px;display:flex;align-items:center;gap:7px}
.sec .ic{color:var(--acc-d)}
.blk{margin-bottom:18px}
.blk ol,.blk ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.blk li{font-size:14px;line-height:1.5;display:flex;gap:8px}
.blk li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc-line);flex:none;margin-top:7px}
.blk.rm li{background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:10px;padding:8px 11px;color:var(--acc-d);font-weight:500}
.blk.rm li::before{display:none}
.auf{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:13px;padding:12px 14px;font-size:14px;line-height:1.55;color:#6B5518}
.auf b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B8931A;margin-bottom:4px}
.wo{display:flex;flex-wrap:wrap;gap:6px}
.wo span{font-size:12.5px;font-weight:500;color:var(--ink2);background:var(--line2);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.leer{padding:30px 20px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.6}
.tipp{display:flex;gap:9px;font-size:12.5px;color:var(--ink3);line-height:1.55;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.tipp .ic{flex:none;margin-top:1px}

@media(max-width:900px){
  .main{flex-direction:column}
  #jitsi{height:52vh;flex:none}
  .miss{width:100%;flex:1;border-left:none;border-top:1px solid var(--line-d)}
  .bar .tg span{display:none}
}
</style>
</head>
<body>
<header class="bar">
  <a class="zurueck" href="konto.html#buddy" aria-label="Zurück"></a>
  <div class="ti"><div class="k" id="bk">Tandem-Raum</div><div class="t" id="bt">Euer Raum</div></div>
  <button class="tg on" id="tgm"><span>Mission</span></button>
</header>
<div class="main">
  <div id="jitsi"><div class="lade"><span class="sp"></span><span>Euer Raum wird geöffnet …</span></div></div>
  <aside class="miss" id="miss"><div class="leer">Mission wird geladen …</div></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="ui-icons.js"></script>
<script src="tandem-missionen.js"></script>
<script>
(function(){
'use strict';
var I=window.ICON||function(){return'';};
var CFG=window.SPRECHCLUB_CONFIG||{};
var Q=new URLSearchParams(location.search);
var RAUM=(Q.get('raum')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,80);
var MIT=(Q.get('mit')||'').slice(0,60);
var LVL=(Q.get('lvl')||'').toUpperCase();
var EIGENER='meet.deutschoderwas-club.de', NOTFALL='meet.jit.si';
var sb=null, api=null, name='Mitglied';

function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function melde(html){ document.getElementById('jitsi').innerHTML='<div class="lade">'+html+'</div>'; }

document.querySelector('.zurueck').innerHTML=I('arrowL',18);
document.getElementById('bt').textContent = MIT ? ('Du & '+MIT) : 'Euer Tandem-Raum';
document.getElementById('bk').textContent = 'Tandem-Raum';

/* ---------- Mission ---------- */
function niveau(){
  if(LVL&&window.TANDEM&&window.TANDEM[LVL]) return LVL;
  var l=null;
  try{ l=localStorage.getItem('dow_lvl'); }catch(e){}
  if(l&&window.TANDEM&&window.TANDEM[l]) return l;
  return 'B1';
}
function wocheIdx(len){
  if(!len) return 0;
  var d=new Date(), start=new Date(d.getFullYear(),0,1);
  return Math.floor(((d-start)/86400000+start.getDay()+1)/7)%len;
}
function mission(){
  var lv=niveau(), liste=(window.TANDEM&&window.TANDEM[lv])||[];
  if(!liste.length) return null;
  var m=liste[wocheIdx(liste.length)];
  m.__lv=lv;
  return m;
}
function malMission(){
  var m=mission(), el=document.getElementById('miss');
  if(!m){ el.innerHTML='<div class="leer">Für dein Niveau ist gerade keine Mission hinterlegt. Sprecht einfach frei — das zählt genauso.</div>'; return; }
  el.innerHTML=
     (m.bild?'<img class="mim" src="illu/'+esc(m.bild)+'.jpg" alt="" onerror="this.style.display=\'none\'">':'')
    +'<div class="mh"><div class="kk">Eure Mission</div><h2>'+esc(m.t)+'</h2><p>'+esc(m.ziel)+'</p>'
    +'<div class="mm"><span>'+esc(m.__lv)+'</span><span>'+esc(m.dauer)+'</span><span>zu zweit</span></div></div>'
    +'<div class="body">'
    +'<div class="blk"><div class="sec">'+I('chat',13)+'Womit ihr anfangt</div><ol>'
    + m.fragen.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ol></div>'
    +'<div class="blk rm"><div class="sec">'+I('bookmark',13)+'Diese Sätze benutzt ihr wirklich</div><ul>'
    + m.redemittel.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul></div>'
    +'<div class="blk"><div class="auf"><b>Eure Aufgabe</b>'+esc(m.aufgabe)+'</div></div>'
    +'<div class="blk"><div class="sec">'+I('cards',13)+'Wörter, die ihr braucht</div>'
    +'<div class="wo">'+m.woerter.map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div></div>'
    +'<div class="tipp">'+I('spark',14)+'<span>Ihr müsst nicht alles schaffen. Zehn Minuten wirklich sprechen ist mehr wert als die ganze Liste abzuarbeiten.</span></div>'
    +'</div>';
}
malMission();

var tg=document.getElementById('tgm');
tg.addEventListener('click',function(){
  var m=document.getElementById('miss');
  m.classList.toggle('zu');
  tg.classList.toggle('on',!m.classList.contains('zu'));
  setTimeout(function(){ try{ window.dispatchEvent(new Event('resize')); }catch(e){} },60);
});

/* ---------- Raum ---------- */
async function start(){
  if(!RAUM){
    melde('<span>Dieser Link ist unvollständig.</span><a href="konto.html#buddy">Zurück zum Sprech-Tandem</a>');
    return;
  }
  try{
    if(window.supabase&&CFG.SUPABASE_URL) sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  }catch(e){}
  var jwt=null;
  if(sb){
    try{
      var s=await sb.auth.getSession();
      var sess=s&&s.data&&s.data.session;
      if(!sess){
        melde('<span>Melde dich bitte zuerst im Club an.</span><a href="index.html?login=1">Zum Login</a>');
        return;
      }
      try{
        var pr=await sb.from('profiles').select('name').eq('id',sess.user.id).single();
        if(pr&&pr.data&&pr.data.name) name=pr.data.name;
      }catch(e){}
      var res=await fetch(CFG.SUPABASE_URL+'/functions/v1/jitsi-token',{
        method:'POST',
        headers:{'Authorization':'Bearer '+sess.access_token,'apikey':CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({ room:RAUM })
      });
      if(res.ok){ var j=await res.json(); jwt=j.token||null; }
    }catch(e){}
  }
  lade(EIGENER,function(){ starte(EIGENER,jwt); },function(){
    lade(NOTFALL,function(){ starte(NOTFALL,null); },function(){
      melde('<span>Der Videoraum lässt sich gerade nicht öffnen. Schreibt euch solange im Club.</span><a href="konto.html#buddy">Zurück zum Sprech-Tandem</a>');
    });
  });
}
function lade(domain,ok,fehler){
  var s=document.createElement('script');
  s.src='https://'+domain+'/external_api.js';
  s.onload=ok; s.onerror=fehler;
  document.head.appendChild(s);
}
function starte(domain,jwt){
  var el=document.getElementById('jitsi'); el.innerHTML='';
  var opts={
    roomName:RAUM, parentNode:el,
    userInfo:{ displayName:name },
    configOverwrite:{
      prejoinPageEnabled:false, prejoinConfig:{enabled:false},
      startWithAudioMuted:false, startWithVideoMuted:false,
      disableDeepLinking:true, disableThirdPartyRequests:true
    },
    interfaceConfigOverwrite:{
      TOOLBAR_BUTTONS:['microphone','camera','desktop','tileview','raisehand','chat','hangup','fullscreen','settings'],
      SHOW_JITSI_WATERMARK:false, SHOW_WATERMARK_FOR_GUESTS:false, SHOW_BRAND_WATERMARK:false,
      SHOW_POWERED_BY:false, DEFAULT_LOGO_URL:'', DEFAULT_WELCOME_PAGE_LOGO_URL:'', JITSI_WATERMARK_LINK:'',
      DISABLE_JOIN_LEAVE_NOTIFICATIONS:false
    }
  };
  if(jwt) opts.jwt=jwt;
  try{
    api=new JitsiMeetExternalAPI(domain,opts);
    api.addListener('readyToClose',function(){
      melde('<span>Ihr habt den Raum verlassen. Schön, dass ihr geübt habt.</span><a href="konto.html#buddy">Zurück zum Sprech-Tandem</a>');
    });
  }catch(e){
    melde('<span>Der Videoraum lässt sich gerade nicht öffnen.</span><a href="konto.html#buddy">Zurück zum Sprech-Tandem</a>');
  }
}
start();
})();
</script>
</body>
</html>
