<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deutschoderwas club · Grammatik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181B; --soft:#5A6B72; --line:#E7ECEE; --bg:#F6F9FA; --card:#FFFFFF;
  --primary:#D42A21; --turq:#1B9BC0; --accent:#FFE100; --green:#4E9E12;
  --radius:18px; --shadow:0 2px 10px rgba(20,24,27,.05); --shadow-m:0 10px 26px rgba(20,24,27,.09);
  --akz:#1B9BC0; --akz-soft:#E4F3F8; --akz-text:#10627A; --akz-tint:#F7FBFC;
}
body[data-niveau="ab"]{ --akz:#1B9BC0; --akz-soft:#E1F2F7; --akz-text:#0F5C6B; --akz-tint:#F4FAFC; }
body[data-niveau="bb"]{ --akz:#C9A200; --akz-soft:#FBF1C4; --akz-text:#6B4E00; --akz-tint:#FEFBEF; }
body[data-niveau="bc"]{ --akz:#D42A21; --akz-soft:#FBE3E1; --akz-text:#9A1C16; --akz-tint:#FEF6F5; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--akz-tint);-webkit-font-smoothing:antialiased;transition:background .25s;}
h1,h2,h3,h4{font-family:'Space Grotesk','Segoe UI',sans-serif;}
.band{height:4px;background:var(--akz);transition:background .25s;}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.marke{font-family:'Space Grotesk';font-weight:700;font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:9px;}
.marke .wm{color:var(--ink);} .marke .club{color:var(--turq);margin-left:5px;}
.nivbadge{font-family:'Space Grotesk';font-weight:600;font-size:.82rem;border:1px solid var(--akz);color:var(--akz-text);background:var(--akz-soft);border-radius:999px;padding:3px 12px;}
.suche{flex:1 1 200px;position:relative;min-width:150px;}
.suche input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px 10px 38px;font-family:'Inter';font-size:.95rem;color:var(--ink);outline:none;}
.suche input:focus{border-color:var(--akz);background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--akz) 15%,transparent);}
.suche .lupe{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soft);}
.niv{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.niv .cap{font-weight:600;font-size:.78rem;color:var(--soft);}
.niv button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-family:'Space Grotesk';font-weight:600;font-size:.82rem;cursor:pointer;color:var(--ink);transition:.12s;display:inline-flex;align-items:center;gap:7px;}
.niv button .dot{width:9px;height:9px;border-radius:999px;display:inline-block;}
.niv button[data-n="ab"] .dot{background:#1B9BC0;}.niv button[data-n="bb"] .dot{background:#C9A200;}.niv button[data-n="bc"] .dot{background:#D42A21;}.niv button[data-n="all"] .dot{background:var(--soft);}
.niv button:hover{border-color:var(--akz);}
.niv button.on{color:#fff;border-color:transparent;}
.niv button[data-n="ab"].on{background:#1B9BC0;}.niv button[data-n="bb"].on{background:#C9A200;}.niv button[data-n="bc"].on{background:#D42A21;}.niv button[data-n="all"].on{background:var(--ink);}
.niv button.on .dot{background:#fff;}
.reihe{display:inline-flex;align-items:center;gap:7px;margin-left:auto;background:var(--akz-soft);color:var(--akz-text);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.84rem;}
.wrap{display:grid;grid-template-columns:300px 1fr;max-width:1500px;margin:0 auto;min-height:calc(100vh - 95px);position:relative;transition:grid-template-columns .2s;}
body.zu .wrap{grid-template-columns:0 1fr;}
.liste{border-right:1px solid var(--line);background:var(--card);padding:16px 12px 40px;overflow:auto;position:relative;}
body.zu .liste{display:none;}
.niv-ribbon{display:flex;align-items:center;gap:9px;background:var(--akz-soft);border:1px solid color-mix(in srgb,var(--akz) 35%,transparent);border-radius:12px;padding:9px 12px;margin:0 2px 12px;font-family:'Space Grotesk';font-weight:600;font-size:.9rem;color:var(--akz-text);}
.niv-ribbon .pt{width:12px;height:12px;border-radius:999px;}
.gruppe-h{font-weight:700;font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--soft);padding:14px 10px 8px;}
.b-item{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 11px;margin-bottom:2px;cursor:pointer;transition:.1s;display:flex;align-items:center;gap:11px;}
.b-item:hover{background:var(--bg);}
.b-item.on{background:var(--akz-soft);border-color:color-mix(in srgb,var(--akz) 30%,transparent);}
.b-item .em{flex:none;width:32px;height:32px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.b-item.on .em{background:#fff;}
.b-item .bn{flex:1;font-weight:600;font-size:.92rem;line-height:1.2;}
.b-item .ct{flex:none;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;color:var(--soft);background:var(--bg);border-radius:999px;padding:1px 8px;}
.b-item.on .ct{color:var(--akz-text);background:#fff;}
.b-item.leer .bn,.b-item.leer .ct{opacity:.5;}
.zieher{position:absolute;top:14px;right:-13px;z-index:20;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--soft);box-shadow:var(--shadow);}
.auf{position:fixed;left:14px;top:106px;z-index:40;display:none;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-m);border-radius:999px;padding:8px 14px;font-family:'Space Grotesk';font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink);}
body.zu .auf{display:inline-flex;}
.detail{padding:28px 36px 70px;overflow:auto;}
.welc{max-width:640px;margin:7vh auto 0;text-align:center;}
.welc .em{font-size:2.6rem;width:94px;height:94px;border-radius:999px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.welc h1{font-size:2rem;margin:10px 0 10px;letter-spacing:-.01em;}
.welc p{color:var(--soft);font-size:1.05rem;line-height:1.6;margin:0 auto;max-width:500px;}
.welc .hint{margin-top:22px;display:inline-flex;gap:8px;align-items:center;background:var(--akz);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow-m);}
.b-kopf{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.b-kopf .em{width:50px;height:50px;border-radius:14px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.b-kopf h1{font-size:1.7rem;margin:0;letter-spacing:-.01em;}
.b-kopf .sub{color:var(--soft);font-size:.88rem;font-weight:600;}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:15px;margin-top:22px;}
.karte{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;cursor:pointer;transition:.14s;box-shadow:var(--shadow);}
.karte:hover{border-color:var(--akz);box-shadow:var(--shadow-m);transform:translateY(-2px);}
.karte .kem{width:40px;height:40px;border-radius:12px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:12px;}
.karte .kt{font-family:'Space Grotesk';font-weight:600;font-size:1.12rem;line-height:1.2;}
.karte .kmeta{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--soft);font-size:.82rem;}
.karte .pfeil{margin-top:13px;color:var(--akz-text);font-weight:600;font-size:.84rem;}
.keine{margin-top:26px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--soft);}
.lv{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;border-radius:999px;padding:2px 9px;white-space:nowrap;}
.lv-ab{background:#E1F2F7;color:#0F5C6B;}.lv-bb{background:#FBF1C4;color:#6B4E00;}.lv-bc{background:#FBE3E1;color:#9A1C16;}
.zurueck{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--akz-text);font-family:'Space Grotesk';font-weight:600;font-size:.9rem;cursor:pointer;padding:4px 0;margin-bottom:10px;}
.d-kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.d-breadcrumb{font-size:.82rem;color:var(--soft);font-weight:600;}
.d-titel{font-family:'Space Grotesk';font-weight:700;font-size:2rem;line-height:1.1;margin:4px 0 0;letter-spacing:-.01em;}
.d-tools{display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-family:'Space Grotesk';font-weight:600;font-size:.84rem;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:.12s;}
.btn:hover{border-color:var(--akz);} .btn-prim{background:var(--akz);color:#fff;border-color:transparent;}
.sek{margin-top:28px;}
.sek-h{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--akz-text);margin-bottom:14px;}
/* Grammatik-spezifisch */
.regel{background:var(--akz-soft);border:1px solid color-mix(in srgb,var(--akz) 35%,transparent);border-radius:var(--radius);padding:18px 20px;font-size:1.05rem;line-height:1.6;}
.regel b{color:var(--akz-text);}
.regel .tab{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px;}
.regel .tab div{background:#fff;padding:9px 12px;font-size:.95rem;}
.regel .tab .th{background:var(--akz);color:#fff;font-family:'Space Grotesk';font-weight:600;}
.bsp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;font-size:1.04rem;line-height:1.5;box-shadow:var(--shadow);}
.bsp mark{background:var(--accent);padding:0 .15em;border-radius:3px;font-weight:600;}
.spr{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.spr .ic{flex:none;width:28px;height:28px;border-radius:999px;background:var(--akz-soft);color:var(--akz-text);display:flex;align-items:center;justify-content:center;font-size:.95rem;}
.spr .t{font-size:1.02rem;line-height:1.5;padding-top:2px;}
.rm-karte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.rm-karte h4{font-family:'Space Grotesk';font-weight:600;font-size:.98rem;margin:0 0 10px;color:var(--akz-text);}
.rm-karte ul{margin:0;padding:0;list-style:none;}
.rm-karte li{font-size:.97rem;line-height:1.45;padding:7px 0;border-bottom:1px solid var(--line);}
.rm-karte li:last-child{border-bottom:none;}
.fehler{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.fehler .f{color:#B3261E;} .fehler .f b{text-decoration:line-through;}
.fehler .r{color:#2E7D32;margin-top:3px;} .fehler .r b{font-weight:700;}
.fehler .tip{color:var(--soft);font-size:.86rem;margin-top:5px;}
body.praesi .top .suche,body.praesi .liste,body.praesi .reihe{display:none;}
body.praesi .wrap{grid-template-columns:1fr;}
body.praesi .auf{display:none;}
body.praesi .detail{padding:30px max(40px,6vw) 80px;}
body.praesi .d-titel{font-size:2.5rem;}
@media(max-width:860px){.wrap{grid-template-columns:1fr;}.liste{border-right:none;border-bottom:1px solid var(--line);max-height:40vh;}body.zu .liste{display:none;}.regel .tab{grid-template-columns:1fr;}.detail{padding:20px 18px 60px;}.zieher{display:none;}.reihe{margin-left:0;}}
</style>
</head>
<body data-niveau="all">
<div class="band"></div>
<div class="top">
  <div class="top-row">
    <div class="marke"><span class="wm">deutschoderwas</span><span class="club">club</span><span class="nivbadge" id="nivbadge">alle Niveaus</span></div>
    <div class="suche"><span class="lupe">🔍</span><input id="suche" type="text" placeholder="Grammatik-Thema suchen …" autocomplete="off"></div>
    <div class="niv" id="niv"></div>
    <div class="reihe">📐 Grammatikfokus</div>
  </div>
</div>
<div class="wrap">
  <aside class="liste"><div id="bereiche"></div></aside>
  <main class="detail" id="detail"></main>
</div>
<button class="auf" onclick="toggleListe()">☰ Themen</button>
<script>
const BAENDER={ ab:{label:'A2·B1',wort:'Grundstufe',cls:'lv-ab',farbe:'#1B9BC0'}, bb:{label:'B1·B2',wort:'Mittelstufe',cls:'lv-bb',farbe:'#C9A200'}, bc:{label:'B2·C1',wort:'Oberstufe',cls:'lv-bc',farbe:'#D42A21'} };
const BEREICHE=[
  { gruppe:'Zeiten & Verben', farbe:'#E4F3F8', items:[
    {n:'Perfekt', em:'⏮️'},{n:'Präteritum', em:'📜'},{n:'Futur', em:'⏭️'},{n:'Konjunktiv II', em:'💭'},
    {n:'Passiv', em:'🔄'},{n:'Modalverben', em:'🔑'},{n:'Trennbare Verben', em:'✂️'},{n:'Reflexive Verben', em:'🔁'},
  ]},
  { gruppe:'Satzbau', farbe:'#FBF1C4', items:[
    {n:'Nebensätze (weil, dass, wenn)', em:'🔗'},{n:'Konnektoren', em:'➕'},{n:'Wortstellung', em:'🔀'},{n:'Indirekte Fragen', em:'❓'},
  ]},
  { gruppe:'Fälle & Präpositionen', farbe:'#E4F3F8', items:[
    {n:'Akkusativ & Dativ', em:'🎯'},{n:'Wechselpräpositionen', em:'📍'},{n:'Genitiv', em:'🧩'},{n:'n-Deklination', em:'🔤'},
  ]},
  { gruppe:'Adjektive', farbe:'#FBF1C4', items:[
    {n:'Adjektivdeklination', em:'🎨'},{n:'Komparativ & Superlativ', em:'📊'},
  ]},
];
const EMOJI={}; BEREICHE.forEach(g=>g.items.forEach(b=>EMOJI[b.n]=b.em));

const THEMEN=[
  { id:'wechselprep', titel:'Wechselpräpositionen', bereich:'Wechselpräpositionen', niveau:'ab',
    regel:`Neun Präpositionen können <b>Dativ oder Akkusativ</b> sein: <b>an, auf, hinter, in, neben, über, unter, vor, zwischen</b>. Die Frage entscheidet den Fall:`,
    tabelle:['Frage „Wo?" → Ort','→ Dativ','Frage „Wohin?" → Richtung/Bewegung','→ Akkusativ'],
    beispiele:['Das Buch liegt auf <mark>dem</mark> Tisch. <span style="color:#5A6B72">(Wo? → Dativ)</span>','Ich lege das Buch auf <mark>den</mark> Tisch. <span style="color:#5A6B72">(Wohin? → Akkusativ)</span>','Die Lampe hängt über <mark>dem</mark> Sofa. <span style="color:#5A6B72">(Wo?)</span>','Ich stelle die Pflanze neben <mark>das</mark> Fenster. <span style="color:#5A6B72">(Wohin?)</span>'],
    sprich:['Beschreibe dein Zimmer: Wo stehen die Möbel? (Wo? → Dativ)','Du räumst auf – wohin stellst/legst du die Dinge? (Wohin? → Akkusativ)','Beschreibe ein Bild: Was ist wo?'],
    redemittel:[{h:'Wo? (Dativ)',l:['… steht/liegt/hängt an dem / auf dem / in dem …','Es befindet sich neben dem / zwischen den …']},{h:'Wohin? (Akkusativ)',l:['Ich stelle/lege/hänge … an den / auf den / in den …','Ich setze mich auf den / an den …']}],
    fehler:[{f:'Ich gehe in <b>der</b> Schule.',r:'Ich gehe in <b>die</b> Schule. (Wohin? → Akkusativ)',tip:'Bewegung mit Ziel = Akkusativ.'},{f:'Das Glas steht auf <b>den</b> Tisch.',r:'Das Glas steht auf <b>dem</b> Tisch. (Wo? → Dativ)',tip:'Kein Ortswechsel = Dativ.'}] },
  { id:'konjunktiv2', titel:'Konjunktiv II', bereich:'Konjunktiv II', niveau:'bb',
    regel:`Mit dem Konjunktiv II drückt man <b>höfliche Bitten, Wünsche und Hypothesen</b> aus. Meist <b>würde + Infinitiv</b>; bei <b>haben, sein, Modalverben</b> nutzt man die eigene Form: <b>hätte, wäre, könnte, müsste</b>.`,
    tabelle:['würde + Infinitiv','Ich würde gern reisen.','hätte / wäre / könnte','Ich hätte Zeit. / Es wäre schön.'],
    beispiele:['Ich <mark>hätte</mark> gern einen Kaffee. <span style="color:#5A6B72">(höfliche Bitte)</span>','<mark>Könntest</mark> du mir bitte helfen?','Wenn ich mehr Zeit <mark>hätte</mark>, <mark>würde</mark> ich mehr lesen.','An deiner Stelle <mark>würde</mark> ich das anders machen.'],
    sprich:['Was würdest du machen, wenn du im Lotto gewinnen würdest?','Formuliere drei höfliche Bitten (im Restaurant, beim Amt, beim Nachbarn).','Gib einem Freund einen Rat: „An deiner Stelle würde ich …"'],
    redemittel:[{h:'Höflich bitten',l:['Könntest du / Könnten Sie …?','Ich hätte gern …','Wäre es möglich, dass …?']},{h:'Wünsche & Rat',l:['Ich würde gern …','An deiner Stelle würde ich …','Es wäre schön, wenn …']}],
    fehler:[{f:'Wenn ich Zeit <b>habe</b>, würde ich kommen.',r:'Wenn ich Zeit <b>hätte</b>, würde ich kommen.',tip:'Hypothese: beide Teile im Konjunktiv II.'},{f:'Ich <b>würde haben</b> gern Kaffee.',r:'Ich <b>hätte</b> gern Kaffee.',tip:'haben/sein nicht mit „würde" umschreiben.'}] },
  { id:'passiv', titel:'Passiv', bereich:'Passiv', niveau:'bc',
    regel:`Das Passiv rückt die <b>Handlung</b> in den Mittelpunkt – nicht, wer sie tut. Bildung: <b>werden + Partizip II</b>. Wer handelt, ist oft unwichtig oder steht mit <b>von</b>.`,
    tabelle:['Präsens','Das Haus wird gebaut.','Präteritum','Der Antrag wurde gestellt.'],
    beispiele:['Das Formular <mark>wird</mark> vom Amt <mark>geprüft</mark>.','Die Rechnung <mark>wurde</mark> gestern <mark>bezahlt</mark>.','Hier <mark>darf</mark> nicht geraucht <mark>werden</mark>. <span style="color:#5A6B72">(mit Modalverb)</span>','Das Problem <mark>ist</mark> inzwischen <mark>gelöst worden</mark>. <span style="color:#5A6B72">(Perfekt)</span>'],
    sprich:['Erkläre einen Prozess im Passiv: Wie wird Brot gemacht? Wie wird ein Antrag bearbeitet?','Formuliere Nachrichten/Schlagzeilen im Passiv.','Beschreibe, was in deiner Stadt gerade gebaut oder verändert wird.'],
    redemittel:[{h:'Vorgang beschreiben',l:['Zuerst wird … , dann wird …','… wird/werden … (Partizip II).','Dabei muss … beachtet werden.']},{h:'Formell',l:['Ihr Antrag wird bearbeitet.','Sie werden benachrichtigt, sobald …']}],
    fehler:[{f:'Das Haus <b>wird gebaut worden</b>.',r:'Das Haus <b>wird gebaut</b>. / <b>ist gebaut worden</b>.',tip:'Präsens-Passiv: nur werden + Partizip II.'},{f:'Der Brief wurde <b>bei</b> mir geschrieben.',r:'Der Brief wurde <b>von</b> mir geschrieben.',tip:'Handelnde Person mit „von".'}] },
];

const S={ niveau:'all', bereich:null, sel:null };
function themenVon(b){ return THEMEN.filter(t=>t.bereich===b && (S.niveau==='all'||t.niveau===S.niveau)); }
function anzahl(b){ return themenVon(b).length; }
function renderNiv(){
  document.getElementById('niv').innerHTML=`<span class="cap">Niveau:</span>`+[['all','Alle'],['ab','A2·B1'],['bb','B1·B2'],['bc','B2·C1']]
    .map(([k,l])=>`<button data-n="${k}" class="${S.niveau===k?'on':''}" onclick="setNiv('${k}')"><span class="dot"></span>${l}</button>`).join('');
  document.getElementById('nivbadge').textContent = S.niveau==='all' ? 'alle Niveaus' : BAENDER[S.niveau].label;
}
function nivRibbon(){ if(S.niveau==='all') return `<div class="niv-ribbon"><span class="pt" style="background:var(--soft)"></span>Alle Niveaus</div>`;
  const b=BAENDER[S.niveau]; return `<div class="niv-ribbon"><span class="pt" style="background:${b.farbe}"></span>Niveau ${b.label} · ${b.wort}</div>`; }
function renderBereiche(){
  const q=document.getElementById('suche').value.trim().toLowerCase();
  let html=nivRibbon();
  BEREICHE.forEach(g=>{ const items=g.items.filter(b=>!q||b.n.toLowerCase().includes(q)); if(!items.length) return;
    html+=`<div class="gruppe-h">${g.gruppe}</div>`;
    html+=items.map(b=>{ const c=anzahl(b.n);
      return `<button class="b-item ${S.bereich===b.n?'on':''} ${c?'':'leer'}" onclick="selBereich('${b.n.replace(/'/g,"\\'")}')">
        <span class="em" style="background:${g.farbe}">${b.em}</span><span class="bn">${b.n}</span><span class="ct">${c}</span></button>`;}).join('');
  });
  document.getElementById('bereiche').innerHTML=html;
}
function renderDetail(){
  const d=document.getElementById('detail');
  if(S.sel){ return renderThema(d, THEMEN.find(x=>x.id===S.sel)); }
  if(S.bereich){ return renderBereichView(d,S.bereich); }
  d.innerHTML=`<div class="welc"><div class="em">📐</div><h1>Welche Grammatik übt ihr heute?</h1>
    <p>Wählt oben euer <b>Niveau</b> und links ein <b>Grammatik-Thema</b>. Zu jedem Thema gibt es Regel, Beispiele und Sprechaufgaben zum sofort Anwenden.</p>
    <div class="hint">👈 Thema links wählen</div></div>`;
}
function renderBereichView(d,b){
  const ts=themenVon(b);
  const karten = ts.length
    ? `<div class="karten">${ts.map(t=>`<button class="karte" onclick="selThema('${t.id}')"><div class="kem">${EMOJI[t.bereich]||'📐'}</div><div class="kt">${t.titel}</div>
        <div class="kmeta"><span class="lv ${BAENDER[t.niveau].cls}">${BAENDER[t.niveau].label}</span> · Regel + Sprechaufgaben</div><div class="pfeil">Öffnen →</div></button>`).join('')}</div>`
    : `<div class="keine">📝 Zu diesem Grammatik-Thema ist noch nichts hinterlegt${S.niveau!=='all'?' für dieses Niveau':''} – wird Schritt für Schritt gefüllt.</div>`;
  d.innerHTML=`<div class="b-kopf"><div class="em">${EMOJI[b]||'📐'}</div><div><h1>${b}</h1><div class="sub">Grammatikfokus</div></div></div>${karten}`;
}
function renderThema(d,t){
  const tab = t.tabelle ? `<div class="tab"><div class="th">${t.tabelle[0]}</div><div class="th">${t.tabelle[1]}</div><div>${t.tabelle[2]}</div><div>${t.tabelle[3]}</div></div>` : '';
  const bsp = t.beispiele.map(b=>`<div class="bsp">${b}</div>`).join('');
  const spr = t.sprich.map(s=>`<div class="spr"><div class="ic">🗣️</div><div class="t">${s}</div></div>`).join('');
  const rm = t.redemittel.map(r=>`<div class="rm-karte"><h4>${r.h}</h4><ul>${r.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  const feh = t.fehler.map(f=>`<div class="fehler"><div class="f">✗ ${f.f}</div><div class="r">✓ ${f.r}</div>${f.tip?`<div class="tip">💡 ${f.tip}</div>`:''}</div>`).join('');
  d.innerHTML=`<button class="zurueck" onclick="zurueckZumBereich()">‹ ${t.bereich}</button>
    <div class="d-kopf"><div><div class="d-breadcrumb">Grammatikfokus</div><h1 class="d-titel">${t.titel}</h1></div>
      <div class="d-tools"><span class="lv ${BAENDER[t.niveau].cls}" style="font-size:.84rem;padding:4px 12px">${BAENDER[t.niveau].label}</span>
      <button class="btn" id="btn-praesi" onclick="togglePraesi()">🖥️ Präsentieren</button></div></div>
    <div class="sek"><div class="sek-h">📘 Die Regel</div><div class="regel">${t.regel}${tab}</div></div>
    <div class="sek"><div class="sek-h">✍️ Beispiele</div>${bsp}</div>
    <div class="sek"><div class="sek-h">🗣️ Sprich damit</div>${spr}</div>
    <div class="sek"><div class="sek-h">🧩 Redemittel</div><div class="karten" style="margin-top:0">${rm}</div></div>
    <div class="sek"><div class="sek-h">⚠️ Typische Fehler</div>${feh}</div>`;
}
function setNiv(k){ S.niveau=k; document.body.dataset.niveau=k;
  if(S.sel){ const t=THEMEN.find(x=>x.id===S.sel); if(t&&k!=='all'&&t.niveau!==k) S.sel=null; }
  renderNiv(); renderBereiche(); renderDetail(); }
function selBereich(b){ S.bereich=b; S.sel=null; renderBereiche(); renderDetail(); document.getElementById('detail').scrollTop=0; }
function selThema(id){ S.sel=id; renderDetail(); document.getElementById('detail').scrollTop=0; }
function zurueckZumBereich(){ S.sel=null; renderDetail(); }
function toggleListe(){ document.body.classList.toggle('zu'); const z=document.getElementById('zieher'); if(z) z.textContent=document.body.classList.contains('zu')?'›':'‹'; }
function togglePraesi(){ document.body.classList.toggle('praesi'); const on=document.body.classList.contains('praesi'); const b=document.getElementById('btn-praesi'); if(b){ b.textContent=on?'✕ Normal':'🖥️ Präsentieren'; b.classList.toggle('btn-prim',on);} }
document.getElementById('suche').addEventListener('input',renderBereiche);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.body.classList.contains('praesi')) togglePraesi(); });
renderNiv(); renderBereiche(); renderDetail();
</script>
</body>
</html>
