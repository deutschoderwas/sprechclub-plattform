<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sprechen – deutschoderwas club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF9F5">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --ink:#171717; --ink2:#6E6A63; --ink3:#9A958C;
  --line:#EBE7DF; --line2:#F4F1EA;
  --acc:#1B9BC0; --acc-d:#14708B; --acc-soft:#E6F8FC; --acc-line:#C7E9F3;
  --gold:#E8B923; --gold-soft:#FDF8EA; --gold-line:#F0E2BD;
  --warn:#C9705F; --warn-soft:#FBF1EE; --err:#C9453D;
  --r1:12px; --r2:16px; --r3:22px;
  --sh:0 1px 2px rgba(23,23,23,.04), 0 8px 24px -16px rgba(23,23,23,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.ic{flex:none;vertical-align:-.15em}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes puls{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
@keyframes wave{0%,100%{height:8px}50%{height:24px}}

.top{position:sticky;top:0;z-index:30;background:rgba(251,249,245,.9);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line2)}
.top-in{max-width:1240px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:13px}
.icb{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex:none;transition:.2s}
.icb:hover{color:var(--ink);border-color:var(--ink3)}
.tt{flex:1;min-width:0}
.tt .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-d)}
.tt .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrap{max-width:1240px;margin:0 auto;padding:20px 18px calc(40px + env(safe-area-inset-bottom))}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(25px,5.5vw,31px);font-weight:700;letter-spacing:-.03em;line-height:1.12;margin:0 0 8px}
.lead{color:var(--ink2);font-size:15px;line-height:1.65;margin:0 0 20px;max-width:560px}
h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;display:flex;align-items:center;gap:9px}
h2 .ic{color:var(--acc-d)}
.sub{color:var(--ink2);font-size:14.5px;line-height:1.6;margin:0 0 16px}

/* Filter */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.f{border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-family:inherit;font-weight:600;font-size:13px;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.2s}
.f:hover{border-color:var(--ink3);color:var(--ink)}
.f.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* Szenario-Raster */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sz{border:1px solid var(--line);background:var(--surface);border-radius:var(--r3);overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;padding:0;box-shadow:var(--sh);transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s,border-color .28s;animation:up .45s cubic-bezier(.16,1,.3,1) both;display:flex;flex-direction:column}
.sz:hover{transform:translateY(-4px);border-color:var(--acc-line);box-shadow:0 2px 4px rgba(23,23,23,.05),0 20px 40px -18px rgba(23,23,23,.24)}
.sz .im{aspect-ratio:4/3;background:#FAF4E6;overflow:hidden;position:relative}
.sz .im img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.sz:hover .im img{transform:scale(1.05)}
.sz .lv{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(4px);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--ink)}
.sz .bd{padding:14px 15px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.sz .bd b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.sz .bd .kz{font-size:13px;color:var(--ink2);line-height:1.5;flex:1}
.sz .bd .go{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--acc-d);margin-top:6px}

/* Detail */
.hero{border-radius:var(--r3);overflow:hidden;background:#FAF4E6;aspect-ratio:2/1;margin-bottom:18px;border:1px solid var(--line)}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip .ic{width:14px;height:14px;color:var(--ink3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:22px 20px;box-shadow:var(--sh);margin-bottom:14px;animation:up .45s cubic-bezier(.16,1,.3,1) both}
.brief{display:flex;flex-direction:column;gap:0}
.br{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line2)}
.br:first-child{border-top:none;padding-top:4px}
.br .bi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.br.r .bi{background:var(--acc-soft);color:var(--acc-d)}
.br.z .bi{background:var(--gold-soft);color:#A8850F}
.br.h .bi{background:var(--warn-soft);color:var(--warn)}
.br.e .bi{background:var(--acc-soft);color:var(--acc-d)}
.br .bt{flex:1;min-width:0}
.br .bl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.br .bx{font-size:15px;line-height:1.58}
.hint{display:flex;gap:10px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:var(--r2);padding:13px 15px;font-size:13.5px;line-height:1.55;color:#6B5518;margin-top:14px}
.hint .ic{color:#B8931A;flex:none;margin-top:1px}

/* Nachsprechen */
.ph{display:flex;flex-direction:column;gap:10px}
.p{border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:14px 15px;transition:border-color .25s,background .25s}
.p.act{border-color:var(--acc);background:var(--acc-soft)}
.p.ok{border-color:var(--acc);background:var(--acc-soft)}
.p .ptop{display:flex;align-items:flex-start;gap:12px}
.p .ptx{flex:1;min-width:0;font-size:15.5px;line-height:1.5;font-weight:500}
.p .pn{width:24px;height:24px;border-radius:7px;background:var(--line2);color:var(--ink3);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.p.ok .pn{background:var(--acc);color:#fff}
.pacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pb{border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-family:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s}
.pb:hover{border-color:var(--acc);color:var(--acc-d)}
.pb .ic{width:15px;height:15px}
.pb.rec{background:var(--acc);border-color:var(--acc);color:#fff}
.pb.rec:hover{background:var(--acc-d)}
.pb.live{background:var(--err);border-color:var(--err);color:#fff;animation:puls 1.3s infinite}
.pb:disabled{opacity:.45;cursor:not-allowed}
.pb.mini{padding:8px 11px}
.wv{display:inline-flex;align-items:center;gap:3px;height:24px}
.wv i{width:3px;background:currentColor;border-radius:2px;animation:wave .9s infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}
.res{margin-top:12px;border-radius:var(--r1);padding:11px 14px;font-size:13.5px;line-height:1.55;display:none}
.res.show{display:block;animation:up .3s both}
.res.good{background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc-d)}
.res.mid{background:var(--gold-soft);border:1px solid var(--gold-line);color:#6B5518}
.res.bad{background:var(--warn-soft);border:1px solid #EDD8D2;color:#8A4335}
.res b{font-weight:700}
.heard{margin-top:6px;font-size:13px;opacity:.85}
.w-ok{color:var(--acc-d);font-weight:600}
.w-no{color:var(--warn);font-weight:600;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700}

/* Wörter */
.wl{display:flex;flex-wrap:wrap;gap:8px}
.wc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.wc:hover{border-color:var(--acc);color:var(--acc-d)}
.wc .ic{width:14px;height:14px;color:var(--ink3)}
.wc:hover .ic{color:var(--acc)}

.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:14px 26px;display:inline-flex;align-items:center;gap:9px;text-decoration:none;transition:.2s;letter-spacing:-.01em}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc-d)}
.btn-s{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--acc)}
.cta{background:linear-gradient(135deg,#14708B,#1B9BC0);border-radius:var(--r3);padding:22px;color:#fff;margin-bottom:14px;box-shadow:0 14px 32px -18px rgba(27,155,192,.9)}
.cta h3{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
.cta p{font-size:14.5px;line-height:1.55;opacity:.94;margin:0 0 16px}
.cta .btn{background:#fff;color:var(--acc-d)}
.note{font-size:13px;color:var(--ink3);line-height:1.6;text-align:center;margin-top:18px}
@media(max-width:560px){
  .wrap{padding:16px 14px calc(32px + env(safe-area-inset-bottom))}
  .card{padding:18px 16px}.grid{grid-template-columns:1fr 1fr;gap:11px}
  .sz .bd{padding:11px 12px 13px}.sz .bd b{font-size:14px}.sz .bd .kz{display:none}
  .top-in{padding:10px 14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Breitbild-Layout */
@media(min-width:1000px){
  .card{padding:30px 32px}
  .card.flush{display:grid;grid-template-columns:minmax(300px,40%) 1fr;align-items:stretch;gap:0}
  .card.flush .hero{max-height:none;height:100%;aspect-ratio:auto;min-height:340px}
  .card.flush .body{padding:34px 36px;display:flex;flex-direction:column;justify-content:center}
  .lead,.card>p{max-width:78ch}
  .words{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
  .goals{columns:2;column-gap:34px}
  .goals li{break-inside:avoid}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tbl{font-size:15.5px}
}
@media(min-width:1400px){
  .words{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="icb" id="back" href="konto.html#dashboard" aria-label="Zurück"></a>
    <div class="tt"><div class="k" id="hk">Sprechen</div><div class="t" id="ht">Ernstfall-Training</div></div>
  </div>
</header>
<main class="wrap"><div id="stage"></div></main>
<script src="klang.js"></script>
<script src="stimme.js"></script>
<script src="ui-icons.js"></script>
<script src="szenarien.js"></script>
<script>
(function(){
'use strict';
var I=window.ICON||function(){return'';};
var SZ=window.SZENARIEN||[], KAT=window.SZ_KATEGORIEN||[];
var kat='alle';
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bild(id,w){ return 'illu/'+id+(w&&w<=500?'-s':'')+'.jpg'; }

/* ---------- Sprachausgabe ---------- */
var voice=null;
function pv(){ try{ var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf('de')===0;});
  voice=v.find(function(x){return /female|anna|petra|katja|vicki/i.test(x.name);})||v[0]||null; }catch(e){} }
if(window.speechSynthesis){ pv(); speechSynthesis.onvoiceschanged=pv; }
window.__hoer=function(btn,txt,slow){
  if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(txt); u.lang='de-DE'; u.rate=slow?0.62:0.92; if(voice)u.voice=voice;
  if(btn){ btn.classList.add('live'); u.onend=function(){ btn.classList.remove('live'); }; }
  speechSynthesis.speak(u);
};

/* ---------- Aufnahme ---------- */
var rec=null, chunks=[], recIdx=-1, blobs={};
function stopRec(){ try{ if(rec&&rec.state==='recording') rec.stop(); }catch(e){} }
window.__auf=async function(btn,i){
  if(recIdx===i){ stopRec(); return; }
  stopRec();
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[]; recIdx=i;
    rec=new MediaRecorder(stream);
    rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      blobs[i]=new Blob(chunks,{type:'audio/webm'});
      stream.getTracks().forEach(function(t){t.stop();});
      recIdx=-1;
      var b=document.querySelector('.pb-rec[data-i="'+i+'"]');
      if(b){ b.classList.remove('live'); b.innerHTML=I('mic',15)+'<span>Nochmal</span>'; }
      var pb=document.querySelector('.pb-play[data-i="'+i+'"]');
      if(pb) pb.style.display='';
    };
    rec.start();
    btn.classList.add('live'); btn.innerHTML=I('check',15)+'<span>Stopp</span>';
  }catch(e){
    zeig(i,'bad','<b>Kein Mikrofon-Zugriff.</b><br>Erlaube den Zugriff in deinem Browser, dann klappt das Aufnehmen.');
  }
};
window.__abspielen=function(i){
  if(!blobs[i]) return;
  var a=new Audio(URL.createObjectURL(blobs[i])); a.play();
};

/* ---------- Ausspracheprüfung ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(s){ return String(s).toLowerCase().replace(/[.,!?;:„""'…-]/g,'').replace(/\s+/g,' ').trim(); }
function woerter(s){ return norm(s).split(' ').filter(Boolean); }
window.__pruef=function(btn,i,ziel){
  if(!SR){ zeig(i,'mid','<b>Dein Browser kann die Aussprache nicht automatisch prüfen.</b><br>Nimm dich stattdessen auf und vergleiche selbst mit dem Vorbild — das funktioniert überall.'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var r=new SR(); r.lang='de-DE'; r.interimResults=false; r.maxAlternatives=3;
  btn.classList.add('live'); btn.innerHTML='<span class="wv"><i></i><i></i><i></i><i></i></span><span>Sprich jetzt …</span>';
  function reset(){ btn.classList.remove('live'); btn.innerHTML=I('target',15)+'<span>Aussprache prüfen</span>'; }
  r.onresult=function(ev){
    var alts=[]; for(var a=0;a<ev.results[0].length;a++) alts.push(ev.results[0][a].transcript);
    var zw=woerter(ziel), best=null, bestScore=-1;
    alts.forEach(function(t){
      var gw=woerter(t), hit=0, used={};
      zw.forEach(function(w){ for(var k=0;k<gw.length;k++){ if(!used[k]&&gw[k]===w){ used[k]=1; hit++; break; } } });
      var sc=zw.length?hit/zw.length:0;
      if(sc>bestScore){ bestScore=sc; best={text:t,gw:gw,hit:hit}; }
    });
    var pct=Math.round(bestScore*100);
    var used={};
    var marked=zw.map(function(w){
      for(var k=0;k<best.gw.length;k++){ if(!used[k]&&best.gw[k]===w){ used[k]=1; return '<span class="w-ok">'+esc(w)+'</span>'; } }
      return '<span class="w-no">'+esc(w)+'</span>';
    }).join(' ');
    var art = pct>=85?'good' : pct>=55?'mid' : 'bad';
    var kopf = pct>=85?'Sehr gut verstanden.' : pct>=55?'Fast — ein paar Wörter fehlten.' : 'Noch nicht ganz. Hör das Vorbild nochmal an.';
    zeig(i, art,
      '<span class="score">'+I(pct>=85?'check':'target',16)+kopf+' '+pct+' %</span>'
      + '<div class="heard">Erkannt: '+marked+'</div>'
      + (pct<85?'<div class="heard">Gehört: „'+esc(best.text)+'"</div>':''));
    if(pct>=85){ var box=document.querySelector('.p[data-i="'+i+'"]'); if(box) box.classList.add('ok'); }
    reset();
  };
  r.onerror=function(){ zeig(i,'mid','<b>Ich konnte nichts hören.</b><br>Prüfe dein Mikrofon und sprich etwas lauter.'); reset(); };
  r.onend=reset;
  try{ r.start(); }catch(e){ reset(); }
};
function zeig(i,art,html){
  var el=document.querySelector('.res[data-i="'+i+'"]');
  if(el){ el.className='res show '+art; el.innerHTML=html; }
}

/* ---------- Ansichten ---------- */
function liste(){
  document.getElementById('hk').textContent='Sprechen';
  document.getElementById('ht').textContent='Ernstfall-Training';
  document.getElementById('back').setAttribute('href','konto.html#dashboard');
  var f=KAT.map(function(k){ return '<button class="f'+(kat===k.id?' on':'')+'" onclick="__kat(\''+k.id+'\')">'+esc(k.label)+'</button>'; }).join('');
  var list=SZ.filter(function(s){ return kat==='alle'||s.kat===kat; });
  var g=list.map(function(s,i){
    return '<button class="sz" style="animation-delay:'+(i*40)+'ms" onclick="__auf_sz(\''+s.id+'\')">'
      +'<span class="im"><img src="'+bild(s.bild,500)+'" alt="" loading="lazy"><span class="lv">'+esc(s.lvl)+'</span></span>'
      +'<span class="bd"><b>'+esc(s.titel)+'</b><span class="kz">'+esc(s.kurz)+'</span>'
      +'<span class="go">'+I('mic',14)+'Üben</span></span></button>';
  }).join('');
  document.getElementById('stage').innerHTML=
     '<h1>Sprich den Ernstfall</h1>'
    +'<p class="lead">Kein Small Talk im Café. Hier übst du die Gespräche, bei denen es in Deutschland wirklich zählt — mit Ziel, Hindernis und echtem Nachsprechen.</p>'
    +'<div class="filters">'+f+'</div>'
    +'<div class="grid">'+g+'</div>'
    +'<p class="note">'+list.length+' von '+SZ.length+' Szenarien · weitere kommen regelmäßig dazu</p>';
  window.scrollTo({top:0,behavior:'smooth'});
}
window.__kat=function(k){ kat=k; liste(); };
window.__auf_sz=function(id){
  var s=null; SZ.forEach(function(x){ if(x.id===id) s=x; });
  if(!s){ liste(); return; }
  blobs={};
  document.getElementById('hk').textContent='Szenario';
  document.getElementById('ht').textContent=s.titel;
  document.getElementById('back').setAttribute('href','javascript:void(0)');
  document.getElementById('back').onclick=function(){ liste(); return false; };
  var ph=s.redemittel.map(function(t,i){
    return '<div class="p" data-i="'+i+'"><div class="ptop"><span class="pn">'+(i+1)+'</span><span class="ptx">'+esc(t)+'</span></div>'
      +'<div class="pacts">'
      +'<button class="pb" onclick="__hoer(this,\''+esc(t).replace(/'/g,"\\'")+'\',0)">'+I('speaker',15)+'<span>Anhören</span></button>'
      +'<button class="pb mini" title="Langsam" onclick="__hoer(this,\''+esc(t).replace(/'/g,"\\'")+'\',1)">'+I('clock',15)+'<span>Langsam</span></button>'
      +'<button class="pb rec pb-rec" data-i="'+i+'" onclick="__auf(this,'+i+')">'+I('mic',15)+'<span>Aufnehmen</span></button>'
      +'<button class="pb pb-play" data-i="'+i+'" style="display:none" onclick="__abspielen('+i+')">'+I('play',15)+'<span>Meine Aufnahme</span></button>'
      +'<button class="pb" onclick="__pruef(this,'+i+',\''+esc(t).replace(/'/g,"\\'")+'\')">'+I('target',15)+'<span>Aussprache prüfen</span></button>'
      +'</div><div class="res" data-i="'+i+'"></div></div>';
  }).join('');
  var wl=s.woerter.map(function(w){
    return '<span class="wc" onclick="__hoer(null,\''+esc(w).replace(/'/g,"\\'")+'\',0)">'+I('speaker',14)+esc(w)+'</span>';
  }).join('');
  document.getElementById('stage').innerHTML=
     '<div class="hero"><img src="'+bild(s.bild,1000)+'" alt=""></div>'
    +'<div class="chips"><span class="chip">'+I('chart',14)+esc(s.lvl)+'</span><span class="chip">'+I('clock',14)+esc(s.dauer)+'</span></div>'
    +'<h1>'+esc(s.titel)+'</h1><p class="lead">'+esc(s.kurz)+'</p>'
    +'<div class="card"><h2>'+I('target',19)+'Deine Mission</h2><p class="sub">Ein Ort allein ist noch keine Aufgabe. Hier weißt du genau, was du erreichen musst — und was dir im Weg steht.</p>'
    +'<div class="brief">'
    +'<div class="br r"><span class="bi">'+I('user',17)+'</span><div class="bt"><div class="bl">Deine Rolle</div><div class="bx">'+esc(s.rolle)+'</div></div></div>'
    +'<div class="br z"><span class="bi">'+I('target',17)+'</span><div class="bt"><div class="bl">Dein Ziel</div><div class="bx">'+esc(s.ziel)+'</div></div></div>'
    +'<div class="br h"><span class="bi">'+I('lock',17)+'</span><div class="bt"><div class="bl">Das Hindernis</div><div class="bx">'+esc(s.hindernis)+'</div></div></div>'
    +'<div class="br e"><span class="bi">'+I('check',17)+'</span><div class="bt"><div class="bl">Geschafft, wenn</div><div class="bx">'+esc(s.erfolg)+'</div></div></div>'
    +'</div></div>'
    +'<div class="card"><h2>'+I('mic',19)+'Hören &amp; nachsprechen</h2>'
    +'<p class="sub">Hör dir jeden Satz an — normal oder langsam. Dann nimm dich selbst auf und vergleiche. Oder lass deine Aussprache direkt prüfen.</p>'
    +'<div class="ph">'+ph+'</div>'
    +'<div class="hint">'+I('spark',16)+'<span>Sprich lauter und langsamer, als sich richtig anfühlt. Fast alle sprechen in einer Fremdsprache zu leise — und werden deshalb nicht verstanden.</span></div></div>'
    +'<div class="card"><h2>'+I('cards',19)+'Wörter für dieses Gespräch</h2><p class="sub">Tippe an, um die Aussprache zu hören.</p><div class="wl">'+wl+'</div></div>'
    +'<div class="cta"><h3>Jetzt im Gespräch anwenden</h3>'
    +'<p>Amanda spielt die Gegenseite — mit dem Hindernis aus deiner Mission. Sie hört zu, antwortet und korrigiert dich sanft.</p>'
    +'<a class="btn" href="konto.html#amanda">'+I('mic',17)+'<span>Szenario mit Amanda sprechen</span></a></div>'
    +'<p class="note">Tipp: Schaffst du es nicht beim ersten Mal? Genau dafür ist das Hindernis da.</p>';
  window.scrollTo({top:0,behavior:'smooth'});
};

document.getElementById('back').innerHTML=I('arrowL',19);
if(!SZ.length){ document.getElementById('stage').innerHTML='<div class="card"><h1>Bald verfügbar</h1><p class="lead">Die Szenarien werden gerade vorbereitet.</p></div>'; }
else liste();
})();
</script>
