<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste dein Deutschniveau · deutschoderwas club</title>
<meta name="description" content="Kostenloser Deutsch-Einstufungstest A1–C1 im Goethe-/telc-Stil: Leseverstehen, Hörverstehen mit echten Audios und Sprachbausteine. In wenigen Minuten kennst du dein Niveau.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.deutschoderwas-club.de/niveau-test.html">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="niveautest.css">
<style>
:root{
  --turq:#13A89A; --turq-l:#7ED8EA; --ink:#1A1A1A; --soft:#5C5C5C;
  --cream:#FFFCF5; --line:#ECECEC; --rot:#D42A21; --gold:#FFCE00;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#FFFCF5,#F6F9FA);min-height:100vh;background-attachment:fixed}

/* ---- Kopfzeile (cleaner Marken-Look) ---- */
.ntp-bar{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.ntp-bar-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ntp-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px}
.ntp-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.ntp-logo span b{color:var(--turq)}
.ntp-logo small{display:block;font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:#9aa5a3;margin-top:-2px}
.ntp-back{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:40px;box-shadow:0 4px 12px rgba(0,0,0,.05);white-space:nowrap;transition:.15s}
.ntp-back:hover{background:var(--cream);transform:translateY(-1px)}

/* ---- Kopf des Tests ---- */
.ntp-main{max-width:760px;margin:0 auto;padding:30px 16px 80px}
.ntp-head{text-align:center;margin-bottom:22px}
.ntp-kick{display:inline-block;background:#fff;color:var(--rot);font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:6px 14px;border-radius:30px;box-shadow:0 6px 16px rgba(0,0,0,.05);margin-bottom:12px}
.ntp-head h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0;font-weight:700}
.ntp-head h1 .cap{background:linear-gradient(135deg,var(--turq),var(--turq-l));-webkit-background-clip:text;background-clip:text;color:transparent}
.ntp-head p{color:var(--soft);font-size:16px;margin:10px auto 0;max-width:520px}
#niveautest-app{max-width:760px;margin:0 auto}

/* Die Karte wiederholt Kicker und Titel — auf dieser Seite stehen sie schon oben */
.nt-intro .nt-eyebrow,.nt-intro .nt-h{display:none!important}
.nt-intro .nt-sub{margin-top:2px}

footer.ntp-foot{text-align:center;padding:6px 18px 46px;font-size:14px;color:#9aa5a3}
footer.ntp-foot a{color:var(--turq);font-weight:700}

@media(max-width:560px){.ntp-main{padding:18px 10px 70px}.ntp-logo small{display:none}}
</style>
</head>
<body>

<header class="ntp-bar">
  <div class="ntp-bar-in">
    <a class="ntp-logo" href="index.html"><img src="logo.PNG" alt="deutschoderwas" onerror="this.style.display='none'"><span>deutschoderwas <b>club</b><small>Niveau-Test</small></span></a>
    <a class="ntp-back" href="index.html">← Startseite</a>
  </div>
</header>

<main class="ntp-main">
  <div class="ntp-head">
    <div class="ntp-kick">Gratis Einstufung · A1 bis C1</div>
    <h1>Teste dein <span class="cap">Deutschniveau</span></h1>
  </div>
  <div id="niveautest-app"></div>
</main>

<footer class="ntp-foot">Fragen? Schreib an <a href="mailto:deutschlernen@deutschoderwas.de">deutschlernen@deutschoderwas.de</a></footer>

<script>window.NT_PAGE = true;</script>
<script src="niveautest-data.js"></script>
<script src="niveautest-items2.js"></script>
<script src="niveautest-items3.js"></script>
<script src="niveautest.js"></script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
