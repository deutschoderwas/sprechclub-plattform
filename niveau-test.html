<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste dein Deutschniveau · deutschoderwas club</title>
<meta name="description" content="Kostenloser Deutsch-Einstufungstest A1–C1 im Goethe-/telc-Stil: Leseverstehen, Hörverstehen mit echten Audios und Sprachbausteine. In wenigen Minuten kennst du dein Niveau.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.deutschoderwas-club.de/niveau-test.html">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Caveat+Brush&family=Permanent+Marker&family=Shantell+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="niveautest.css">
<style>
:root{
  --tuerkis:#39CCE3; --tuerkis-dunkel:#1990A4; --auf-tuerkis:#063138;
  --gelb:#FFE100; --gruen:#77D42A; --rot:#DD0000; --tinte:#20211F;
  --creme:#FFF8E0; --karte:#FFFDF3; --linie:#E7DFC7;
  --hand:255px 12px 225px 15px/15px 225px 15px 255px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--tinte);
  background:var(--creme);min-height:100vh;
  background-image:radial-gradient(circle at 92% 4%, rgba(57,204,227,.12), transparent 26%),
                   radial-gradient(circle at 5% 16%, rgba(119,212,42,.06), transparent 20%);
  background-attachment:fixed}

/* ---- Kopfzeile ---- */
.ntp-bar{background:rgba(255,253,243,.94);border-bottom:2.5px solid var(--tinte);position:sticky;top:0;z-index:10}
.ntp-bar-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ntp-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinte);
  font-family:'Shantell Sans',cursive;font-weight:700;font-size:17px}
.ntp-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2.5px solid var(--tinte)}
.ntp-logo span b{color:var(--tuerkis-dunkel);font-weight:700}
.ntp-logo small{display:block;font-family:'Caveat',cursive;font-weight:600;font-size:14px;color:#6b6f61;margin-top:-3px}
.ntp-back{font-family:'Shantell Sans',cursive;font-weight:700;font-size:14px;text-decoration:none;color:var(--tinte);
  border:2.5px solid var(--tinte);background:var(--karte);padding:8px 15px;border-radius:var(--hand);
  box-shadow:2px 3px 0 rgba(32,33,31,.16);white-space:nowrap}
.ntp-back:hover{transform:translateY(-2px)}

/* ---- Kopf des Tests ---- */
.ntp-main{max-width:720px;margin:0 auto;padding:26px 16px 80px}
.ntp-head{text-align:center;margin-bottom:20px}
.ntp-kick{font-family:'Permanent Marker',cursive;color:var(--rot);font-size:16px;margin-bottom:4px}
.ntp-head h1{font-family:'Caveat Brush',cursive;font-size:clamp(30px,5.4vw,48px);line-height:1.04;margin:0 0 8px;font-weight:400}
.ntp-head h1 .cap{color:var(--gelb);-webkit-text-stroke:2.5px var(--tinte);paint-order:stroke fill;
  text-shadow:3px 3px 0 rgba(32,33,31,.22)}
.ntp-head p{color:#54594a;font-size:16px;margin:0 auto;max-width:520px}
#niveautest-app{max-width:700px;margin:0 auto}
/* Die Karte wiederholt Kicker und Titel — auf dieser Seite stehen sie schon oben */
.nt-intro .nt-eyebrow,.nt-intro .nt-h{display:none!important}
.nt-intro .nt-sub{margin-top:2px}

/* ---- Der Test selbst im Schulheft-Stil ---- */
.nt-card,.nt-hero,.nt-mode,.nt-result,.nt-modal-box,.nt-welcome{
  background:var(--karte)!important;border:2.5px solid var(--tinte)!important;
  border-radius:var(--hand)!important;box-shadow:3px 4px 0 rgba(32,33,31,.10)!important}
.nt-h,.nt-sec-h2,.nt-level-title,.nt-mode-t,.nt-mod-h{font-family:'Shantell Sans',cursive!important;font-weight:700!important}
.nt-level-big{font-family:'Caveat Brush',cursive!important}
.nt-sec-tag,.nt-eyebrow{font-family:'Shantell Sans',cursive!important;color:var(--tuerkis-dunkel)!important}
.nt-sub,.nt-tip,.nt-pick-hint,.nt-audio-hint,.nt-gate-note,.nt-mailnote{font-family:'Caveat',cursive!important;font-size:1.1em!important;color:#6b6f61!important}
.nt-btn{font-family:'Shantell Sans',cursive!important;font-weight:700!important;
  border-radius:var(--hand)!important;border:2.5px solid var(--auf-tuerkis)!important;
  box-shadow:2px 3px 0 rgba(6,49,56,.28)!important;transition:transform .15s}
.nt-btn:hover{transform:translateY(-2px)}
.nt-btn-primary{background:var(--tuerkis)!important;color:var(--auf-tuerkis)!important}
.nt-btn-ghost{background:var(--karte)!important;color:var(--tinte)!important;
  border-color:var(--tinte)!important;box-shadow:2px 3px 0 rgba(32,33,31,.16)!important}
.nt-opt{border:2.5px solid var(--tinte)!important;border-radius:16px!important;background:#fff!important}
.nt-opt:hover{border-color:var(--tuerkis-dunkel)!important}
.nt-opt-k{font-family:'Shantell Sans',cursive!important;font-weight:700!important}
.nt-lv-badge,.nt-hero-badges span{font-family:'Shantell Sans',cursive!important;font-weight:700!important;
  border:2.5px solid var(--tinte)!important;border-radius:var(--hand)!important;background:var(--karte)!important;
  box-shadow:2px 3px 0 rgba(32,33,31,.12)!important;color:var(--tinte)!important}
.nt-bar,.nt-mod-bar{border:2px solid var(--tinte)!important;background:#fff!important;overflow:hidden}
.nt-bar-fill,.nt-mod-fill{background:var(--tuerkis)!important}
.nt-play{border:2.5px solid var(--tinte)!important;background:var(--gelb)!important;color:var(--tinte)!important;
  box-shadow:2px 3px 0 rgba(32,33,31,.16)!important}
.nt-gate input,.nt-gate-row input{border:2.5px solid var(--tinte)!important;border-radius:13px!important;
  background:#fff!important;font-family:'Inter',sans-serif!important}
.nt-readtext{background:#fff!important;border:2.5px solid var(--linie)!important;border-radius:16px!important}
.nt-fb-ok{color:#3d8a10!important}
.nt-fb-no{color:var(--rot)!important}

footer.ntp-foot{text-align:center;padding:6px 18px 46px;font-family:'Caveat',cursive;font-size:17px;color:#6b6f61}
footer.ntp-foot a{color:var(--tuerkis-dunkel);font-weight:700}

@media(max-width:560px){.ntp-main{padding:16px 10px 70px}.ntp-logo small{display:none}}
</style>
</head>
<body>

<header class="ntp-bar">
  <div class="ntp-bar-in">
    <a class="ntp-logo" href="index.html"><img src="logo.PNG" alt="deutschoderwas" onerror="this.style.display='none'"><span>deutschoderwas <b>club</b><small>Niveau-Test</small></span></a>
    <a class="ntp-back" href="index.html">← Startseite</a>
  </div>
</header>

<main class="ntp-main">
  <div class="ntp-head">
    <div class="ntp-kick">Gratis Einstufung · A1 bis C1</div>
    <h1>Teste dein <span class="cap">Deutschniveau</span></h1>
  </div>
  <div id="niveautest-app"></div>
</main>

<footer class="ntp-foot">Fragen? Schreib an <a href="mailto:deutschlernen@deutschoderwas.de">deutschlernen@deutschoderwas.de</a></footer>

<script>window.NT_PAGE = true;</script>
<script src="niveautest-data.js"></script>
<script src="niveautest-items2.js"></script>
<script src="niveautest-items3.js"></script>
<script src="niveautest.js"></script>
</body>
</html>
