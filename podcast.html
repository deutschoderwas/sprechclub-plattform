<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Podcast – deutschoderwas club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF9F5">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --ink:#171717; --ink2:#6E6A63; --ink3:#9A958C;
  --line:#EBE7DF; --line2:#F4F1EA;
  --acc:#1B9BC0; --acc-d:#14708B; --acc-soft:#E6F8FC; --acc-line:#C7E9F3;
  --gold:#E8B923; --r1:12px; --r2:16px; --r3:22px;
  --sh:0 1px 2px rgba(23,23,23,.04), 0 8px 24px -16px rgba(23,23,23,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.ic{flex:none;vertical-align:-.15em}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.top{position:sticky;top:0;z-index:30;background:rgba(251,249,245,.9);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line2)}
.top-in{max-width:1240px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:13px}
.icb{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex:none;transition:.2s}
.icb:hover{color:var(--ink);border-color:var(--ink3)}
.tt{flex:1;min-width:0}
.tt .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-d)}
.tt .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrap{max-width:1240px;margin:0 auto;padding:20px 18px calc(190px + env(safe-area-inset-bottom))}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5.4vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1.14;margin:0 0 10px}
.lead{color:var(--ink2);font-size:15px;line-height:1.65;margin:0 0 18px}
h2{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px;display:flex;align-items:center;gap:9px}
h2 .ic{color:var(--acc-d)}

/* Liste */
.grid{display:flex;flex-direction:column;gap:12px}
.pc{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r3);padding:14px;cursor:pointer;text-align:left;font-family:inherit;box-shadow:var(--sh);transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .25s;animation:up .4s both}
.pc:hover{transform:translateY(-3px);border-color:var(--acc-line);box-shadow:0 2px 4px rgba(23,23,23,.05),0 18px 36px -18px rgba(23,23,23,.24)}
.pc .im{width:82px;height:82px;border-radius:var(--r2);overflow:hidden;flex:none;background:#FAF4E6}
.pc .im img{display:block;width:100%;height:100%;object-fit:cover}
.pc .bd{flex:1;min-width:0}
.pc .mt{display:flex;gap:7px;align-items:center;margin-bottom:4px}
.lvl{background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc-d);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.pc .bd b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-bottom:3px}
.pc .bd .kz{font-size:13px;color:var(--ink2);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .go{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}

/* Detail */
.head{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.head .im{width:104px;height:104px;border-radius:var(--r3);overflow:hidden;flex:none;background:#FAF4E6;border:1px solid var(--line)}
.head .im img{display:block;width:100%;height:100%;object-fit:cover}
.head .hx{flex:1;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip .ic{width:14px;height:14px;color:var(--ink3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:20px;box-shadow:var(--sh);margin-bottom:14px}

/* Transkript */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tb{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-family:inherit;font-weight:600;font-size:13.5px;padding:10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.tb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tb .ic{width:15px;height:15px}
.tr{display:flex;flex-direction:column;gap:2px}
.sg{padding:11px 14px;border-radius:var(--r1);font-size:16.5px;line-height:1.6;color:var(--ink3);cursor:pointer;transition:color .3s,background .3s,transform .3s;border:none;background:none;font-family:inherit;text-align:left;width:100%}
.sg:hover{background:var(--line2);color:var(--ink2)}
.sg.past{color:var(--ink3)}
.sg.now{color:var(--ink);font-weight:600;background:var(--acc-soft)}
.sg.future{color:var(--ink3)}
/* Mitlesen Wort für Wort. Der Satz allein war zu grob: Bei einem
   langen Satz weiß man nach zwei Sekunden nicht mehr, wo man ist.
   Jetzt wandert die Markierung mit der Stimme mit — gesprochene
   Wörter bleiben kräftig, das aktuelle ist unterlegt, der Rest
   wartet blass. */
.sg .wd{transition:color .12s,background .12s;border-radius:5px;padding:0 1px}
.sg.now .wd{color:var(--ink3)}
.sg.now .wd.gesagt{color:var(--ink)}
.sg.now .wd.jetzt{color:var(--acc-d);background:#fff;font-weight:700;
                  box-shadow:0 0 0 3px #fff,0 0 0 4px var(--acc-line)}
.sg.past .wd,.sg.future .wd{background:none;box-shadow:none;font-weight:inherit}
@media (prefers-reduced-motion:reduce){ .sg .wd{transition:none} }
.sg .zt{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:2px;opacity:0;transition:opacity .2s}
.sg:hover .zt,.sg.now .zt{opacity:1}
.sg.now .zt{color:var(--acc-d)}
.only-de .sg{font-size:16.5px}

/* Wörter */
.wl{display:flex;flex-wrap:wrap;gap:8px}
.wc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.wc:hover{border-color:var(--acc);color:var(--acc-d)}
.wc .ic{width:14px;height:14px;color:var(--ink3)}

/* Player */
.pl{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(252,250,246,.97);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.pl-in{max-width:1240px;margin:0 auto;padding:14px 18px 16px}
.pl-t{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.pl-t .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-t .zt{font-size:12px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--line2);cursor:pointer;position:relative;margin-bottom:13px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);width:0;transition:width .15s linear}
.bar::after{content:"";position:absolute;inset:-9px 0}
.ctr{display:flex;align-items:center;justify-content:center;gap:10px}
.cb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:12px;font-weight:700;font-family:inherit}
.cb:hover{border-color:var(--acc);color:var(--acc-d)}
.cb.on{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc-d)}
.cb.big{width:60px;height:60px;background:var(--acc);border-color:var(--acc);color:#fff}
.cb.big:hover{background:var(--acc-d)}
.err{text-align:center;padding:50px 20px;color:var(--ink2)}
@media(max-width:560px){
  .wrap{padding:16px 14px calc(180px + env(safe-area-inset-bottom))}
  .card{padding:17px 15px}.head .im{width:82px;height:82px}
  .sg{font-size:16px;padding:10px 12px}.pl-in{padding:12px 14px 14px}
  .cb{width:42px;height:42px}.cb.big{width:56px;height:56px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Breitbild-Layout */
@media(min-width:1000px){
  .card{padding:30px 32px}
  .card.flush{display:grid;grid-template-columns:minmax(300px,40%) 1fr;align-items:stretch;gap:0}
  .card.flush .hero{max-height:none;height:100%;aspect-ratio:auto;min-height:340px}
  .card.flush .body{padding:34px 36px;display:flex;flex-direction:column;justify-content:center}
  .lead,.card>p{max-width:78ch}
  .words{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
  .goals{columns:2;column-gap:34px}
  .goals li{break-inside:avoid}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tbl{font-size:15.5px}
}
@media(min-width:1400px){
  .words{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="icb" id="back" href="konto.html#dashboard" aria-label="Zurück"></a>
    <div class="tt"><div class="k" id="hk">Podcast</div><div class="t" id="ht">Hören &amp; Mitlesen</div></div>
  </div>
</header>
<main class="wrap"><div id="stage"></div></main>
<div class="pl" id="player" style="display:none">
  <div class="pl-in">
    <div class="pl-t"><span class="nm" id="plNm"></span><span class="zt" id="plZt">0:00 / 0:00</span></div>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="ctr">
      <button class="cb" id="bSlow" title="Tempo">1×</button>
      <button class="cb" id="bBack" title="15 Sekunden zurück"></button>
      <button class="cb big" id="bPlay" title="Abspielen"></button>
      <button class="cb" id="bFwd" title="15 Sekunden vor"></button>
      <button class="cb on" id="bSync" title="Mitlesen folgt automatisch"></button>
    </div>
  </div>
</div>
<audio id="au" preload="metadata"></audio>
<script src="ui-icons.js"></script>
<!-- Die Folgen liegen in der Datenbank. Dafür braucht diese Seite
     denselben Zugang wie der Schülerbereich. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="podcasts.js"></script>
<script src="stimmen.js"></script>
<script>
(function(){
'use strict';
var I=window.ICON||function(){return'';};
var PC=window.PODCASTS||[];
var au=document.getElementById('au'), cur=null, folgen=true, akt=-1, nurDE=false;
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bild(id,w){
  id=String(id||'');
  /* Aus der Datenbank kommt eine fertige Bildadresse, aus der alten
     Datei nur ein Kürzel wie "kat-alltag". Beides muss gehen. */
  if(/^https?:|^\/|\.(jpg|jpeg|png|svg|webp)$/i.test(id)) return id;
  return 'illu/'+id+(w&&w<=500?'-s':'')+'.jpg';
}
/* Ein Wort der Folge ist entweder nur ein Wort oder ein Wort mit Erklärung. */
function wortText(w){ return (w&&typeof w==='object') ? (w.w||'') : String(w||''); }
function wortInfo(w){ return (w&&typeof w==='object') ? (w.e||w.info||'') : ''; }
function zeit(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

/* Sprachausgabe für Einzelwörter */
var voice=null;
function pv(){ try{ var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf('de')===0;});
  voice=v.find(function(x){return /female|anna|petra|katja|vicki/i.test(x.name);})||v[0]||null; }catch(e){} }
if(window.speechSynthesis){ pv(); speechSynthesis.onvoiceschanged=pv; }
window.__sag=function(t){ if(window.sagen){ window.sagen(t,{rolle:'julia'}); return; } if(!window.speechSynthesis)return; try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(t); u.lang='de-DE'; u.rate=.85; if(voice)u.voice=voice; speechSynthesis.speak(u); };

/* ---------- Liste ---------- */
function liste(){
  document.getElementById('hk').textContent='Podcast';
  document.getElementById('ht').textContent='Hören & Mitlesen';
  document.getElementById('back').setAttribute('href','konto.html#dashboard');
  document.getElementById('back').onclick=null;
  document.getElementById('player').style.display='none';
  try{ au.pause(); }catch(e){}
  var g=PC.map(function(p,i){
    return '<button class="pc" style="animation-delay:'+(i*50)+'ms" onclick="__oeffne(\''+p.id+'\')">'
      +'<span class="im"><img src="'+bild(p.bild,500)+'" alt="" loading="lazy"></span>'
      +'<span class="bd"><span class="mt"><span class="lvl">'+esc(p.level)+'</span><span class="zt" style="font-size:12px;color:var(--ink3);font-weight:600">'+esc(p.dauer)+'</span></span>'
      +'<b>'+esc(p.titel)+'</b><span class="kz">'+esc(p.kurz)+'</span></span>'
      +'<span class="go">'+I('play',17)+'</span></button>';
  }).join('');
  document.getElementById('stage').innerHTML=
     '<h1>Podcast</h1><p class="lead">Hör zu und lies mit — der Text läuft automatisch mit. Tippe eine Zeile an, um dorthin zu springen.</p>'
    +'<div class="grid">'+g+'</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Detail ---------- */
window.__oeffne=function(id){
  var p=null; PC.forEach(function(x){ if(x.id===id) p=x; });
  if(!p){ liste(); return; }
  cur=p; akt=-1; folgen=true;
  document.getElementById('hk').textContent=p.level+' · '+p.tag;
  document.getElementById('ht').textContent=p.titel;
  var b=document.getElementById('back');
  b.setAttribute('href','javascript:void(0)');
  b.onclick=function(){ liste(); return false; };
  var tr=p.transkript.map(function(s,i){
    return '<button class="sg future" data-i="'+i+'" onclick="__spring('+i+')">'
      +'<span class="zt">'+zeit(s.t)+'</span>'+worteHtml(s)+'</button>';
  }).join('');
  var wl=(p.woerter||[]).map(function(w){
    var t=wortText(w), i=wortInfo(w);
    return '<span class="wc" title="'+esc(i)+'" onclick="__sag(\''+esc(t).replace(/'/g,"\\'")+'\')">'
      +I('speaker',14)+esc(t)+(i?'<em style="font-style:normal;color:var(--ink3);font-weight:400"> — '+esc(i)+'</em>':'')+'</span>';
  }).join('');
  document.getElementById('stage').innerHTML=
     '<div class="head"><span class="im"><img src="'+bild(p.bild,700)+'" alt=""></span>'
    +'<div class="hx"><h1 style="margin:0">'+esc(p.titel)+'</h1>'
    +'<div class="meta"><span class="chip">'+I('chart',14)+esc(p.level)+'</span><span class="chip">'+I('clock',14)+esc(p.dauer)+'</span>'
    +'<span class="chip">'+I('cards',14)+p.transkript.length+' Sätze</span></div></div></div>'
    +'<p class="lead">'+esc(p.kurz)+'</p>'
    +'<div class="card"><h2>'+I('book',18)+'Mitlesen</h2>'
    +'<div class="tabs"><button class="tb on" id="tbSync" onclick="__folgen()">'+I('target',15)+'<span>Folgt automatisch</span></button>'
    +'<button class="tb" onclick="__gross(this)">'+I('cards',15)+'<span>Größere Schrift</span></button></div>'
    +'<div class="tr" id="tr">'+tr+'</div></div>'
    +'<div class="card"><h2>'+I('cards',18)+'Wörter der Folge</h2><div class="wl">'+wl+'</div></div>';
  document.getElementById('plNm').textContent=p.titel;
  document.getElementById('player').style.display='';
  au.src=p.datei; au.load();
  window.scrollTo({top:0,behavior:'smooth'});
};
/* Ein Satz wird zu einzelnen Wortspannen. Wenn die Folge Wortzeiten
   mitbringt (neue Folgen, aus den Buchstabenzeiten von ElevenLabs),
   stehen sie am Element; sonst rechnet die Seite sie beim Abspielen
   aus der Satzdauer aus — dann sitzt die Markierung ungefähr statt
   genau, was fürs Mitlesen reicht. */
function worteHtml(s){
  var teile = String(s.x||'').split(/(\s+)/);
  var zeiten = Array.isArray(s.w) ? s.w : null;
  var wi = 0, h = '';
  for (var k=0;k<teile.length;k++){
    var teil = teile[k];
    if (!teil) continue;
    if (/^\s+$/.test(teil)) { h += teil; continue; }
    var z = zeiten && zeiten[wi];
    h += '<span class="wd" data-w="'+wi+'"'
       + (z ? ' data-t="'+z.t+'" data-e="'+z.e+'"' : '')
       + '>'+esc(teil)+'</span>';
    wi++;
  }
  return h;
}

/* Welches Wort läuft gerade? Mit echten Zeiten wird verglichen, ohne
   sie wird die Satzdauer nach Wortlänge aufgeteilt — lange Wörter
   bekommen mehr Zeit als kurze. */
function wortIndex(satzEl, s, t){
  var wds = satzEl.querySelectorAll('.wd');
  if (!wds.length) return -1;
  if (wds[0].hasAttribute('data-t')){
    var treffer = -1;
    for (var i=0;i<wds.length;i++){
      var wt = parseFloat(wds[i].getAttribute('data-t'));
      if (t >= wt - 0.04) treffer = i; else break;
    }
    return treffer;
  }
  var dauer = Math.max(0.2, (s.e||0) - (s.t||0));
  var laengen = [], gesamt = 0, j;
  for (j=0;j<wds.length;j++){ var L = (wds[j].textContent||'').length + 1; laengen.push(L); gesamt += L; }
  var vergangen = Math.max(0, t - (s.t||0));
  var grenze = 0;
  for (j=0;j<wds.length;j++){
    grenze += (laengen[j]/gesamt) * dauer;
    if (vergangen < grenze) return j;
  }
  return wds.length - 1;
}

/* Markiert im laufenden Satz die Wörter. */
function markiereWorte(i, t){
  var satzEl = document.querySelector('#tr .sg[data-i="'+i+'"]');
  if (!satzEl || !cur) return;
  var s = cur.transkript[i]; if (!s) return;
  var k = wortIndex(satzEl, s, t);
  if (k === letztesWort && i === letzterSatz) return;
  letztesWort = k; letzterSatz = i;
  var wds = satzEl.querySelectorAll('.wd');
  for (var j=0;j<wds.length;j++){
    wds[j].className = 'wd' + (j < k ? ' gesagt' : j === k ? ' jetzt' : '');
  }
}
var letztesWort = -1, letzterSatz = -1;

window.__folgen=function(){
  folgen=!folgen;
  document.getElementById('tbSync').classList.toggle('on',folgen);
  document.getElementById('bSync').classList.toggle('on',folgen);
  if(folgen) scrollAkt();
};
window.__gross=function(b){
  nurDE=!nurDE; b.classList.toggle('on',nurDE);
  document.getElementById('tr').style.fontSize=nurDE?'1.14em':'';
};
window.__spring=function(i){
  if(!cur) return;
  au.currentTime=cur.transkript[i].t+0.05;
  if(au.paused) au.play().catch(function(){});
};

/* ---------- Synchronisation ---------- */
function markiere(i){
  if(i===akt) return;
  var nodes=document.querySelectorAll('#tr .sg');
  nodes.forEach(function(n,k){
    n.className='sg '+(k<i?'past':k===i?'now':'future');
    if (k !== i) n.querySelectorAll('.wd').forEach(function(w){ w.className='wd'; });
  });
  letztesWort = -1;
  akt=i;
  if(folgen) scrollAkt();
}
function scrollAkt(){
  var n=document.querySelector('#tr .sg.now'); if(!n) return;
  var r=n.getBoundingClientRect();
  var mitte=(window.innerHeight-190)/2;
  if(r.top<90||r.top>mitte+120){
    window.scrollTo({ top: window.scrollY + r.top - mitte, behavior:'smooth' });
  }
}
au.addEventListener('timeupdate',function(){
  if(!cur) return;
  var t=au.currentTime, T=cur.transkript, i=-1;
  for(var k=0;k<T.length;k++){ if(t>=T[k].t-0.15) i=k; else break; }
  if(i>=0){ markiere(i); markiereWorte(i, t); }
  var d=au.duration||0;
  document.getElementById('barI').style.width=(d?(t/d*100):0)+'%';
  document.getElementById('plZt').textContent=zeit(t)+' / '+zeit(d);
});
au.addEventListener('play',function(){ document.getElementById('bPlay').innerHTML=I('check',22).replace('d="M4.5 12.5 9.5 17.5 19.5 6.5"','d="M9 5.5v13M15 5.5v13"'); });
au.addEventListener('pause',function(){ document.getElementById('bPlay').innerHTML=I('play',22); });
au.addEventListener('loadedmetadata',function(){ document.getElementById('plZt').textContent='0:00 / '+zeit(au.duration); });

/* ---------- Bedienung ---------- */
document.getElementById('bPlay').onclick=function(){ if(au.paused) au.play().catch(function(){}); else au.pause(); };
document.getElementById('bBack').onclick=function(){ au.currentTime=Math.max(0,au.currentTime-15); };
document.getElementById('bFwd').onclick=function(){ au.currentTime=Math.min(au.duration||0,au.currentTime+15); };
document.getElementById('bSync').onclick=window.__folgen;
var tempi=[1,0.85,0.7,1.15], ti=0;
document.getElementById('bSlow').onclick=function(){
  ti=(ti+1)%tempi.length; au.playbackRate=tempi[ti];
  this.textContent=tempi[ti]+'×'; this.classList.toggle('on',tempi[ti]!==1);
};
document.getElementById('bar').onclick=function(e){
  var r=this.getBoundingClientRect();
  au.currentTime=((e.clientX-r.left)/r.width)*(au.duration||0);
};

document.getElementById('back').innerHTML=I('arrowL',19);
document.getElementById('bBack').innerHTML=I('arrowL',18);
document.getElementById('bFwd').innerHTML=I('arrowR',18);
document.getElementById('bPlay').innerHTML=I('play',22);
document.getElementById('bSync').innerHTML=I('target',18);
function zeichnen(){
  PC=window.PODCASTS||[];
  if(!PC.length){
    document.getElementById('stage').innerHTML='<div class="err">'
      +(window.PODCASTS_STAND==='seed'?'Folgen werden geladen …':'Noch keine Folgen verfügbar.')+'</div>';
  } else liste();
}
/* Die Folgen kommen aus der Datenbank und treffen kurz nach dem
   Seitenaufbau ein. Dann noch einmal zeichnen — aber nur, wenn
   gerade keine Folge offen ist, sonst reißt es die Wiedergabe ab. */
window.addEventListener('podcasts-geladen',function(){ if(!cur) zeichnen(); });
zeichnen();
})();
</script>
