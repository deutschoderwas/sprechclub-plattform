<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deutschoderwas club · Quiz & Spiele</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181B;--soft:#5A6B72;--line:#E7ECEE;--bg:#F6F9FA;--card:#FFFFFF;--primary:#D42A21;--turq:#1B9BC0;--accent:#FFE100;--green:#4E9E12;--radius:18px;--shadow:0 2px 10px rgba(20,24,27,.05);--shadow-m:0 10px 26px rgba(20,24,27,.09);--akz:#1B9BC0;--akz-soft:#E4F3F8;--akz-text:#10627A;--akz-tint:#F7FBFC;}
body[data-niveau="ab"]{--akz:#1B9BC0;--akz-soft:#E1F2F7;--akz-text:#0F5C6B;--akz-tint:#F4FAFC;}
body[data-niveau="bb"]{--akz:#C9A200;--akz-soft:#FBF1C4;--akz-text:#6B4E00;--akz-tint:#FEFBEF;}
body[data-niveau="bc"]{--akz:#D42A21;--akz-soft:#FBE3E1;--akz-text:#9A1C16;--akz-tint:#FEF6F5;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--akz-tint);-webkit-font-smoothing:antialiased;transition:background .25s;}
h1,h2,h3,h4{font-family:'Space Grotesk','Segoe UI',sans-serif;}
.band{height:4px;background:var(--akz);transition:background .25s;}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.marke{font-family:'Space Grotesk';font-weight:700;font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:9px;}
.marke .wm{color:var(--ink);}.marke .club{color:var(--turq);margin-left:5px;}
.nivbadge{font-family:'Space Grotesk';font-weight:600;font-size:.82rem;border:1px solid var(--akz);color:var(--akz-text);background:var(--akz-soft);border-radius:999px;padding:3px 12px;}
.suche{flex:1 1 200px;position:relative;min-width:150px;}
.suche input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px 10px 38px;font-family:'Inter';font-size:.95rem;color:var(--ink);outline:none;}
.suche input:focus{border-color:var(--akz);background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--akz) 15%,transparent);}
.suche .lupe{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soft);}
.niv{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.niv .cap{font-weight:600;font-size:.78rem;color:var(--soft);}
.niv button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-family:'Space Grotesk';font-weight:600;font-size:.82rem;cursor:pointer;color:var(--ink);transition:.12s;display:inline-flex;align-items:center;gap:7px;}
.niv button .dot{width:9px;height:9px;border-radius:999px;display:inline-block;}
.niv button[data-n="ab"] .dot{background:#1B9BC0;}.niv button[data-n="bb"] .dot{background:#C9A200;}.niv button[data-n="bc"] .dot{background:#D42A21;}.niv button[data-n="all"] .dot{background:var(--soft);}
.niv button:hover{border-color:var(--akz);}.niv button.on{color:#fff;border-color:transparent;}
.niv button[data-n="ab"].on{background:#1B9BC0;}.niv button[data-n="bb"].on{background:#C9A200;}.niv button[data-n="bc"].on{background:#D42A21;}.niv button[data-n="all"].on{background:var(--ink);}
.niv button.on .dot{background:#fff;}
.reihe{display:inline-flex;align-items:center;gap:7px;margin-left:auto;background:var(--akz-soft);color:var(--akz-text);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.84rem;}
.wrap{display:grid;grid-template-columns:300px 1fr;max-width:1500px;margin:0 auto;min-height:calc(100vh - 95px);position:relative;transition:grid-template-columns .2s;}
body.zu .wrap{grid-template-columns:0 1fr;}
.liste{border-right:1px solid var(--line);background:var(--card);padding:16px 12px 40px;overflow:auto;position:relative;}
body.zu .liste{display:none;}
.niv-ribbon{display:flex;align-items:center;gap:9px;background:var(--akz-soft);border:1px solid color-mix(in srgb,var(--akz) 35%,transparent);border-radius:12px;padding:9px 12px;margin:0 2px 12px;font-family:'Space Grotesk';font-weight:600;font-size:.9rem;color:var(--akz-text);}
.niv-ribbon .pt{width:12px;height:12px;border-radius:999px;}
.gruppe-h{font-weight:700;font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--soft);padding:14px 10px 8px;}
.b-item{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 11px;margin-bottom:2px;cursor:pointer;transition:.1s;display:flex;align-items:center;gap:11px;}
.b-item:hover{background:var(--bg);}.b-item.on{background:var(--akz-soft);border-color:color-mix(in srgb,var(--akz) 30%,transparent);}
.b-item .em{flex:none;width:32px;height:32px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.b-item.on .em{background:#fff;}
.b-item .bn{flex:1;font-weight:600;font-size:.92rem;line-height:1.2;}
.b-item .ct{flex:none;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;color:var(--soft);background:var(--bg);border-radius:999px;padding:1px 8px;}
.b-item.on .ct{color:var(--akz-text);background:#fff;}.b-item.leer .bn,.b-item.leer .ct{opacity:.5;}
.zieher{position:absolute;top:14px;right:-13px;z-index:20;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--soft);box-shadow:var(--shadow);}
.auf{position:fixed;left:14px;top:106px;z-index:40;display:none;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-m);border-radius:999px;padding:8px 14px;font-family:'Space Grotesk';font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink);}
body.zu .auf{display:inline-flex;}
.detail{padding:28px 36px 70px;overflow:auto;}
.welc{max-width:640px;margin:7vh auto 0;text-align:center;}
.welc .em{font-size:2.6rem;width:94px;height:94px;border-radius:999px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.welc h1{font-size:2rem;margin:10px 0 10px;letter-spacing:-.01em;}
.welc p{color:var(--soft);font-size:1.05rem;line-height:1.6;margin:0 auto;max-width:500px;}
.welc .hint{margin-top:22px;display:inline-flex;gap:8px;align-items:center;background:var(--akz);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow-m);}
.b-kopf{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.b-kopf .em{width:50px;height:50px;border-radius:14px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.b-kopf h1{font-size:1.7rem;margin:0;letter-spacing:-.01em;}.b-kopf .sub{color:var(--soft);font-size:.88rem;font-weight:600;}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:15px;margin-top:22px;}
.karte{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;cursor:pointer;transition:.14s;box-shadow:var(--shadow);}
.karte:hover{border-color:var(--akz);box-shadow:var(--shadow-m);transform:translateY(-2px);}
.karte .kem{width:40px;height:40px;border-radius:12px;background:var(--akz-soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:12px;}
.karte .kt{font-family:'Space Grotesk';font-weight:600;font-size:1.12rem;line-height:1.2;}
.karte .kmeta{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--soft);font-size:.82rem;}
.karte .pfeil{margin-top:13px;color:var(--akz-text);font-weight:600;font-size:.84rem;}
.keine{margin-top:26px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--soft);}
.lv{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:.72rem;border-radius:999px;padding:2px 9px;white-space:nowrap;}
.lv-ab{background:#E1F2F7;color:#0F5C6B;}.lv-bb{background:#FBF1C4;color:#6B4E00;}.lv-bc{background:#FBE3E1;color:#9A1C16;}
.zurueck{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--akz-text);font-family:'Space Grotesk';font-weight:600;font-size:.9rem;cursor:pointer;padding:4px 0;margin-bottom:10px;}
.d-kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.d-breadcrumb{font-size:.82rem;color:var(--soft);font-weight:600;}
.d-titel{font-family:'Space Grotesk';font-weight:700;font-size:2rem;line-height:1.1;margin:4px 0 0;letter-spacing:-.01em;}
.d-tools{display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-family:'Space Grotesk';font-weight:600;font-size:.84rem;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:.12s;}
.btn:hover{border-color:var(--akz);}.btn-prim{background:var(--akz);color:#fff;border-color:transparent;}
.sek{margin-top:28px;}
.sek-h{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--akz-text);margin-bottom:14px;}
/* Quiz-spezifisch */
.regel{background:var(--akz-soft);border:1px solid color-mix(in srgb,var(--akz) 35%,transparent);border-radius:var(--radius);padding:15px 20px;font-size:1.02rem;line-height:1.55;}
.qf{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
.qf .qn{display:flex;gap:12px;align-items:flex-start;}
.qf .nr{flex:none;width:28px;height:28px;border-radius:999px;background:var(--akz-soft);color:var(--akz-text);font-family:'Space Grotesk';font-weight:700;font-size:.86rem;display:flex;align-items:center;justify-content:center;}
.qf .qt{font-size:1.04rem;line-height:1.45;padding-top:3px;font-weight:600;}
.qf .opts{list-style:none;margin:10px 0 0;padding:0 0 0 40px;display:grid;gap:7px;}
.qf .opt{border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:.98rem;cursor:pointer;transition:.1s;background:#fff;}
.qf .opt:hover{border-color:var(--akz);}
.qf.show .opt{cursor:default;}
.qf.show .opt.richtig{background:#E7F7E9;border-color:#4E9E12;color:#2E6B14;font-weight:600;}
.qf.show .opt.richtig::after{content:' ✓';color:#4E9E12;}
.qf .erkl{display:none;margin:10px 0 0 40px;font-size:.92rem;color:var(--soft);line-height:1.45;}
.qf.show .erkl{display:block;}
.qf .loesen{margin:10px 0 0 40px;font-size:.82rem;color:var(--akz-text);font-weight:600;}
.qf.show .loesen{display:none;}
.tabu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.tabu{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);text-align:center;}
.tabu .w{font-family:'Space Grotesk';font-weight:700;font-size:1.35rem;padding:6px 0 10px;border-bottom:2px solid var(--akz-soft);margin-bottom:10px;}
.tabu .vlabel{font-size:.72rem;color:var(--primary);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.tabu ul{list-style:none;margin:0;padding:0;}
.tabu li{font-size:.98rem;color:#B3261E;padding:3px 0;}
.wf{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;}
.wf .s{font-size:1.04rem;line-height:1.45;}
.wf .a{display:none;margin-top:9px;font-weight:700;}
.wf.show .a{display:block;}
.wf .a.wahr{color:#2E6B14;}.wf .a.falsch{color:#B3261E;}
.wf .e{font-weight:400;color:var(--soft);font-size:.92rem;margin-top:3px;}
.wf .loesen{font-size:.82rem;color:var(--akz-text);font-weight:600;margin-top:8px;}
.wf.show .loesen{display:none;}
body.praesi .top .suche,body.praesi .liste,body.praesi .reihe{display:none;}
body.praesi .wrap{grid-template-columns:1fr;}body.praesi .auf{display:none;}body.praesi .detail{padding:30px max(40px,6vw) 80px;}body.praesi .d-titel{font-size:2.5rem;}body.praesi .qf .qt{font-size:1.2rem;}
@media(max-width:860px){.wrap{grid-template-columns:1fr;}.liste{border-right:none;border-bottom:1px solid var(--line);max-height:40vh;}body.zu .liste{display:none;}.detail{padding:20px 18px 60px;}.zieher{display:none;}.reihe{margin-left:0;}.qf .opts,.qf .erkl,.qf .loesen{padding-left:0;margin-left:0;}}
</style>
</head>
<body data-niveau="all">
<div class="band"></div>
<div class="top"><div class="top-row">
  <div class="marke"><span class="wm">deutschoderwas</span><span class="club">club</span><span class="nivbadge" id="nivbadge">alle Niveaus</span></div>
  <div class="suche"><span class="lupe">🔍</span><input id="suche" type="text" placeholder="Spiel oder Quiz suchen …" autocomplete="off"></div>
  <div class="niv" id="niv"></div>
  <div class="reihe">🏆 Wortschatzspiele & Quiz</div>
</div></div>
<div class="wrap"><aside class="liste"><button class="zieher" id="zieher" onclick="toggleListe()">‹</button><div id="bereiche"></div></aside><main class="detail" id="detail"></main></div>
<button class="auf" onclick="toggleListe()">☰ Spiele</button>
<script>
const BAENDER={ab:{label:'A2·B1',wort:'Grundstufe',cls:'lv-ab',farbe:'#1B9BC0'},bb:{label:'B1·B2',wort:'Mittelstufe',cls:'lv-bb',farbe:'#C9A200'},bc:{label:'B2·C1',wort:'Oberstufe',cls:'lv-bc',farbe:'#D42A21'}};
const BEREICHE=[
  {gruppe:'Quiz', farbe:'#E4F3F8', items:[
    {n:'Großer Quiz-Mix',em:'🏆'},{n:'Wahr oder Falsch',em:'✅'},{n:'Schätzfragen',em:'📏'},{n:'Wer wird Millionär',em:'💰'},
  ]},
  {gruppe:'Wortspiele', farbe:'#FBF1C4', items:[
    {n:'Tabu',em:'🙊'},{n:'Montagsmaler',em:'🎨'},{n:'Stadt-Land-Fluss',em:'🗺️'},{n:'Wortkette',em:'🔗'},{n:'Pantomime',em:'🤸'},
  ]},
];
const EMOJI={};BEREICHE.forEach(g=>g.items.forEach(b=>EMOJI[b.n]=b.em));
const THEMEN=[
  { id:'quizmix', titel:'Großer Quiz-Mix', bereich:'Großer Quiz-Mix', niveau:'bb', typ:'quiz',
    regel:'Immer eine Frage vorlesen, die Gruppe rät gemeinsam. Tippt auf die Frage, um die Lösung aufzudecken. Pro richtige Antwort ein Punkt.',
    fragen:[
      {f:'Was bedeutet die Redewendung „die Daumen drücken"?',o:['jemandem Glück wünschen','wütend sein','müde sein'],r:0,e:'„Ich drücke dir die Daumen" = ich wünsche dir Glück.'},
      {f:'Welches Wort passt NICHT: Herd, Topf, Pfanne, Rechnung?',o:['Herd','Rechnung','Pfanne'],r:1,e:'Rechnung gehört nicht in die Küche.'},
      {f:'Wie heißt das Gegenteil von „pünktlich"?',o:['verspätet','freundlich','teuer'],r:0,e:'pünktlich ↔ verspätet / unpünktlich.'},
      {f:'Was macht man auf einem Amt?',o:['einen Antrag stellen','ein Tor schießen','Brot backen'],r:0,e:'Auf dem Amt stellt man Anträge.'},
      {f:'„Ich verstehe nur Bahnhof" bedeutet …',o:['Ich verstehe gar nichts.','Ich fahre Zug.','Ich bin am Bahnhof.'],r:0,e:'Redewendung für „Ich verstehe überhaupt nichts".'},
    ] },
  { id:'wahrfalsch', titel:'Wahr oder Falsch', bereich:'Wahr oder Falsch', niveau:'bb', typ:'wahrfalsch',
    regel:'Lest eine Aussage vor. Jede/r sagt „wahr" oder „falsch" und begründet. Dann auftippen und auflösen.',
    wf:[
      {s:'„der, die, das" nennt man den bestimmten Artikel.',wahr:true,e:'Richtig – „ein/eine" ist der unbestimmte Artikel.'},
      {s:'Nach „weil" steht das Verb am Satzanfang.',wahr:false,e:'Falsch – nach „weil" steht das Verb am Satzende.'},
      {s:'„nett" und „freundlich" haben eine ähnliche Bedeutung.',wahr:true,e:'Richtig – beides beschreibt einen angenehmen Charakter.'},
      {s:'Das Perfekt bildet man immer mit „haben".',wahr:false,e:'Falsch – Bewegungsverben nehmen oft „sein" (ich bin gegangen).'},
    ] },
  { id:'tabu', titel:'Tabu', bereich:'Tabu', niveau:'ab', typ:'tabu',
    regel:'Eine Person erklärt den fett gedruckten Begriff – aber OHNE die verbotenen Wörter zu benutzen. Die Gruppe rät.',
    tabu:[
      {w:'der Bahnhof',verboten:['Zug','Gleis','fahren','Reise']},
      {w:'der Kühlschrank',verboten:['kalt','Küche','Essen','Milch']},
      {w:'der Regenschirm',verboten:['Regen','nass','Wetter','aufspannen']},
      {w:'der Lehrer',verboten:['Schule','Klasse','unterrichten','lernen']},
      {w:'das Handy',verboten:['telefonieren','Smartphone','App','anrufen']},
      {w:'der Arzt',verboten:['krank','Praxis','Medizin','untersuchen']},
    ] },
];
const S={niveau:'all',bereich:null,sel:null};
function themenVon(b){return THEMEN.filter(t=>t.bereich===b&&(S.niveau==='all'||t.niveau===S.niveau));}
function anzahl(b){return themenVon(b).length;}
function renderNiv(){document.getElementById('niv').innerHTML=`<span class="cap">Niveau:</span>`+[['all','Alle'],['ab','A2·B1'],['bb','B1·B2'],['bc','B2·C1']].map(([k,l])=>`<button data-n="${k}" class="${S.niveau===k?'on':''}" onclick="setNiv('${k}')"><span class="dot"></span>${l}</button>`).join('');document.getElementById('nivbadge').textContent=S.niveau==='all'?'alle Niveaus':BAENDER[S.niveau].label;}
function nivRibbon(){if(S.niveau==='all')return`<div class="niv-ribbon"><span class="pt" style="background:var(--soft)"></span>Alle Niveaus</div>`;const b=BAENDER[S.niveau];return`<div class="niv-ribbon"><span class="pt" style="background:${b.farbe}"></span>Niveau ${b.label} · ${b.wort}</div>`;}
function renderBereiche(){const q=document.getElementById('suche').value.trim().toLowerCase();let html=nivRibbon();BEREICHE.forEach(g=>{const items=g.items.filter(b=>!q||b.n.toLowerCase().includes(q));if(!items.length)return;html+=`<div class="gruppe-h">${g.gruppe}</div>`;html+=items.map(b=>{const c=anzahl(b.n);return`<button class="b-item ${S.bereich===b.n?'on':''} ${c?'':'leer'}" onclick="selBereich('${b.n.replace(/'/g,"\\'")}')"><span class="em" style="background:${g.farbe}">${b.em}</span><span class="bn">${b.n}</span><span class="ct">${c}</span></button>`;}).join('');});document.getElementById('bereiche').innerHTML=html;}
function renderDetail(){const d=document.getElementById('detail');if(S.sel)return renderThema(d,THEMEN.find(x=>x.id===S.sel));if(S.bereich)return renderBereichView(d,S.bereich);
  d.innerHTML=`<div class="welc"><div class="em">🏆</div><h1>Welches Spiel oder Quiz?</h1><p>Wählt oben euer <b>Niveau</b> und links ein <b>Spiel</b>. Quizfragen deckt ihr per Tippen auf – ideal für den Abschluss der Woche.</p><div class="hint">👈 Spiel links wählen</div></div>`;}
function renderBereichView(d,b){const ts=themenVon(b);const karten=ts.length?`<div class="karten">${ts.map(t=>{const anz=t.fragen?t.fragen.length+' Fragen':t.wf?t.wf.length+' Aussagen':t.tabu?t.tabu.length+' Karten':'';return`<button class="karte" onclick="selThema('${t.id}')"><div class="kem">${EMOJI[t.bereich]||'🏆'}</div><div class="kt">${t.titel}</div><div class="kmeta"><span class="lv ${BAENDER[t.niveau].cls}">${BAENDER[t.niveau].label}</span> · ${anz}</div><div class="pfeil">Öffnen →</div></button>`;}).join('')}</div>`:`<div class="keine">📝 Zu diesem Spiel ist noch nichts hinterlegt${S.niveau!=='all'?' für dieses Niveau':''} – folgt Schritt für Schritt.</div>`;d.innerHTML=`<div class="b-kopf"><div class="em">${EMOJI[b]||'🏆'}</div><div><h1>${b}</h1><div class="sub">Wortschatzspiele & Quiz</div></div></div>${karten}`;}
function renderThema(d,t){
  let body='';
  if(t.typ==='quiz'){ body=`<div class="sek"><div class="sek-h">❓ Fragen · tippen zum Aufdecken</div>${t.fragen.map((q,i)=>`<div class="qf" onclick="this.classList.add('show')"><div class="qn"><div class="nr">${i+1}</div><div class="qt">${q.f}</div></div><ul class="opts">${q.o.map((o,oi)=>`<li class="opt ${oi===q.r?'richtig':''}">${o}</li>`).join('')}</ul><div class="loesen">▸ Tippen zum Aufdecken</div><div class="erkl">💡 ${q.e}</div></div>`).join('')}</div>`; }
  else if(t.typ==='wahrfalsch'){ body=`<div class="sek"><div class="sek-h">✅ Wahr oder Falsch · tippen zum Aufdecken</div>${t.wf.map(w=>`<div class="wf" onclick="this.classList.add('show')"><div class="s">${w.s}</div><div class="loesen">▸ Tippen zum Aufdecken</div><div class="a ${w.wahr?'wahr':'falsch'}">${w.wahr?'✓ Wahr':'✗ Falsch'}<div class="e">${w.e}</div></div></div>`).join('')}</div>`; }
  else if(t.typ==='tabu'){ body=`<div class="sek"><div class="sek-h">🙊 Tabu-Karten · erklären ohne die roten Wörter</div><div class="tabu-grid">${t.tabu.map(c=>`<div class="tabu"><div class="w">${c.w}</div><div class="vlabel">Verboten</div><ul>${c.verboten.map(v=>`<li>${v}</li>`).join('')}</ul></div>`).join('')}</div></div>`; }
  d.innerHTML=`<button class="zurueck" onclick="zurueckZumBereich()">‹ ${t.bereich}</button>
    <div class="d-kopf"><div><div class="d-breadcrumb">Wortschatzspiele & Quiz</div><h1 class="d-titel">${t.titel}</h1></div><div class="d-tools"><span class="lv ${BAENDER[t.niveau].cls}" style="font-size:.84rem;padding:4px 12px">${BAENDER[t.niveau].label}</span><button class="btn" id="btn-praesi" onclick="togglePraesi()">🖥️ Präsentieren</button></div></div>
    <div class="sek"><div class="sek-h">🎯 So geht's</div><div class="regel">${t.regel}</div></div>
    ${body}`;
}
function setNiv(k){S.niveau=k;document.body.dataset.niveau=k;if(S.sel){const t=THEMEN.find(x=>x.id===S.sel);if(t&&k!=='all'&&t.niveau!==k)S.sel=null;}renderNiv();renderBereiche();renderDetail();}
function selBereich(b){S.bereich=b;S.sel=null;renderBereiche();renderDetail();document.getElementById('detail').scrollTop=0;}
function selThema(id){S.sel=id;renderDetail();document.getElementById('detail').scrollTop=0;}
function zurueckZumBereich(){S.sel=null;renderDetail();}
function toggleListe(){document.body.classList.toggle('zu');const z=document.getElementById('zieher');if(z)z.textContent=document.body.classList.contains('zu')?'›':'‹';}
function togglePraesi(){document.body.classList.toggle('praesi');const on=document.body.classList.contains('praesi');const b=document.getElementById('btn-praesi');if(b){b.textContent=on?'✕ Normal':'🖥️ Präsentieren';b.classList.toggle('btn-prim',on);}}
document.getElementById('suche').addEventListener('input',renderBereiche);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('praesi'))togglePraesi();});
renderNiv();renderBereiche();renderDetail();
</script>
</body>
</html>
