<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lehrer-Bereich · deutschoderwas club</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FDF6EC;--paper:#fff;--ink:#262019;--ink-soft:#5C4E3E;--ink-mute:#A8957D;--teal:#35AFD0;--red:#E8302A;--yellow:#FFD24A;--sand:#F0E2C8;--radius:16px;--shadow:0 10px 30px rgba(38,32,25,.08);--fh:'Space Grotesk',Georgia,serif;--fb:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(180deg,#E9F7F4,var(--cream) 16%,var(--cream));color:var(--ink);font-family:var(--fb);min-height:100vh;line-height:1.5;}
.top{background:var(--paper);border-bottom:1px solid var(--sand);padding:.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.brand{font-family:var(--fh);font-weight:700;font-size:1.1rem;}.brand .t{color:var(--teal);}
.top .out{font-size:.9rem;color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:inherit;}
.wrap{max-width:780px;margin:0 auto;padding:1.6rem 1.2rem 4rem;}
h1{font-family:var(--fh);font-weight:600;font-size:clamp(1.6rem,4vw,2.3rem);margin-bottom:.3rem;}
.sub{color:var(--ink-soft);margin-bottom:1.4rem;}
.daygroup{margin-bottom:1.2rem;}
.dayhead{font-family:var(--fh);font-weight:600;font-size:1.05rem;color:var(--ink-soft);margin:0 0 .5rem .2rem;}
.cls{background:var(--paper);border:1px solid var(--sand);border-left:5px solid var(--c,#35AFD0);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;box-shadow:var(--shadow);}
.cls .row1{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
.time{font-weight:700;font-size:1.05rem;}
.pill{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--c,#35AFD0);}
.lvl{font-size:.72rem;font-weight:700;color:var(--ink-soft);background:#f3ece0;padding:2px 9px;border-radius:999px;}
.topic{font-family:var(--fh);font-weight:600;font-size:1.08rem;margin:.4rem 0 .2rem;}
.kat{color:var(--ink-mute);font-size:.9rem;}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;}
.btn{border:none;border-radius:999px;padding:.5rem 1rem;cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:700;text-decoration:none;display:inline-block;}
.btn.tafel{background:var(--ink);color:var(--cream);}
.btn.meet{background:var(--teal);color:#063b35;}
.btn.stunde{background:var(--red,#E8302A);color:#fff;}
.btn.vorb{background:var(--yellow,#FFD24A);color:var(--ink,#262019);}
.btn.raum{background:#fff;color:var(--ink,#262019);border:2px solid var(--ink,#262019);}
.center{text-align:center;padding:3rem 1rem;color:var(--ink-soft);}
.center a{color:var(--teal);font-weight:700;}
.empty{background:var(--paper);border:1px dashed var(--sand);border-radius:14px;padding:1.4rem;text-align:center;color:var(--ink-soft);}

/* ===== 20.11.2026: Stil wie „Meine Stunden“ im Schülerbereich =====
   Petrol-Bühne oben, weiße Karten, ein Hauptknopf (Klassenraum) in Petrol,
   die übrigen ruhig umrandet. Die Club-Farbe bleibt als schmaler Rand links
   und als kleines Etikett. */
body{background:#F6F8FA;color:#14181B;font-family:'Inter',system-ui,sans-serif}
.top{border-bottom:1px solid #E7EBF0}
.brand{font-family:'Inter',system-ui,sans-serif;font-weight:800}.brand .t{color:#0E6D85}
.wrap{max-width:860px}
.lh-held{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:center;background:linear-gradient(135deg,#0E6D85,#0A4E62);
  color:#fff;border-radius:22px;padding:24px 26px;margin-bottom:22px;overflow:hidden}
.lh-held .kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A9DEEE;margin-bottom:6px}
.lh-held h1{font-family:'Inter',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;color:#fff;margin:0 0 6px;font-size:clamp(1.5rem,4vw,2rem)}
.lh-held .sub{color:rgba(255,255,255,.86);margin:0}
.lh-held img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media(max-width:640px){.lh-held{grid-template-columns:1fr;padding:0 0 20px}.lh-held img{order:-1;border-radius:22px 22px 0 0;aspect-ratio:16/9;box-shadow:none}.lh-held>div{padding:0 20px}}
.dayhead{font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:.95rem;color:#14181B;text-transform:none}
.cls{border:1px solid #E7EBF0;border-left:4px solid var(--c,#0E6D85);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.topic{font-family:'Inter',system-ui,sans-serif;font-weight:700}
.kat{color:#5F6B76}
.lvl{background:#EEF3F6;color:#334155}
.btn{border-radius:12px;font-size:.88rem;padding:.55rem .95rem;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn.tafel,.btn.meet,.btn.stunde,.btn.vorb{background:#fff;color:#14181B;border:1px solid #DCE2E8}
.btn.tafel:hover,.btn.meet:hover,.btn.stunde:hover,.btn.vorb:hover{border-color:#0E6D85;color:#0E6D85}
.btn.raum{background:#0E6D85;color:#fff;border:1px solid #0E6D85}
.btn.raum:hover{background:#0A4E62}
.center a{color:#0E6D85}
.empty{border:1px dashed #DCE2E8;color:#5F6B76}
</style>
</head>
<body>
<div class="top"><div class="brand">deutsch<span class="t">oderwas</span> · Lehrer-Bereich</div><button class="out" id="outBtn" style="display:none">Abmelden</button></div>
<div class="wrap" id="app"><div class="center">Lädt …</div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG=window.SPRECHCLUB_CONFIG;
const CLUB={sprechclub:{c:'#35AFD0',n:'Sprechclub'},grammatikclub:{c:'#E8302A',n:'Grammatikclub'},wortschatzclub:{c:'#F5B301',n:'Wortschatzclub'},ausspracheclub:{c:'#2F6BFF',n:'Ausspracheclub'}};
let sb;
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const fDay=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'});
const fTime=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'});

async function init(){
  const app=document.getElementById('app');
  sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ app.innerHTML='<div class="center">Bitte zuerst einloggen.<br><a href="index.html?login=1">Zum Login →</a></div>'; return; }
  document.getElementById('outBtn').style.display='inline-block';
  document.getElementById('outBtn').onclick=async()=>{ await sb.auth.signOut(); location.href='index.html'; };
  const email=(session.user.email||'').toLowerCase();
  const { data:prof }=await sb.from('profiles').select('is_admin,is_teacher,name').eq('id',session.user.id).single();
  const { data:teachers }=await sb.from('teachers').select('id,name,email').not('email','is',null);
  const me=(teachers||[]).find(t=>(t.email||'').toLowerCase()===email);
  if(!me && !(prof&&prof.is_admin)){
    app.innerHTML=`<div class="center">Hallo! Diese E-Mail ist noch nicht als Lehrkraft hinterlegt.<br>Bitte melde dich bei Julia, dann wird dein Konto freigeschaltet.</div>`; return;
  }
  // Admin ohne eigene Lehrer-Zeile: erste Lehrkraft als Ansicht (Fallback)
  const teacher = me || (teachers&&teachers[0]) || null;
  const vorname=(prof&&prof.name? prof.name.split(' ')[0] : (teacher&&teacher.name? teacher.name.split(' ')[0]:'')) || 'Hallo';

  const from=new Date(Date.now()-2*3600*1000).toISOString();
  const to=new Date(Date.now()+21*24*3600*1000).toISOString();
  let cls=[];
  if(teacher){
    const { data }=await sb.from('classes').select('id,title,level,topic,club,starts_at,zoom_link,material_live,material_pre,teacher_id')
      /* Julia, 01.11.2026: Assistenzlehrer haben die gleichen Rechte wie der Hauptlehrer –
         also sehen sie hier auch die Stunden, in denen sie als (2.) Assistenz eingeteilt sind. */
      .or(`teacher_id.eq.${teacher.id},assist_teacher_id.eq.${teacher.id},assist_teacher2_id.eq.${teacher.id}`).gte('starts_at',from).lt('starts_at',to).eq('is_cancelled',false).order('starts_at');
    cls=data||[];
  }
  render(vorname, teacher, cls, prof);
}

const LH_IC={
  stift:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  video:'<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  folien:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>',
  liste:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  tuer:'<path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/>'
};
function lhIc(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(LH_IC[n]||'')+'</svg>'; }
function render(vorname, teacher, cls, prof){
  const app=document.getElementById('app');
  const _n=cls.length;
  let html=`<div class="lh-held"><div><div class="kick">Lehrer-Bereich</div><h1>Hallo ${esc(vorname)}!</h1>
    <p class="sub">${teacher?(_n?(_n===1?'Eine Stunde':_n+' Stunden')+' in den nächsten 2 Wochen. Mit einem Klick in den Klassenraum oder zur Live-Tafel.':'In den nächsten 2 Wochen ist dir keine Stunde zugewiesen.'):'Wähle deine Stunden.'}</p></div>
    <img src="bilder/bereich/adm-hero.webp" alt="" onerror="this.remove()"></div>`;
  if(!cls.length){
    html+=`<div class="empty">Aktuell sind dir keine Stunden in den nächsten 2 Wochen zugewiesen.<br><span style="font-size:.9rem">Sobald Julia dich einer Stunde zuweist, erscheinen sie hier.</span></div>`;
    app.innerHTML=html; return;
  }
  const byDay={};
  cls.forEach(c=>{ const k=new Date(c.starts_at).toDateString(); (byDay[k]=byDay[k]||[]).push(c); });
  Object.keys(byDay).forEach(k=>{
    html+=`<div class="daygroup"><div class="dayhead">${fDay.format(new Date(k))}</div>`;
    byDay[k].forEach(c=>{
      const club=CLUB[c.club]||{c:'#35AFD0',n:c.club||''};
      const kat=(c.club==='sprechclub'&&c.title&&c.title!==c.topic)?c.title:club.n;
      html+=`<div class="cls" style="--c:${club.c}">
        <div class="row1"><span class="time">${fTime.format(new Date(c.starts_at))}</span>
          <span class="pill" style="--c:${club.c}">${esc(club.n)}</span><span class="lvl">${esc(c.level)}</span>${teacher&&c.teacher_id!==teacher.id?'<span class="lvl">Assistenz</span>':''}</div>
        <div class="topic">${esc(c.topic||c.title)}</div>
        <div class="kat">${esc(kat)}</div>
        <div class="acts">
          <a class="btn tafel" href="tafel.html?id=${c.id}" target="_blank" rel="noopener">${lhIc('stift')}Live-Tafel</a>
          ${c.zoom_link?`<a class="btn meet" href="${esc(c.zoom_link)}" target="_blank" rel="noopener">${lhIc('video')}Zum Unterricht</a>`:''}
          ${c.material_live?`<a class="btn stunde" href="${esc(c.material_live)}" target="_blank" rel="noopener">${lhIc('folien')}Stunde öffnen</a>`:''}
          ${c.material_pre&&/^https?:/.test(c.material_pre)?`<a class="btn vorb" href="${esc(c.material_pre)}" target="_blank" rel="noopener">${lhIc('liste')}Vorbereitung</a>`:''}
          <a class="btn raum" href="klassenraum.html?stunde=${c.id}" target="_blank" rel="noopener">${lhIc('tuer')}Klassenraum</a>
        </div></div>`;
    });
    html+=`</div>`;
  });
  app.innerHTML=html;
}
init().catch(e=>{ document.getElementById('app').innerHTML='<div class="center">Es ist ein Fehler aufgetreten. Bitte Seite neu laden.</div>'; });
</script>
</body>
</html>
