<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deutschoderwas · Die Berliner Mauer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --tur:#2DD4BF;--tur-d:#14B8A6;--tur-ink:#0A6256;--tur-btn:#06403A;
  --ink:#14181B;--rot:#DD0000;--gold:#FFCE00;--gold-d:#E0B000;--gold-ink:#5A4700;
  --cream:#FBF4DE;--cream2:#FFFDF4;--ff-h:'Poppins',sans-serif;--ff-b:'Nunito',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--ff-b);background:#17110A;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;}
.scene{position:fixed;inset:0;overflow:hidden;background:#17110A;}
.photo{position:absolute;inset:0;background:url('bilder/ui/bg-warm.webp') center/cover no-repeat;opacity:.5;}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 115% at 14% 6%,rgba(28,58,52,.72),rgba(23,17,10,.86) 60%),radial-gradient(100% 100% at 88% 96%,rgba(58,42,14,.6),transparent 62%),linear-gradient(180deg,rgba(23,17,10,.4),rgba(23,17,10,.72));}
.tex{position:fixed;inset:0;pointer-events:none;opacity:.4;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");}
.vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.6);}
.stage{position:relative;height:100%;padding:4.5vh 7vw 11vh;display:flex;flex-direction:column;justify-content:center;overflow:auto;}
.slide{display:none;}.slide.on{display:block;animation:slin .5s ease;}
@keyframes slin{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--ff-h);font-weight:800;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;color:#17110A;background:var(--gold);padding:8px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(224,176,0,.35);}
.s-h{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.8rem,3.6vw,2.8rem);letter-spacing:-.02em;margin:16px 0 4px;text-shadow:0 10px 36px rgba(0,0,0,.4);}
.s-sub{font-size:clamp(1rem,1.6vw,1.28rem);font-weight:700;color:#d7efe9;max-width:720px;margin-top:16px;}
/* Titel */
.big-word{position:relative;display:inline-block;margin:6px 0;}
.big-word h1{font-family:var(--ff-h);font-weight:800;font-size:clamp(2.6rem,6vw,4.8rem);line-height:.98;letter-spacing:-.025em;text-shadow:0 14px 48px rgba(0,0,0,.55);}
.big-word .swoosh{position:absolute;left:-6px;bottom:-16px;width:102%;height:28px;}
.big-word .swoosh path{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;stroke-dasharray:460;stroke-dashoffset:460;animation:draw 1.1s .6s forwards cubic-bezier(.6,0,.2,1);filter:drop-shadow(0 4px 8px rgba(224,176,0,.4));}
.hero-img{margin-top:26px;border-radius:24px;overflow:hidden;max-width:760px;box-shadow:0 30px 60px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);position:relative;}
.hero-img img{width:100%;display:block;}
.hero-img .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 20px 14px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);font-weight:700;font-size:.95rem;}
/* Interaktiver Text */
.read{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:22px;align-items:start;}
.read .txt{background:var(--cream2);color:var(--ink);border-radius:22px;padding:24px 26px;box-shadow:0 26px 50px rgba(0,0,0,.42);}
.read .txt p{font-size:clamp(1rem,1.4vw,1.16rem);line-height:1.7;font-weight:600;margin-bottom:12px;}
.read .txt p:last-child{margin-bottom:0;}
.read .side{position:sticky;top:0;}
.read .side img{width:100%;border-radius:20px;box-shadow:0 24px 48px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);}
.read .side .hint{margin-top:12px;font-size:.88rem;color:#cdbfa0;font-weight:700;display:flex;gap:8px;align-items:center;}
/* anklickbare Ereignisse im Text */
.ev{background:linear-gradient(transparent 62%,rgba(255,206,0,.5) 62%);cursor:pointer;font-weight:800;padding:0 2px;border-radius:3px;transition:.12s;}
.ev:hover{background:var(--gold);}
.ev::after{content:"🔎";font-size:.62em;vertical-align:super;margin-left:2px;}
.gloss{border-bottom:2px dotted var(--tur-d);cursor:pointer;font-weight:800;}
.gloss::after{content:"\24D8";font-size:.62em;vertical-align:super;color:var(--tur-ink);margin-left:1px;}
/* Zeitstrahl */
.zeit{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;}
.z-card{position:relative;background:var(--cream2);color:var(--ink);border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 18px 38px rgba(0,0,0,.36);border-top:5px solid var(--tur);transition:transform .15s;}
.z-card:hover{transform:translateY(-5px);}
.z-card .dat{font-family:var(--ff-h);font-weight:800;font-size:1.25rem;color:var(--rot);}
.z-card .tt{font-family:var(--ff-h);font-weight:800;font-size:1rem;margin-top:4px;}
.z-card .de{font-size:.92rem;color:#55606a;font-weight:600;margin-top:8px;max-height:0;overflow:hidden;opacity:0;transition:.3s;}
.z-card.open .de{max-height:160px;opacity:1;margin-top:10px;}
.z-card .tap{font-size:.74rem;font-weight:800;color:var(--tur-ink);margin-top:9px;}
.z-card.open .tap{display:none;}
/* Fragen zum Text (aufklappen) */
.fq-card{background:var(--cream2);color:var(--ink);border-radius:18px;padding:17px 20px;box-shadow:0 16px 34px rgba(0,0,0,.34);margin-bottom:13px;cursor:pointer;}
.fq-card .q{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.05rem,1.6vw,1.3rem);display:flex;gap:12px;align-items:flex-start;}
.fq-card .q .n{flex:none;width:30px;height:30px;border-radius:999px;background:var(--tur);color:var(--tur-btn);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;}
.fq-card .a{max-height:0;overflow:hidden;opacity:0;transition:.3s;font-size:1rem;font-weight:700;color:#2e7d43;padding-left:42px;}
.fq-card.open .a{max-height:120px;opacity:1;margin-top:10px;}
.fq-card .peek{font-size:.76rem;font-weight:800;color:#9a8c5f;padding-left:42px;margin-top:8px;}
.fq-card.open .peek{display:none;}
/* Diskussion */
.frage-q{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.15;max-width:900px;text-shadow:0 10px 30px rgba(0,0,0,.4);}
.fcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;max-width:960px;}
.fbox{border-radius:20px;padding:18px 20px;box-shadow:0 20px 40px rgba(0,0,0,.35);}
.fbox .lbl{font-family:var(--ff-h);font-weight:800;font-size:.8rem;text-transform:uppercase;margin-bottom:10px;}
.fbox ul{list-style:none;}.fbox li{font-size:clamp(.98rem,1.4vw,1.14rem);font-weight:700;line-height:1.45;padding:5px 0 5px 24px;position:relative;}
.fbox li::before{position:absolute;left:0;top:5px;font-weight:900;}
.folge{background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.35);}.folge .lbl{color:var(--tur);}.folge li{color:#d7efe9;}.folge li::before{content:"↳";color:var(--tur);}
.antw{background:var(--cream2);color:var(--ink);}.antw .lbl{color:var(--tur-ink);}.antw li{color:#2e3b43;}.antw li::before{content:"💬";font-size:.8em;top:7px;}
/* Quiz */
.quiz{max-width:820px;}
.q-prog{font-family:var(--ff-h);font-weight:800;color:var(--gold);font-size:.9rem;margin-bottom:10px;}
.q-text{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.25;}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
.opt{background:var(--cream2);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:15px 18px;font-size:clamp(1rem,1.5vw,1.22rem);font-weight:800;font-family:var(--ff-h);cursor:pointer;text-align:left;box-shadow:0 14px 30px rgba(0,0,0,.3);transition:.15s;display:flex;align-items:center;gap:12px;}
.opt:hover{transform:translateY(-2px);}
.opt .mk{flex:none;width:30px;height:30px;border-radius:999px;background:#eadfc2;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.opt.right{border-color:#2e7d43;background:#eafaef;}.opt.right .mk{background:#2e7d43;color:#fff;}
.opt.wrong{border-color:var(--rot);background:#fdeeec;}.opt.wrong .mk{background:var(--rot);color:#fff;}
.opt.dim{opacity:.5;}
.q-next{margin-top:22px;display:none;}
.q-next.on{display:inline-flex;}
.btnp{background:var(--tur);color:var(--tur-btn);border:none;font-family:var(--ff-h);font-weight:800;font-size:1rem;border-radius:14px;padding:13px 24px;cursor:pointer;box-shadow:0 12px 26px rgba(20,184,166,.3);}
.q-done{text-align:center;max-width:620px;margin:0 auto;}
.q-done .em{font-size:4rem;}
.q-score{font-family:var(--ff-h);font-weight:800;font-size:2.4rem;color:var(--gold);margin:8px 0;}
/* Gloss / Ereignis-Popup */
.pop{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.72);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.pop.on{display:flex;}
.pop-card{position:relative;background:var(--cream2);color:var(--ink);border-radius:28px;max-width:500px;width:100%;padding:34px 30px 28px;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:pp .2s ease;text-align:center;}
@keyframes pp{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:none;}}
.pop-x{position:absolute;top:14px;right:16px;border:none;background:#efe6cd;width:36px;height:36px;border-radius:999px;cursor:pointer;font-weight:800;color:#7a6f52;}
.pop-em{font-size:3rem;width:94px;height:94px;border-radius:999px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.pop-dat{font-family:var(--ff-h);font-weight:800;color:var(--rot);font-size:1.1rem;}
.pop-w{font-family:var(--ff-h);font-weight:800;font-size:1.6rem;margin-top:2px;}
.pop-t{font-size:1.12rem;line-height:1.55;color:#3a454d;margin-top:10px;font-weight:600;}
/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:9vh;min-height:62px;display:flex;align-items:center;justify-content:center;gap:18px;background:linear-gradient(0deg,rgba(10,12,14,.85),transparent);z-index:30;}
.nav button{border:none;cursor:pointer;background:var(--cream2);color:var(--ink);width:46px;height:46px;border-radius:999px;font-size:1.2rem;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.4);transition:.14s;}
.nav button:hover{background:var(--gold);}.nav button:disabled{opacity:.3;cursor:default;}
.dots{display:flex;gap:8px;}.dot{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);cursor:pointer;transition:.15s;}.dot.on{background:var(--gold);width:26px;}
.to-themen{position:fixed;top:4.5vh;left:7vw;z-index:25;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:var(--ff-h);font-weight:700;font-size:.82rem;border-radius:999px;padding:7px 14px;cursor:pointer;}
.to-themen:hover{background:rgba(255,255,255,.18);}
.badge-niv{position:fixed;top:4.5vh;right:7vw;z-index:20;}
.lv{font-family:var(--ff-h);font-weight:800;font-size:.78rem;border-radius:999px;padding:5px 14px;background:rgba(221,0,0,.16);color:#ff8a7e;border:1px solid rgba(221,0,0,.4);}
@keyframes draw{to{stroke-dashoffset:0;}}
@media(max-width:900px){.read,.fcols{grid-template-columns:1fr;}.zeit{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="scene"><div class="photo"></div></div>
<div class="tex"></div><div class="vig"></div>
<button class="to-themen" onclick="alert('Zurück zur Themenauswahl (in der echten App).')">‹ Themen</button>
<div class="badge-niv"><span class="lv">B2 · C1</span></div>
<div class="stage" id="stage"></div>
<div class="nav"><button id="prev" onclick="go(-1)">‹</button><div class="dots" id="dots"></div><button id="next" onclick="go(1)">›</button></div>
<div class="pop" id="pop" onclick="if(event.target===this)closePop()">
  <div class="pop-card"><button class="pop-x" onclick="closePop()">✕</button>
    <div class="pop-em" id="pEm">💡</div><div class="pop-dat" id="pDat"></div><div class="pop-w" id="pW"></div><div class="pop-t" id="pT"></div></div>
</div>
<script>
const GLOSSAR={
  'Stacheldraht':{e:'🪤',t:'Draht mit vielen scharfen Spitzen, der Menschen aufhalten soll.'},
  'Grenze':{e:'🚧',t:'Die Linie zwischen zwei Ländern oder Gebieten.'},
  'fliehen':{e:'🏃',t:'schnell weglaufen, um sich vor Gefahr oder Zwang zu retten.'},
  'Wiedervereinigung':{e:'🤝',t:'Zwei getrennte Teile werden wieder ein Land.'},
  'friedlich':{e:'🕊️',t:'ohne Gewalt, ganz ruhig.'}
};
const EREIGNIS={
  'bau':{e:'🧱',dat:'13. August 1961',w:'Der Mauerbau',t:'Über Nacht beginnt die DDR, eine Mauer quer durch Berlin zu bauen. Familien werden getrennt – viele können nicht mehr zu ihrer Arbeit oder nach Hause.'},
  'mauerfall':{e:'🎉',dat:'9. November 1989',w:'Der Mauerfall',t:'Nach großen Protesten öffnet die DDR überraschend die Grenze. Tausende feiern auf der Mauer – ein friedlicher, historischer Moment.'},
  'einheit':{e:'🇩🇪',dat:'3. Oktober 1990',w:'Die Deutsche Einheit',t:'Ost- und Westdeutschland werden wieder ein Land. Seitdem ist der 3. Oktober der Nationalfeiertag.'}
};
function openPop(k,map){const g=map[k];if(!g)return;pEm.textContent=g.e;pDat.textContent=g.dat||'';pW.textContent=g.w||k;pT.textContent=g.t;pop.classList.add('on');}
function closePop(){pop.classList.remove('on');}
function gloss(x){return x.replace(/<g>(.*?)<\/g>/g,(m,w)=>{const k=Object.keys(GLOSSAR).find(k=>w.includes(k))||w;return `<span class="gloss" onclick="openPop('${k}',GLOSSAR)">${w}</span>`;})
  .replace(/<e id=([a-z]+)>(.*?)<\/e>/g,(m,id,w)=>`<span class="ev" onclick="openPop('${id}',EREIGNIS)">${w}</span>`);}

const SL=[];
SL.push(()=>`<div class="slide">
  <span class="kicker">📖 Landeskunde · Geschichte · B2 · C1</span>
  <div class="big-word"><h1>Die Berliner Mauer</h1><svg class="swoosh" viewBox="0 0 460 28" preserveAspectRatio="none"><path d="M6 18 C130 4, 340 4, 454 12"/></svg></div>
  <p class="s-sub">Eine geteilte Stadt, ein friedlicher Herbst – und wie Deutschland wieder zusammenwuchs.</p>
  <div class="hero-img"><img src="bilder/landeskunde/mauer.webp" alt="Brandenburger Tor"><div class="cap">Berlin heute – das Brandenburger Tor stand einst direkt an der Grenze.</div></div>
</div>`);
SL.push(()=>`<div class="slide">
  <div class="s-h">📖 Lest die Geschichte</div>
  <p class="s-sub">Tippt auf <b style="color:var(--gold)">gelb markierte Ereignisse</b> und auf <b style="color:var(--tur)">schwere Wörter</b>.</p>
  <div class="read">
    <div class="txt">
      <p>${gloss('Am <e id=bau>13. August 1961</e> begann die DDR, eine <g>Grenze</g> mitten durch Berlin zu bauen – erst aus <g>Stacheldraht</g>, dann aus Beton.')}</p>
      <p>${gloss('28 Jahre lang trennte die Mauer die Stadt. Wer in den Westen <g>fliehen</g> wollte, riskierte sein Leben.')}</p>
      <p>${gloss('Doch im Herbst 1989 gingen Hunderttausende <g>friedlich</g> auf die Straße. Am <e id=mauerfall>9. November 1989</e> fiel die Mauer.')}</p>
      <p>${gloss('Weniger als ein Jahr später kam die <g>Wiedervereinigung</g>: Am <e id=einheit>3. Oktober 1990</e> wurde Deutschland wieder ein Land.')}</p>
    </div>
    <div class="side"><img src="bilder/landeskunde/mauer.webp" alt="Mauer"><div class="hint">💡 Jedes Wort erklärt sich beim Antippen – keine Vokabelliste nötig.</div></div>
  </div>
</div>`);
SL.push(()=>`<div class="slide">
  <div class="s-h">🕐 Der Zeitstrahl</div>
  <p class="s-sub">Tippt die Ereignisse an – was ist da passiert?</p>
  <div class="zeit">
    ${[['13.08.1961','Mauerbau','Über Nacht wird Berlin geteilt. Familien werden getrennt.'],
       ['1961–1989','Geteilt','28 Jahre zwei deutsche Staaten: BRD und DDR.'],
       ['09.11.1989','Mauerfall','Die Grenze öffnet – Tausende feiern auf der Mauer.'],
       ['03.10.1990','Einheit','Deutschland wird wieder ein Land. Nationalfeiertag.']].map(z=>`<div class="z-card" onclick="this.classList.toggle('open')"><div class="dat">${z[0]}</div><div class="tt">${z[1]}</div><div class="de">${z[2]}</div><div class="tap">tippen ▾</div></div>`).join('')}
  </div>
</div>`);
SL.push(()=>`<div class="slide">
  <div class="s-h">❓ Fragen zum Text</div>
  <p class="s-sub">Erst gemeinsam überlegen – dann antippen, um die Antwort zu sehen.</p>
  ${[['Wann begann der Bau der Mauer – und woraus war sie zuerst?','Am 13. August 1961, zuerst aus Stacheldraht.'],
     ['Wie lange trennte die Mauer die Stadt?','28 Jahre lang (1961–1989).'],
     ['Was war das Besondere am Herbst 1989?','Die Menschen protestierten friedlich – ohne Gewalt.']].map((f,i)=>`<div class="fq-card" onclick="this.classList.toggle('open')"><div class="q"><span class="n">${i+1}</span><span>${f[0]}</span></div><div class="peek">👆 tippen für die Antwort</div><div class="a">✓ ${f[1]}</div></div>`).join('')}
</div>`);
SL.push(()=>`<div class="slide">
  <span class="kicker">💬 Jetzt redet darüber</span>
  <div class="frage-q" style="margin-top:18px">Gab es in deinem Land auch eine Teilung oder eine große Veränderung?</div>
  <div class="fcols">
    <div class="fbox folge"><div class="lbl">↳ Folgefragen</div><ul><li>Wie haben die Menschen das erlebt?</li><li>Was hat sich danach verändert?</li><li>Wird heute daran erinnert?</li></ul></div>
    <div class="fbox antw"><div class="lbl">💡 So könnt ihr antworten</div><ul><li>Bei uns gab es … / so etwas gab es nicht.</li><li>Meine Familie hat erzählt, dass …</li><li>Ich finde es wichtig, dass …</li></ul></div>
  </div>
</div>`);
SL.push(()=>`<div class="slide"><div class="s-h">🏆 Geschichtsquiz</div><p class="s-sub">Gemeinsam raten – tippt eure Antwort.</p><div class="quiz" id="quiz"></div></div>`);

/* Quiz */
const QUIZ=[
  {q:'Wann fiel die Berliner Mauer?',o:['9. November 1989','3. Oktober 1990','13. August 1961'],r:0},
  {q:'Wie viele Jahre trennte die Mauer die Stadt?',o:['10 Jahre','28 Jahre','50 Jahre'],r:1},
  {q:'Was feiert Deutschland am 3. Oktober?',o:['Den Mauerbau','Den Tag der Deutschen Einheit','Den Mauerfall'],r:1}
];
let qi=0,qs=0;
function renderQuiz(){const q=QUIZ[qi];const el=document.getElementById('quiz');if(!el)return;
  el.innerHTML=`<div class="q-prog">Frage ${qi+1} von ${QUIZ.length} · ${qs} richtig</div>
    <div class="q-text">${q.q}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answer(${i})"><span class="mk">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div>
    <div class="q-next" id="qnext"><button class="btnp" onclick="nextQ()">${qi<QUIZ.length-1?'Nächste Frage ›':'Ergebnis ansehen 🏆'}</button></div>`;
}
function answer(i){const q=QUIZ[qi];const opts=document.querySelectorAll('#quiz .opt');if(opts[0].classList.contains('right')||document.querySelector('#quiz .opt.wrong'))return;
  opts.forEach((o,j)=>{o.onclick=null;if(j===q.r)o.classList.add('right');else if(j===i)o.classList.add('wrong');else o.classList.add('dim');});
  if(i===q.r)qs++;document.getElementById('qnext').classList.add('on');
  document.querySelector('.q-prog').textContent=`Frage ${qi+1} von ${QUIZ.length} · ${qs} richtig`;}
function nextQ(){if(qi<QUIZ.length-1){qi++;renderQuiz();}else{document.getElementById('quiz').innerHTML=`<div class="q-done"><div class="em">${qs===QUIZ.length?'🎉':'👏'}</div><div class="q-score">${qs} / ${QUIZ.length}</div><p class="s-sub" style="margin:0 auto">${qs===QUIZ.length?'Perfekt! Ihr kennt euch aus.':'Stark! Redet über die Fragen, die schwer waren.'}</p><div style="margin-top:20px"><button class="btnp" onclick="qi=0;qs=0;renderQuiz();">Nochmal spielen</button></div></div>`;}}

let cur=0;
const stage=document.getElementById('stage'),dots=document.getElementById('dots');
SL.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d);});
function show(i){cur=Math.max(0,Math.min(SL.length-1,i));stage.innerHTML=SL[cur]();stage.firstElementChild.classList.add('on');
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SL.length-1;
  if(SL[cur].toString().includes('id="quiz"')){qi=0;qs=0;renderQuiz();}stage.scrollTop=0;}
function go(d){show(cur+d);}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')closePop();});
show(0);
</script>
</body>
