<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lektion – deutschoderwas club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF9F5">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --ink:#171717; --ink2:#6E6A63; --ink3:#9A958C;
  --line:#EBE7DF; --line2:#F4F1EA;
  --acc:#1B9BC0; --acc-d:#14708B; --acc-soft:#E6F8FC; --acc-line:#C7E9F3;
  --gold:#E8B923; --err:#C9453D; --err-soft:#FBEFEE;
  --r1:12px; --r2:16px; --r3:22px;
  --sh:0 1px 2px rgba(23,23,23,.04), 0 8px 24px -16px rgba(23,23,23,.18);
  --sh2:0 2px 4px rgba(23,23,23,.05), 0 18px 40px -22px rgba(23,23,23,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.ic{flex:none;vertical-align:-.15em}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(251,249,245,.88);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line2)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.icb{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:color .2s,border-color .2s;flex:none}
.icb:hover{color:var(--ink);border-color:var(--ink3)}
.tmeta{flex:1;min-width:0}
.tmeta .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:1px}
.tmeta .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--acc-d);letter-spacing:-.02em}

/* ---------- Schritt-Leiste ---------- */
.rail{max-width:1240px;margin:0 auto;padding:14px 18px 0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.sd{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink3);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;white-space:nowrap;transition:.22s}
.sd .ic{width:15px;height:15px}
.sd.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sd.ok{color:var(--acc-d);border-color:var(--acc-line);background:var(--acc-soft)}

/* ---------- Rahmen ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:24px 22px;box-shadow:var(--sh);animation:up .45s cubic-bezier(.16,1,.3,1) both;margin-bottom:14px}
.card.flush{padding:0;overflow:hidden}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5.2vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1.12;margin:0 0 10px}
h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;display:flex;align-items:center;gap:9px}
h2 .ic{color:var(--acc-d)}
.sub{color:var(--ink2);font-size:14.5px;line-height:1.62;margin:0 0 18px}
.lead{color:var(--ink2);font-size:15px;line-height:1.68;margin:0}

/* ---------- Titelbild ---------- */
.hero{position:relative;aspect-ratio:16/9;max-height:230px;overflow:hidden;background:#FAF4E6}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.kicker{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--acc-d);margin-bottom:8px}
.facts{display:flex;gap:15px;flex-wrap:wrap;margin:11px 0 0;color:var(--ink2);font-size:13px;font-weight:500}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts .ic{width:14px;height:14px;color:var(--ink3)}
.body{padding:22px}
.body h1{margin:0}

/* ---------- Lernziele ---------- */
.goals{list-style:none;margin:16px 0 0;padding:0;counter-reset:g}
.goals li{counter-increment:g;position:relative;padding:13px 0 13px 40px;font-size:15px;font-weight:500;border-top:1px solid var(--line2)}
.goals li::before{content:counter(g);position:absolute;left:0;top:11px;width:25px;height:25px;border-radius:8px;background:var(--acc-soft);color:var(--acc-d);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---------- Dialog ---------- */
.scene{border-radius:var(--r2);overflow:hidden;margin:0 0 8px;background:#FAF4E6;aspect-ratio:2/1}
.scene img{display:block;width:100%;height:100%;object-fit:cover}
.scap{font-size:13.5px;color:var(--ink2);line-height:1.55;margin:0 0 18px;padding:0 2px}
.playbar{display:flex;align-items:center;gap:12px;background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:var(--r2);padding:11px 14px;margin-bottom:18px}
.playbtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .2s,background .2s}
.playbtn:hover{background:var(--acc-d);transform:scale(1.05)}
.playbtn.on{animation:pulse 1.4s infinite}
.playbar .pl{font-size:13.5px;font-weight:600;color:var(--acc-d)}
.turns{display:flex;flex-direction:column;gap:3px}
.turn{display:flex;gap:13px;padding:11px 4px;border-radius:var(--r1);transition:background .25s;animation:up .4s cubic-bezier(.16,1,.3,1) both}
.turn:hover{background:var(--line2)}
.turn.live{background:var(--acc-soft)}
.turn .who{width:34px;height:34px;border-radius:50%;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:-.02em}
.turn.a .who{background:#DCEFEB;color:var(--acc-d)}
.turn.b .who{background:#F1E7E0;color:#8A6144}
.turn .txt{flex:1;min-width:0}
.turn .nm{font-size:11.5px;font-weight:600;color:var(--ink3);margin-bottom:2px}
.turn .ln{font-size:15.5px;line-height:1.55}
.turn .sp{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;opacity:0;transition:.2s}
.turn:hover .sp,.turn.live .sp{opacity:1}
.turn .sp:hover{color:var(--acc-d);border-color:var(--acc-line)}
.turn .sp.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---------- Wortschatz ---------- */
.words{display:flex;flex-direction:column}

.w{display:flex;align-items:center;gap:14px;padding:13px 4px;border-top:1px solid var(--line2);cursor:pointer;transition:background .2s;animation:up .4s cubic-bezier(.16,1,.3,1) both}
.w:hover{background:var(--line2)}
.w .tile{width:42px;height:42px;border-radius:12px;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;overflow:hidden}
.w .tile img{width:100%;height:100%;object-fit:cover}
.w .wt{flex:1;min-width:0}
.w .de{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.w .ex{font-size:13px;color:var(--ink2);margin-top:1px}
.w .sp{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink3);display:flex;align-items:center;justify-content:center;flex:none;transition:.2s}
.w:hover .sp{color:var(--acc-d);border-color:var(--acc-line)}
.w .sp.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---------- Grammatik ---------- */
.gsec{padding-top:20px;margin-top:20px;border-top:1px solid var(--line2)}
.gsec:first-of-type{padding-top:8px;margin-top:0;border-top:none}
.gsec h3{font-family:'Space Grotesk',sans-serif;font-size:16.5px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.gsec p{color:var(--ink2);font-size:14.5px;line-height:1.6;margin:0 0 12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden}
.tbl th{background:var(--line2);font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--ink2);text-align:left;padding:9px 13px}
.tbl td{padding:10px 13px;border-top:1px solid var(--line2)}
.tbl td:first-child{font-weight:600;color:var(--acc-d)}
.note{display:flex;gap:10px;background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:var(--r1);padding:12px 14px;font-size:13.5px;color:var(--acc-d);line-height:1.58;margin-top:12px}
.note .ic{color:var(--acc);margin-top:1px}

/* ---------- Übungen ---------- */
.exhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.exn{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.exdone{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--acc-d);background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:999px;padding:4px 10px}
.qq{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.42;margin:0 0 16px}
.exim{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r2);margin-bottom:16px;background:#EDE9E1}
.opts{display:flex;flex-direction:column;gap:9px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.o{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:14px 16px;font-size:15px;font-weight:500;font-family:inherit;color:var(--ink);cursor:pointer;transition:border-color .18s,background .18s,transform .12s;display:flex;align-items:center;gap:11px}
.o::before{content:"";width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);flex:none;transition:.18s}
.o:hover{border-color:var(--ink3)}
.o:active{transform:scale(.995)}
.o.ok{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-d);font-weight:600}
.o.ok::before{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3px var(--acc-soft)}
.o.no{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.o.no::before{border-color:var(--err)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.slot{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--line2);border:1.5px dashed var(--line);border-radius:var(--r2);padding:9px;align-items:flex-start}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:9px 14px;font-size:15px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer;transition:.16s;animation:fade .25s both}
.tok:hover{border-color:var(--acc);color:var(--acc-d)}
.tok.used{opacity:.25;pointer-events:none}
.cloze{font-size:17px;line-height:2.15}
.blank{display:inline-block;min-width:92px;border-bottom:2px solid var(--acc);text-align:center;font-weight:600;color:var(--acc-d);cursor:pointer;padding:0 8px}
.blank:empty::after{content:"";display:inline-block;width:70px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pc{display:flex;flex-direction:column;gap:9px}
.p{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:13px 15px;font-size:14.5px;font-weight:500;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;transition:.16s}
.p:hover{border-color:var(--ink3)}
.p.sel{border-color:var(--ink);background:var(--line2)}
.p.ok{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-d);pointer-events:none}
.p.no{border-color:var(--err);background:var(--err-soft)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:var(--r2);padding:15px 16px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .18s}
.inp:focus{border-color:var(--acc)}
.hintline{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.fb{margin-top:16px;border-radius:var(--r2);padding:13px 16px;font-size:14.5px;font-weight:500;display:none;align-items:flex-start;gap:10px;animation:up .3s both}
.fb.y{display:flex;background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc-d)}
.fb.n{display:flex;background:var(--err-soft);border:1px solid #F0D5D3;color:var(--err)}

/* ---------- Merkblatt ---------- */
.rsec{margin-top:22px}
.rsec:first-of-type{margin-top:16px}
.rlabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px}
.rlabel .ic{width:15px;height:15px;color:var(--acc)}
.rlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.rlist li{padding:13px 16px;font-size:15px;line-height:1.55;border-top:1px solid var(--line2)}
.rlist li:first-child{border-top:none}
.quote{background:#FDF8EA;border:1px solid #F0E2BD;border-radius:var(--r2);padding:16px 18px;font-size:14.5px;line-height:1.65;color:#6B5518;margin-top:22px}
.quote b{color:#4E3D0C}

/* ---------- Sprechen / Fertig ---------- */
.task{background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:var(--r2);padding:18px;font-size:16px;line-height:1.6;font-weight:500;margin-bottom:16px}
.phr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.phr li{display:flex;gap:11px;align-items:flex-start;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:11px 14px}
.phr .ic{color:var(--acc);margin-top:2px;width:16px;height:16px}
.fin{text-align:center;padding:40px 24px}
.fin .mark{width:74px;height:74px;border-radius:50%;background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:up .5s both}
.kpis{display:flex;gap:10px;justify-content:center;margin:22px 0 26px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 22px;min-width:118px}
.kpi .v{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;letter-spacing:-.03em;color:var(--acc-d)}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:500;margin-top:2px}

/* ---------- Fußleiste ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,249,245,.92);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.foot-in{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:14px 26px;display:inline-flex;align-items:center;gap:9px;transition:background .2s,transform .15s,opacity .2s;letter-spacing:-.01em}
.btn:active{transform:scale(.985)}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc-d)}
.btn-p:disabled{background:var(--line);color:var(--ink3);cursor:not-allowed}
.btn-s{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn-s:hover{border-color:var(--ink3);color:var(--ink)}
.cnt{font-size:13px;font-weight:600;color:var(--ink3)}
.err{text-align:center;padding:60px 24px}
@media(max-width:560px){
  .card{padding:20px 17px;border-radius:20px}.card.flush{padding:0}.body{padding:19px}
  .pairs{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr}
  .btn{padding:13px 20px;font-size:14.5px}.foot-in{padding:10px 14px;gap:8px}
  .wrap{padding:16px 14px calc(92px + env(safe-area-inset-bottom))}
  .rail{padding:12px 14px 0}.top-in{padding:9px 14px;gap:11px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Breitbild-Layout */
@media(min-width:1000px){
  .card{padding:30px 32px}
  .card.flush{display:grid;grid-template-columns:minmax(300px,40%) 1fr;align-items:stretch;gap:0}
  .card.flush .hero{max-height:none;height:100%;aspect-ratio:auto;min-height:340px}
  .card.flush .body{padding:34px 36px;display:flex;flex-direction:column;justify-content:center}
  .lead,.card>p{max-width:78ch}
  .words{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
  .goals{columns:2;column-gap:34px}
  .goals li{break-inside:avoid}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tbl{font-size:15.5px}
}
@media(min-width:1400px){
  .words{grid-template-columns:1fr 1fr 1fr}
}
/* ---------- Amanda lobt ---------- */
.am-pop{position:fixed;right:18px;bottom:98px;z-index:60;display:flex;align-items:flex-end;gap:10px;pointer-events:none;opacity:0;transform:translateY(16px) scale(.92);transition:opacity .3s,transform .34s cubic-bezier(.16,1,.3,1)}
.am-pop.an{opacity:1;transform:none}
.am-pop img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 12px 28px rgba(23,23,23,.18);background:var(--line2);animation:huepf .9s ease-in-out 2}
.am-pop .bl{background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 14px;border-radius:15px 15px 4px 15px;box-shadow:0 10px 24px rgba(23,23,23,.2);max-width:230px;line-height:1.4}
@keyframes huepf{0%,100%{transform:translateY(0)}45%{transform:translateY(-8px)}}
@media(max-width:560px){.am-pop{right:12px;bottom:90px}.am-pop img{width:54px;height:54px}.am-pop .bl{font-size:13px;max-width:58vw;padding:9px 12px}}

/* ---------- Grosser Jubel ---------- */
.jub{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(251,249,245,.84);backdrop-filter:blur(7px);opacity:0;transition:opacity .32s;padding:20px}
.jub.an{opacity:1}
.jub-k{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 70px rgba(23,23,23,.18);padding:30px 26px 26px;text-align:center;max-width:370px;width:100%;transform:scale(.88);transition:transform .45s cubic-bezier(.16,1,.3,1)}
.jub.an .jub-k{transform:none}
.jub-k img{width:138px;height:138px;border-radius:50%;object-fit:cover;margin-bottom:17px;border:3px solid #fff;box-shadow:0 16px 36px rgba(23,23,23,.16)}
.jub-k h3{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.jub-k p{margin:0 0 21px;color:var(--ink2);font-size:14.5px;line-height:1.6}
.kon{position:fixed;inset:0;z-index:79;pointer-events:none;overflow:hidden}
.kon i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(780deg);opacity:.12}}

/* ---------- Merkblatt ---------- */
.mk-s{margin-top:26px}
.mk-s:first-of-type{margin-top:18px}
.mk-lab{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);margin-bottom:13px}
.mk-lab .ic{width:16px;height:16px;color:var(--acc)}
.mk-satz{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FFFFFF,#FCFAF6);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:15px;padding:13px 15px;margin-bottom:9px;font-size:15.5px;font-weight:500;line-height:1.5;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}

</div>

<script>
(function(){
'use strict';
var I=window.ICON||function(){return'';};
var qs=new URLSearchParams(location.search);
var K=(qs.get('k')||'').replace(/[^a-z0-9_]/g,''), L=(qs.get('l')||'').replace(/[^0-9]/g,'');
var LID=K+'-'+L;
document.getElementById('backBtn').innerHTML=I('arrowL',19);
function fail(m){ document.getElementById('stage').innerHTML='<div class="card err"><div style="color:var(--ink3);margin-bottom:14px">'+I('book',40)+'</div><h1>Nicht gefunden</h1><p class="lead" style="max-width:340px;margin:0 auto 22px">'+m+'</p><a class="btn btn-p" style="text-decoration:none" href="konto.html#kurse">Zur Kursbibliothek</a></div>'; }
if(!K||!L){ fail('Diese Lektion existiert nicht.'); return; }
/* Muttersprache des Mitglieds — dafuer laden wir die Uebersetzungen */
var L1=null;
try{ L1=window.DOW_L1||localStorage.getItem('dow_l1')||null; }catch(e){}
if(L1==='de') L1=null;
function tr(de){
  if(!L1||!window.LEKTION_TR) return '';
  var e=window.LEKTION_TR[String(de)];
  return (e&&e[L1])||'';
}
function trZ(de,cls){
  var t=tr(de);
  if(!t) return '';
  var r=(L1==='fa'||L1==='ar')?' rtl':'';
  return '<div class="tr'+r+(cls?' '+cls:'')+'">'+esc(t)+'</div>';
}

var sc=document.createElement('script');
sc.src='kurse/'+K+'-l'+L+'.js';
sc.onload=function(){
  if(!window.LEKTION){ fail('Diese Lektion ist noch nicht verfügbar.'); return; }
  if(!L1){ boot(window.LEKTION); return; }
  var tc=document.createElement('script');
  tc.src='kurse/tr/'+K+'-l'+L+'.js';
  tc.onload=tc.onerror=function(){ boot(window.LEKTION); };
  document.head.appendChild(tc);
};
sc.onerror=function(){ fail('Diese Lektion wird gerade erstellt — sie kommt bald.'); };
document.head.appendChild(sc);

(function(){
  var st=document.createElement('style'); st.id='tr-style';
  st.textContent=[
   '.tr{font-size:13.5px;line-height:1.5;color:var(--ink3);margin-top:3px}',
   '.tr::before{content:"";display:inline-block;width:12px;height:1.5px;background:var(--line);vertical-align:.35em;margin-right:7px;border-radius:2px}',
   '.w .tr{font-size:12.5px;margin-top:2px}',
   '.goals .tr{margin-top:1px}',
   '.tr.rtl{direction:rtl;text-align:right}',
   '.tr.rtl::before{margin:0 0 0 7px}'
  ].join('\n');
  document.head.appendChild(st);
})();

function bild(id,w){ if(!id) return '';
  if(id.indexOf('photo-')===0) return 'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w='+(w||900)+'&q=62';
  return 'illu/'+id+((w&&w<=400)?'-s':'')+'.jpg'; }

/* ---------- Audio ---------- */
var voice=null, STIMMEN=[], STIMME_VON={};
/* Deutsche Stimmen sammeln und nach Qualität sortieren.
   Systemstimmen (Anna, Petra, Markus, Yannick, Google) klingen deutlich natürlicher
   als die Standard-Roboterstimme, deshalb kommen sie zuerst. */
function pv(){
  try{
    var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf('de')===0;});
    function rang(x){
      var n=(x.name||'').toLowerCase();
      if(/premium|enhanced|natural|neural|siri/.test(n)) return 0;
      if(/google/.test(n)) return 1;
      if(/anna|petra|markus|yannick|helena|viktor|katja|conrad|amala/.test(n)) return 2;
      if(x.localService) return 3;
      return 4;
    }
    v.sort(function(a,b){ return rang(a)-rang(b); });
    STIMMEN=v; voice=v[0]||null; STIMME_VON={};
  }catch(e){}
}
if(window.speechSynthesis){ pv(); speechSynthesis.onvoiceschanged=pv; }
/* Weiblich/männlich grob erkennen, damit zwei Gesprächspartner verschieden klingen */
function weiblich(x){ return /anna|petra|katja|helena|amala|vicki|female|frau|marlene/i.test(x.name||''); }
function maennlich(x){ return /markus|yannick|conrad|viktor|hans|male|mann|stefan|daniel/i.test(x.name||''); }
/* Feste Zuordnung: jeder Sprecher behält seine Stimme für die ganze Lektion */
function stimmeFuer(sprecher){
  if(!sprecher) return {v:voice, pitch:1, rate:.93};
  if(STIMME_VON[sprecher]) return STIMME_VON[sprecher];
  var vergeben=Object.keys(STIMME_VON).map(function(k){return STIMME_VON[k].v;});
  function frei(liste){ return liste.filter(function(x){ return vergeben.indexOf(x)<0; }); }
  var w=frei(STIMMEN.filter(weiblich)), m=frei(STIMMEN.filter(maennlich)), rest=frei(STIMMEN);
  var nr=Object.keys(STIMME_VON).length;
  var gewaehlt = (nr%2===0 ? (w[0]||rest[0]) : (m[0]||rest[0])) || voice;
  /* Wenn nur eine Stimme da ist: über Tonhöhe und Tempo unterscheiden */
  var nurEine = STIMMEN.length<2;
  STIMME_VON[sprecher] = { v:gewaehlt,
    pitch: nurEine ? (nr%2===0 ? 1.14 : 0.86) : (nr%2===0 ? 1.04 : 0.94),
    rate:  nurEine ? (nr%2===0 ? 0.95 : 0.89) : (nr%2===0 ? 0.95 : 0.91) };
  return STIMME_VON[sprecher];
}
var live=null;
function speak(t,el,cb,sprecher){
  /* Wenn stimmen.js geladen ist, sprechen wir darüber — dort ist geregelt,
     dass zwei Gesprächspartner wirklich verschieden klingen. */
  if(window.sagen){
    if(live)live.classList.remove('on');
    if(el){ el.classList.add('on'); live=el; }
    window.sagen(t, { rolle: sprecher || 'julia', fertig: function(){
      if(el)el.classList.remove('on'); if(live===el)live=null; if(cb)cb(); } });
    return;
  }
  if(!window.speechSynthesis){ if(cb)cb(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(live)live.classList.remove('on');
  var st=stimmeFuer(sprecher);
  var u=new SpeechSynthesisUtterance(t); u.lang='de-DE';
  u.rate=st.rate||.93; u.pitch=st.pitch||1; if(st.v)u.voice=st.v; else if(voice)u.voice=voice;
  if(el){ el.classList.add('on'); live=el; }
  u.onend=function(){ if(el)el.classList.remove('on'); if(live===el)live=null; if(cb)cb(); };
  speechSynthesis.speak(u);
}
window.__say=function(el,t,ev,sp){ if(ev)ev.stopPropagation(); speak(t,el,null,sp); };

/* ---------- Amanda freut sich mit ----------
   Jede richtige Antwort bekommt einen Klang und ein kurzes Lob von
   Amanda — sichtbar als Bild, hoerbar als Satz. Am Ende der Lektion
   kommt sie gross heraus und klatscht. Wer den Ton ausschaltet, sieht
   Amanda weiterhin, hoert sie aber nicht. */
var AM = {
  klatschen:'amanda/a-klatschen.webp',
  jubel:'amanda/amanda-jubel.webp',
  super:'amanda/amanda-super.webp',
  hallo:'amanda/amanda-hallo.webp',
  ups:'amanda/amanda-ups.webp'
};
var LOB = ['Sehr gut gemacht!','Super, genau richtig!','Das sitzt!','Perfekt gemacht!','Richtig \u2014 weiter so!','Stark, das war genau richtig!'];
var lobNr = 0, popEl = null, popUhr = null;

function tonAn(){ try{ return !window.klangLaeuft || window.klangLaeuft(); }catch(e){ return true; } }
function klang(a){ try{ if(window.klang) window.klang(a); }catch(e){} }
function amandaSpricht(t){
  if(!tonAn()) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ speak(t); }catch(e){}
}

/* Kleines Lob neben dem Fortschritt */
function lobZeigen(){
  var t = LOB[(lobNr++) % LOB.length];
  if(!popEl){
    popEl = document.createElement('div');
    popEl.className = 'am-pop';
    document.body.appendChild(popEl);
  }
  popEl.innerHTML = '<img src="'+AM.super+'" alt="Amanda"><div class="bl">'+esc(t)+'</div>';
  requestAnimationFrame(function(){ popEl.classList.add('an'); });
  clearTimeout(popUhr);
  popUhr = setTimeout(function(){ if(popEl) popEl.classList.remove('an'); }, 2600);
  amandaSpricht(t);
}

/* Konfetti aus den Markenfarben */
function konfetti(){
  try{ if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return; }catch(e){}
  var box = document.createElement('div'); box.className = 'kon';
  var farben = ['#2DD4BF','#FFCE00','#DD0000','#14B8A6','#FFE493'];
  for(var i=0;i<42;i++){
    var k = document.createElement('i');
    k.style.left = (Math.random()*100)+'%';
    k.style.background = farben[i%farben.length];
    k.style.animationDuration = (2.1+Math.random()*1.6)+'s';
    k.style.animationDelay = (Math.random()*.5)+'s';
    k.style.opacity = .85;
    box.appendChild(k);
  }
  document.body.appendChild(box);
  setTimeout(function(){ box.remove(); }, 4200);
}

/* Grosser Jubel, wenn die Lektion geschafft ist */
var jubGezeigt = false;
function jubeln(){
  if(jubGezeigt) return; jubGezeigt = true;
  klang('fertig');
  try{ if(window.julia) window.julia('fertig'); }catch(e){}
  konfetti();
  var o = document.createElement('div'); o.className = 'jub';
  o.innerHTML = '<div class="jub-k"><img src="'+AM.jubel+'" alt="Amanda"><h3>Sehr gut gemacht!</h3>'
    + '<p>Du hast die Lektion geschafft \u2014 alle \u00dcbungen gel\u00f6st. Ich freue mich mit dir. '
    + 'Wir bauen das n\u00e4chste Mal darauf auf.</p>'
    + '<button class="btn btn-p" id="jubZu"><span>Weiter</span></button></div>';
  document.body.appendChild(o);
  requestAnimationFrame(function(){ o.classList.add('an'); });
  setTimeout(function(){ amandaSpricht('Sehr gut gemacht! Du hast die Lektion geschafft.'); }, 480);
  function zu(){ o.classList.remove('an'); setTimeout(function(){ o.remove(); }, 320); }
  o.querySelector('#jubZu').onclick = zu;
  o.addEventListener('click', function(e){ if(e.target === o) zu(); });
}

/* Ton-Schalter oben rechts */
(function(){
  var b = document.getElementById('tonb');
  if(!b) return;
  function malen(){ b.classList.toggle('aus', !tonAn()); b.textContent = tonAn() ? '\u266a' : '\u2715'; }
  malen();
  b.onclick = function(){
    try{ if(window.klangAn) window.klangAn(!tonAn()); }catch(e){}
    if(!tonAn()){ try{ speechSynthesis.cancel(); }catch(e){} }
    malen();
  };
})();

/* ---------- Engine ---------- */
var D=null,steps=[],cur=0,st=[],first=0,total=0;
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function qo(x){ return esc(x).replace(/'/g,"\\'"); }
/* ---------- Mehr \u00dcben ----------
   Neun Aufgaben sind zu wenig, um ein Wort wirklich zu behalten.
   Aus dem, was in der Lektion ohnehin steht \u2014 Vokabeln,
   Beispiels\u00e4tze, Merks\u00e4tze, Dialog \u2014 entstehen hier weitere
   Aufgaben: Bild zuordnen, L\u00fccke f\u00fcllen, Satz bauen, h\u00f6ren.
   Sie h\u00e4ngen hinten an und gelten fuer jede Lektion. */
function mischen(liste, saat){
  var a=liste.slice(), n=saat||7;
  for(var i=a.length-1;i>0;i--){
    n=(n*9301+49297)%233280;
    var j=Math.floor(n/233280*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function kernwort(de){
  return String(de||'')
    .replace(/^(der|die|das|den|dem|ein|eine)\s+/i,'')
    .split(/[,/(]/)[0]
    .replace(/[\s\u2026.!?:]+$/,'')
    .trim();
}
/* Nur Nomen lassen sich eindeutig fotografieren. Eine Wendung wie
   \u201eTsch\u00fcss!\u201c sieht auf einem Foto genauso aus wie \u201eHallo!\u201c \u2014 dann
   waere die Bildaufgabe nicht l\u00f6sbar, sondern Gl\u00fccksache. */
function istNomen(v){ return /^(der|die|das)\s+\S/i.test(String((v&&v.de)||'')); }
function extraUebungen(d){
  var raus=[], V=(d.vokabeln||[]).filter(function(v){ return v && v.de; });

  /* a) Welches Bild passt? \u2014 nur mit Nomen, und nur ab vier davon */
  var N=V.filter(istNomen);
  if(N.length>=4){
    [0,1].forEach(function(runde){
      var pool=mischen(N, 11+runde*13).slice(0,4);
      if(pool.length<4) return;
      var ziel=pool[runde%4];
      raus.push({
        typ:'bildwahl', extra:true,
        frage:'Welches Bild passt zu \u201e'+ziel.de+'\u201c?',
        optionen:pool.map(function(v){ return v.de; }),
        richtig:pool.indexOf(ziel),
        hinweis:ziel.bsp||''
      });
    });
  }

  /* b) Das Wort im Beispielsatz \u2014 L\u00fccke mit vier Auswahlm\u00f6glichkeiten */
  var mitBsp=V.filter(function(v){
    var k=kernwort(v.de);
    if(!v.bsp || k.length<3) return false;
    var i=v.bsp.toLowerCase().indexOf(k.toLowerCase());
    if(i<0) return false;
    /* Was uebrig bleibt, muss noch ein Satz sein \u2014 sonst steht da nur die Luecke */
    return (v.bsp.slice(0,i)+v.bsp.slice(i+k.length)).replace(/[^A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df]/g,'').length>=3;
  });
  mischen(mitBsp, 29).slice(0,2).forEach(function(v,n){
    var k=kernwort(v.de), i=v.bsp.toLowerCase().indexOf(k.toLowerCase());
    var satz=v.bsp.slice(0,i)+'\u2026\u2026'+v.bsp.slice(i+k.length);
    var andere=mischen(V.filter(function(x){ return x!==v; }), 41+n).slice(0,3).map(function(x){ return kernwort(x.de); });
    var opt=mischen([k].concat(andere), 53+n);
    raus.push({
      typ:'mc', extra:true,
      frage:'Welches Wort fehlt?  '+satz,
      optionen:opt, richtig:opt.indexOf(k),
      hinweis:'Das Wort hei\u00dft vollst\u00e4ndig: '+v.de
    });
  });

  /* c) Satz bauen \u2014 aus den S\u00e4tzen, die man nach der Lektion kann */
  var saetze=((d.zusammenfassung&&d.zusammenfassung.kernsaetze)||[])
    .concat(((d.dialog&&d.dialog.lines)||[]).map(function(l){ return l.txt; }))
    .filter(function(x){
      if(!x || x.indexOf('/')>=0 || x.indexOf('\u2026')>=0 || x.indexOf('...')>=0) return false;
      var w=String(x).trim().split(/\s+/);
      return w.length>=3 && w.length<=7;
    });
  mischen(saetze, 67).slice(0,2).forEach(function(satz,n){
    var w=satz.trim().split(/\s+/);
    raus.push({
      typ:'order', extra:true,
      frage:'Bau den Satz!',
      woerter:mischen(w, 71+n*5),
      loesung:satz,
      hinweis:'Das Verb steht an zweiter Stelle \u2014 au\u00dfer in der Frage.'
    });
  });

  /* d) Was antwortest du? \u2014 aus dem Dialog der Lektion */
  var zeilen=((d.dialog&&d.dialog.lines)||[]).map(function(l){ return l.txt; }).filter(function(x){
    return x && x.trim().split(/\s+/).length<=9;
  });
  if(zeilen.length>=4){
    var k=1+Math.floor(zeilen.length/3);
    var frage=zeilen[k-1], antwort=zeilen[k];
    var falsch=mischen(zeilen.filter(function(x){ return x!==antwort && x!==frage; }), 59).slice(0,2);
    if(antwort && falsch.length===2){
      var opt=mischen([antwort].concat(falsch), 61);
      raus.push({
        typ:'mc', extra:true,
        frage:'Jemand sagt: \u201e'+frage+'\u201c  \u2014 Was passt als Antwort?',
        optionen:opt, richtig:opt.indexOf(antwort),
        hinweis:'Schau noch einmal in den Dialog der Lektion.'
      });
    }
  }

  /* e) Wendung und Situation zusammenbringen \u2014 nur mit eindeutigen Paaren */
  var gesehen={}, paare=[];
  V.forEach(function(v){
    if(!v.bsp) return;
    var r=v.bsp.trim();
    if(gesehen[r.toLowerCase()]) { gesehen[r.toLowerCase()]='doppelt'; return; }
    gesehen[r.toLowerCase()]=v.de;
    paare.push([v.de, r]);
  });
  paare=paare.filter(function(pp){ return gesehen[pp[1].toLowerCase()]!=='doppelt'; });
  if(paare.length>=4){
    raus.push({
      typ:'match', extra:true,
      frage:'Was geh\u00f6rt zusammen?',
      paare:mischen(paare, 73).slice(0,5),
      hinweis:'Lies beide Seiten einmal laut \u2014 dann h\u00f6rst du, was passt.'
    });
  }

  /* f) H\u00f6ren und wiedererkennen */
  if(saetze.length>=3){
    var drei=mischen(saetze, 83).slice(0,3);
    var ziel=drei[0], opt=mischen(drei, 97);
    raus.push({
      typ:'listen', extra:true,
      audio:ziel, frage:'H\u00f6r zu: Welchen Satz h\u00f6rst du?',
      optionen:opt, richtig:opt.indexOf(ziel),
      hinweis:'H\u00f6r noch einmal \u2014 achte auf das erste Wort.'
    });
  }

  return raus;
}
function boot(d){

function rail(){

function wbMalen(){

  if(!st[i].done){ st[i].done=true; if(st[i].fails===0)first++; }
  klang('richtig');
  var alleFertig = st.length && st.every(function(v){ return v.done; });
  if(alleFertig) setTimeout(jubeln, 420); else lobZeigen();
  fb(true,['Richtig.','Sehr gut.','Genau so.','Perfekt.'][i%4]+(x?' '+x:''));
  document.getElementById('bNext').disabled=false;
  document.getElementById('cnt').textContent=st.filter(function(v){return v.done;}).length+' / '+total+' Übungen';
  rail();
}
/* Niemand soll an einer Aufgabe festhängen: nach dem zweiten Fehler kommt
   der Tipp, nach dem dritten die Lösung — und es geht weiter. */
function loesungVon(u){
  if(u.typ==='mc'||u.typ==='listen'||u.typ==='bild'||u.typ==='bildwahl') return (u.optionen||[])[u.richtig]||'';
  if(u.typ==='gapbank') return (u.loesung||[]).join(' · ');
  if(u.typ==='order') return u.loesung||'';
  if(u.typ==='match') return (u.paare||[]).map(function(p){ return p[0]+' = '+p[1]; }).join(' · ');
  if(u.typ==='type') return u.loesung||u.muster||'';
  return '';
}
function miss(i,h){
  st[i].fails++;
  klang('falsch');
  var u=D.uebungen[i], L=loesungVon(u);
  if(st[i].fails>=3 && L){
    st[i].done=true;
    fb(false,'Kein Problem — so ist es richtig: <b>'+esc(L)+'</b>'+(h?'<br><b>Warum:</b> '+h:'')+'<br>Lies es dir einmal laut vor, dann geht es weiter.');
    document.getElementById('bNext').disabled=false;
    document.getElementById('cnt').textContent=st.filter(function(v){return v.done;}).length+' / '+total+' Übungen';
    rail();
    return;
  }
  fb(false,'Noch nicht ganz — versuch es nochmal.'+(st[i].fails>=2&&h?'<br><b>Tipp:</b> '+h:''));
}
window.__pick=function(el,i){
  var u=D.uebungen[i], k=+el.getAttribute('data-o');
  if(k===u.richtig){ el.classList.add('ok'); document.querySelectorAll('.o,.bw').forEach(function(o){o.disabled=true;}); pass(i); }
  else{ el.classList.add('no'); setTimeout(function(){el.classList.remove('no');},650); miss(i,u.hinweis); }
};
window.__put=function(el){
  var s=E.gaps.indexOf(null); if(s<0)return;
  E.gaps[s]={w:el.textContent,el:el}; el.classList.add('used');
  document.querySelector('.blank[data-g="'+s+'"]').textContent=el.textContent;
};
window.__clr=function(g){
  var k=+g.getAttribute('data-g'), c=E.gaps[k]; if(!c)return;
  c.el.classList.remove('used'); E.gaps[k]=null; g.textContent='';
};
window.__ord=function(el){
  if(el.classList.contains('used'))return;
  el.classList.add('used'); E.ord.push({w:el.textContent,el:el});
  var s=document.getElementById('slot'), c=document.createElement('button');
  c.className='tok'; c.textContent=el.textContent;
  c.onclick=function(){ el.classList.remove('used'); E.ord=E.ord.filter(function(x){return x.el!==el;}); c.remove(); };
  s.appendChild(c);
};
window.__mt=function(el,i){
  var u=D.uebungen[i];
  if(el.getAttribute('data-s')==='l'){ document.querySelectorAll('.p[data-s="l"]').forEach(function(p){p.classList.remove('sel');}); el.classList.add('sel'); E.ml=el; return; }
  if(!E.ml)return;
  if(E.ml.getAttribute('data-p')===el.getAttribute('data-p')){
    E.ml.classList.remove('sel'); E.ml.classList.add('ok'); el.classList.add('ok'); E.ml=null; E.md++;
    if(E.md>=u.paare.length) pass(i);
  } else { el.classList.add('no'); setTimeout(function(){el.classList.remove('no');},600); miss(i,u.hinweis); }
};
function nm(x){ return x.toLowerCase().replace(/\s+/g,' ').replace(/[.!?,]/g,'').trim(); }
window.__chk=function(i){
  var u=D.uebungen[i];
  if(u.typ==='gapbank'){
    if(E.gaps.some(function(g){return !g;})){ fb(false,'Füll erst alle Lücken.'); return; }
    if(E.gaps.map(function(g){return nm(g.w);}).join('|')===u.loesung.map(nm).join('|')) pass(i); else miss(i,u.hinweis);
  } else if(u.typ==='order'){
    if(nm(E.ord.map(function(x){return x.w;}).join(' '))===nm(u.loesung)) pass(i,'„'+esc(u.loesung)+'"'); else miss(i,u.hinweis||'Achte auf die Wortstellung.');
  } else if(u.typ==='type'){
    var v=nm(document.getElementById('inp').value||'');
    if(!v){ fb(false,'Schreib zuerst eine Antwort.'); return; }
    if((u.akzeptiert||[]).some(function(r){ try{ return new RegExp(r,'i').test(v); }catch(e){ return false; } })) pass(i);
    else miss(i,u.hinweis||u.muster);
  }
};
/* Das Merkblatt ist das Blatt, das man sich vor der naechsten Stunde
   nochmal ansieht. Deshalb darf es nicht aussehen wie eine Liste:
   jeder Satz ist eine Karte, die man antippen und hoeren kann, und
   das Wichtige in den Regeln ist mit dem Textmarker angestrichen. */
function vRecap(){
  var Z=D.zusammenfassung;
  var a=(Z.kernsaetze||[]).map(function(x){
    return '<div class="mk-satz" onclick="__say(this.querySelector(\'.sp\'),\''+qo(x)+'\')">'
      +'<span>'+esc(x)+'</span>'
      +'<button class="sp" aria-label="Anh\u00f6ren">'+I('speaker',15)+'</button></div>';
  }).join('');
  var b=(Z.merke||[]).map(function(x,i){
    return '<div class="mk-merk"><span class="nr">'+(i+1)+'</span>'+x+'</div>';
  }).join('');
  return '<div class="card"><h2>'+I('bookmark',19)+'Merkblatt</h2><p class="sub">Das Wichtigste dieser Lektion \u2014 angestrichen wie im Heft. Tipp einen Satz an, dann h\u00f6rst du ihn.</p>'
    +(a?'<div class="mk-s"><div class="mk-lab">'+I('mic',15)+'Diese S\u00e4tze kannst du jetzt</div>'+a+'</div>':'')
    +(b?'<div class="mk-s"><div class="mk-lab">'+I('grammar',15)+'Das musst du dir merken</div>'+b+'</div>':'')
    +(Z.tipp?'<div class="mk-tipp"><div class="kopf"><img src="bilder/julia-frei.webp" alt="Julia" onerror="this.style.display=\'none\'"><b>Julias Tipp</b></div>'+esc(Z.tipp)+'</div>':'')
    +'</div>';
}
/* ---------- Jetzt sprichst du ----------
   Hier soll niemand die Lektion verlassen, um zu \u00fcben. Amanda sitzt
   direkt in der Seite: sie stellt die Fragen zum Thema der Lektion,
   das Mitglied antwortet \u2014 getippt oder gesprochen \u2014 und sie
   korrigiert kurz und stellt die n\u00e4chste Frage. */
function vSpeak(){
  var t=(D.sprechen.tipps||[]).map(function(x){return '<li>'+I('spark',16)+'<span>'+esc(x)+'</span></li>';}).join('');
  return '<div class="card"><h2>'+I('mic',19)+'Jetzt sprichst du</h2><p class="sub">Sprechen lernt man nur durch Sprechen \u2014 laut, auch wenn niemand zuh\u00f6rt.</p>'
    +'<div class="task">'+esc(D.sprechen.task)+'</div>'
    +(t?'<div class="rlabel" style="margin-top:20px">'+I('chat',15)+'Diese Wendungen helfen dir</div><ul class="phr">'+t+'</ul>':'')
    +'<div class="rlabel" style="margin-top:24px">'+I('mic',15)+'\u00dcb es gleich hier mit Amanda</div>'
    +'<div class="ad">'
    +'<div class="ad-top"><img src="'+AM.hallo+'" alt="Amanda" onerror="this.style.display=\'none\'">'
    +'<div class="nm"><b>Amanda</b><span>deine KI-Tutorin \u2014 sie fragt, du antwortest</span></div><span class="pkt"></span></div>'
    +'<div class="ad-log" id="ad-log"></div>'
    +'<div class="ad-chips" id="ad-chips"></div>'
    +'<div class="ad-ein">'
    +'<button class="ad-b" id="ad-mik" title="Antwort sprechen" onclick="__adMikro()">\ud83c\udfa4</button>'
    +'<input id="ad-in" autocomplete="off" placeholder="Antworte Amanda \u2026" onkeydown="if(event.key===\'Enter\')__adSend()">'
    +'<button class="ad-b send" id="ad-send" onclick="__adSend()" aria-label="Senden">'+I('arrowR',18)+'</button>'
    +'</div></div></div>';
}

/* ---------- Amandas Gespr\u00e4ch in der Lektion ---------- */
var AD={verlauf:[],laeuft:false,begonnen:false,rec:null,brocken:[],nimmt:false};

function adKontext(){
  var w=((D.sprechen&&D.sprechen.tipps)||[]).join(' \u00b7 ');
  return '[\u00dcbungsrahmen, bitte nicht vorlesen] Wir sind im Sprechteil der Lektion \u201e'+D.meta.titel+'\u201c ('
    +D.meta.kurs+', Niveau '+(D.meta.level||'A1')+'). Aufgabe des Mitglieds: '+((D.sprechen&&D.sprechen.task)||'')
    +' N\u00fctzliche Wendungen aus der Lektion: '+w+'.'
    +' F\u00fchre mit mir ein kurzes Gespr\u00e4ch genau zu diesem Thema: stelle immer nur EINE einfache Frage auf meinem Niveau,'
    +' warte meine Antwort ab, lobe kurz, korrigiere behutsam nur den wichtigsten Fehler und stelle dann die n\u00e4chste Frage.'
    +' H\u00f6chstens drei kurze Zeilen pro Antwort. Fang jetzt mit der ersten Frage an.';
}

/* Amandas Zeichen: *fett*, > Beispiel, \u00b7 Punkt, ! Merksatz */
function adFormat(t){
  var zeilen=String(t||'').split('\n'), h='';
  zeilen.forEach(function(z){
    var r=z.trim();
    if(!r){ h+='<br>'; return; }
    function fett(x){
      return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<b>$1</b>');
    }
    if(r.charAt(0)==='>') h+='<span class="bsp">'+fett(r.slice(1).trim())+'</span>';
    else if(r.charAt(0)==='\u00b7'||r.charAt(0)==='-') h+='<span class="pkt">'+fett(r.slice(1).trim())+'</span>';
    else if(r.charAt(0)==='!') h+='<span class="merk">'+fett(r.slice(1).trim())+'</span>';
    else h+='<span style="display:block">'+fett(r)+'</span>';
  });
  return h;
}
function adNurText(t){
  return String(t||'').replace(/[*>!\u00b7]/g,' ').replace(/\s{2,}/g,' ').trim();
}
function adMsg(wer,text){
  var log=document.getElementById('ad-log'); if(!log) return null;
  var d=document.createElement('div');
  d.className='ad-m '+(wer==='du'?'du':'bot');
  if(wer==='du') d.textContent=text;
  else{
    d.innerHTML=adFormat(text)
      +'<button class="sp" aria-label="Anh\u00f6ren" onclick="__say(this,\''+qo(adNurText(text))+'\',event)">'+I('speaker',13)+'</button>';
  }
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  return d;
}
function adWarte(an){
  var log=document.getElementById('ad-log'); if(!log) return;
  var w=document.getElementById('ad-warte');
  if(!an){ if(w) w.remove(); return; }
  if(w) return;
  var d=document.createElement('div'); d.className='ad-m warte'; d.id='ad-warte';
  d.textContent='Amanda \u00fcberlegt \u2026';
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function adChips(liste){
  var c=document.getElementById('ad-chips'); if(!c) return;
  c.innerHTML=(liste||[]).map(function(x){
    return '<button class="ad-chip" onclick="__adChip(\''+qo(x)+'\')">'+esc(x)+'</button>';
  }).join('');
}
window.__adChip=function(x){
  var f=document.getElementById('ad-in'); if(!f) return;
  f.value=x; f.focus();
  try{ f.setSelectionRange(f.value.length,f.value.length); }catch(e){}
};
async function adFrage(nachricht){
  if(AD.laeuft) return;
  AD.laeuft=true;
  var send=document.getElementById('ad-send'); if(send) send.disabled=true;
  if(nachricht){ adMsg('du',nachricht); AD.verlauf.push({wer:'du',text:nachricht}); }
  adWarte(true);
  try{
    var r=await fetch('/api/support-chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ seite:'unterricht', verlauf:[{wer:'du',text:adKontext()}].concat(AD.verlauf.slice(-12)) })
    });
    var j=await r.json();
    adWarte(false);
    var text=(j&&j.text)||'Das hat gerade nicht geklappt. Schreib mir bitte noch einmal.';
    adMsg('bot',text); AD.verlauf.push({wer:'bot',text:text});
    if(tonAn()) amandaSpricht(adNurText(text));
    if(window.AmandaMitschrift){ try{ window.AmandaMitschrift.notiz('amanda',text,{art:'unterricht'}); }catch(e){} }
  }catch(e){
    adWarte(false);
    adMsg('bot','Die Verbindung hat nicht geklappt. Versuch es bitte gleich noch einmal.');
  }
  AD.laeuft=false;
  if(send) send.disabled=false;
}
window.__adSend=function(){
  var f=document.getElementById('ad-in'); if(!f) return;
  var t=(f.value||'').trim(); if(!t||AD.laeuft) return;
  f.value='';
  if(window.AmandaMitschrift){ try{ window.AmandaMitschrift.notiz('du',t,{art:'unterricht'}); }catch(e){} }
  adFrage(t);
};
function adStart(){
  var log=document.getElementById('ad-log'); if(!log) return;
  adChips(((D.sprechen&&D.sprechen.tipps)||[]).slice(0,3));
  /* Mikrofon nur zeigen, wenn der Server zuh\u00f6ren kann */
  (async function(){
    try{
      if(!window._adKann){ var r=await fetch('/api/kann'); window._adKann=await r.json(); }
      var m=document.getElementById('ad-mik');
      if(m && window._adKann && !window._adKann.hoeren) m.style.display='none';
    }catch(e){}
  })();
  if(AD.verlauf.length){
    AD.verlauf.forEach(function(e){ adMsg(e.wer==='du'?'du':'bot', e.text); });
    return;
  }
  if(AD.begonnen) return;
  AD.begonnen=true;
  adFrage(null);
}

/* Reinsprechen statt tippen */
window.__adMikro=async function(){
  var m=document.getElementById('ad-mik'); if(!m) return;
  if(AD.nimmt){ try{ AD.rec.stop(); }catch(e){} return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){
    adMsg('bot','Dein Browser kann leider nicht aufnehmen. Schreib mir deine Antwort einfach.'); return;
  }
  var strom;
  try{ strom=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ adMsg('bot','Ich darf das Mikrofon nicht benutzen. Erlaub es bitte im Browser \u2014 oder schreib mir.'); return; }
  var typ=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
  AD.brocken=[];
  AD.rec=typ?new MediaRecorder(strom,{mimeType:typ}):new MediaRecorder(strom);
  AD.rec.ondataavailable=function(e){ if(e.data&&e.data.size) AD.brocken.push(e.data); };
  AD.rec.onstop=async function(){
    AD.nimmt=false; m.classList.remove('an'); m.innerHTML='\ud83c\udfa4';
    strom.getTracks().forEach(function(t){ t.stop(); });
    var blob=new Blob(AD.brocken,{type:(AD.rec&&AD.rec.mimeType)||'audio/webm'});
    if(blob.size<1200) return;
    await adVerstehen(blob);
  };
  try{ speechSynthesis.cancel(); }catch(e){}
  AD.rec.start(); AD.nimmt=true; m.classList.add('an'); m.innerHTML='\u25a0';
};
async function adVerstehen(blob){
  var feld=document.getElementById('ad-in');
  var vorher=feld?feld.placeholder:'';
  if(feld) feld.placeholder='Ich h\u00f6re zu \u2026';
  try{
    var b64=await new Promise(function(ok,ab){
      var r=new FileReader();
      r.onload=function(){ var t=String(r.result||''), i=t.indexOf(','); ok(i>-1?t.slice(i+1):t); };
      r.onerror=ab; r.readAsDataURL(blob);
    });
    var r2=await fetch('/api/hoeren',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ audio:b64, typ:blob.type }) });
    var j=await r2.json();
    if(feld) feld.placeholder=vorher;
    if(j&&j.ok&&j.text){ if(feld) feld.value=j.text; window.__adSend(); }
    else if(j&&j.error==='kein_schluessel'){
      var m=document.getElementById('ad-mik'); if(m) m.style.display='none';
      adMsg('bot','Sprachnachrichten sind gerade nicht freigeschaltet \u2014 das liegt nicht an dir. Schreib mir deine Antwort, ich antworte genauso.');
    }
    else adMsg('bot','Das habe ich nicht verstanden. Sprich bitte noch einmal \u2014 oder schreib es mir.');
  }catch(e){
    if(feld) feld.placeholder=vorher;
    adMsg('bot','Die Aufnahme kam nicht an. Schreib mir deine Antwort gern.');
  }
}
function vFin(){
  return '<div class="card fin"><div class="mark">'+I('check',34)+'</div>'
    +'<h1>Lektion abgeschlossen</h1><p class="lead" style="max-width:400px;margin:0 auto">Stark, dass du drangeblieben bist. Genau so baut man Deutsch auf — Schritt für Schritt.</p>'
    +'<div class="kpis"><div class="kpi"><div class="v">'+first+'/'+total+'</div><div class="l">beim 1. Versuch</div></div>'
    +'<div class="kpi"><div class="v">'+(D.vokabeln?D.vokabeln.length:0)+'</div><div class="l">'+((D.vokabeln&&D.vokabeln.length===1)?'neues Wort':'neue Wörter')+'</div></div></div>'
    +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
    +'<a class="btn btn-s" style="text-decoration:none" href="konto.html#kurse">Zur Bibliothek</a>'
    +'<a class="btn btn-p" style="text-decoration:none" href="konto.html#amanda">'+I('mic',17)+'<span>Sprechen üben</span></a></div></div>';
}
function saveDone(){
  try{
    var a=JSON.parse(localStorage.getItem('dow_lek')||'{}');
    a[LID]={done:true,first:first,total:total,ts:Date.now()};
    localStorage.setItem('dow_lek',JSON.stringify(a));
  }catch(e){}
}
})();
