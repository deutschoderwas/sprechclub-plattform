<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfansicht Kurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',system-ui,sans-serif;background:#F4F6F9;margin:0;padding:14px}
  h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif}
  #leiste{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  #leiste button{font:inherit;font-size:12px;font-weight:700;border:1px solid #dcd6c8;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
</style></head><body>
<div id="leiste">
  <button onclick="renderNiveau()">Niveaus</button>
  <button onclick="renderKurs('A1')">A1-Kurs</button>
  <button onclick="renderKurs('A2')">A2-Kurs</button>
  <button onclick="renderKurs('A2');kursLektion(2)">A2 · Lektion 2</button>
  <button onclick="renderKurs('A2');kursLektion(7)">A2 · Lektion 7</button>
  <button onclick="renderKurs('A2');kursLektion(2);kuUebenStarten()">A2 L2 · Üben</button>
</div>
<section class="view active" id="v-kurs"></section>
<script src="niveau.js"></script>
<script src="a1.js"></script>
<script src="a2.js"></script>
<script src="schreiben.js"></script>
<script src="kurs.js"></script>
<script>
  var q=(location.hash||'#').slice(1).split(',');
  if(q[0]==='niveau') renderNiveau();
  else if(q[0]&&q[1]) { renderKurs(q[0]); kursLektion(+q[1]); if(q[2]==='ueben') kuUebenStarten(); }
  else if(q[0]) renderKurs(q[0]);
  else renderNiveau();
</script>
</body></html>
