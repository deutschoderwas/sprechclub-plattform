<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Julia korrigiert – deutschoderwas club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF9F5">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --ink:#171717; --ink2:#6E6A63; --ink3:#9A958C;
  --line:#EBE7DF; --line2:#F4F1EA;
  --acc:#12A594; --acc-d:#0E7C70; --acc-soft:#EAF7F4; --acc-line:#CFEBE5;
  --gold:#E8B923; --gold-soft:#FDF8EA; --gold-line:#F0E2BD;
  --err:#C9453D; --err-soft:#FBEFEE;
  --r1:12px; --r2:16px; --r3:22px;
  --sh:0 1px 2px rgba(23,23,23,.04), 0 8px 24px -16px rgba(23,23,23,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.ic{flex:none;vertical-align:-.15em}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.top{position:sticky;top:0;z-index:30;background:rgba(251,249,245,.9);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line2)}
.top-in{max-width:720px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:13px}
.icb{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none;transition:.2s}
.icb:hover{color:var(--ink);border-color:var(--ink3)}
.tt{flex:1;min-width:0}
.tt .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-d)}
.tt .t{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;letter-spacing:-.02em}

.wrap{max-width:720px;margin:0 auto;padding:20px 18px calc(40px + env(safe-area-inset-bottom))}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(25px,5.4vw,31px);font-weight:700;letter-spacing:-.03em;line-height:1.13;margin:0 0 10px}
.lead{color:var(--ink2);font-size:15px;line-height:1.65;margin:0 0 20px;max-width:560px}
h2{font-family:'Space Grotesk',sans-serif;font-size:18.5px;font-weight:600;letter-spacing:-.02em;margin:0 0 5px;display:flex;align-items:center;gap:9px}
h2 .ic{color:var(--acc-d)}
.sub{color:var(--ink2);font-size:14.5px;line-height:1.6;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:22px 20px;box-shadow:var(--sh);margin-bottom:14px;animation:up .45s cubic-bezier(.16,1,.3,1) both}

/* Julia-Karte */
.jul{display:flex;gap:15px;align-items:center;background:linear-gradient(135deg,#0E7C70,#12A594);border-radius:var(--r3);padding:20px;color:#fff;margin-bottom:16px;box-shadow:0 14px 34px -18px rgba(18,165,148,.9)}
.jul .av{width:62px;height:62px;border-radius:50%;overflow:hidden;flex:none;background:rgba(255,255,255,.2);border:2.5px solid rgba(255,255,255,.4)}
.jul .av img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.jul .jx{flex:1;min-width:0}
.jul .jx b{display:block;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.jul .jx span{font-size:14px;line-height:1.5;opacity:.94;display:block}

/* Kontingent */
.kt{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:var(--r2);padding:13px 15px;margin-bottom:16px;font-size:14px;color:#6B5518;line-height:1.5}
.kt .ic{color:#B8931A;flex:none}
.kt b{font-weight:700}

/* Formular */
.fl{margin-bottom:14px}
.fl label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.inp,.ta{width:100%;border:1.5px solid var(--line);border-radius:var(--r2);padding:13px 15px;font-size:15.5px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .2s;line-height:1.6}
.inp:focus,.ta:focus{border-color:var(--acc)}
.ta{min-height:190px;resize:vertical}
.cnt{font-size:12.5px;color:var(--ink3);text-align:right;margin-top:6px}
.cnt.warn{color:var(--err)}
.opts{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.op{flex:1;min-width:150px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:13px 15px;cursor:pointer;font-family:inherit;text-align:left;transition:.2s}
.op:hover{border-color:var(--ink3)}
.op.on{border-color:var(--acc);background:var(--acc-soft)}
.op b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.op span{font-size:12.5px;color:var(--ink2);line-height:1.45}
.op.on b{color:var(--acc-d)}

.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:14px 26px;display:inline-flex;align-items:center;gap:9px;text-decoration:none;transition:.2s}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc-d)}
.btn-p:disabled{background:var(--line);color:var(--ink3);cursor:not-allowed}
.btn-s{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--acc)}

/* Einreichungen */
.ein{border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-bottom:11px;background:var(--surface)}
.ein .eh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700}
.st.offen{background:var(--gold-soft);border:1px solid var(--gold-line);color:#8A6D00}
.st.fertig{background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc-d)}
.ein .dt{font-size:12.5px;color:var(--ink3);margin-left:auto;font-weight:500}
.ein .auf{font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:5px}
.ein .tx{font-size:14.5px;line-height:1.6;color:var(--ink2);white-space:pre-wrap;max-height:88px;overflow:hidden;position:relative}
.ein .tx.auf-zu{max-height:none}
.ein .mehr{background:none;border:none;color:var(--acc-d);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0 0}
.fb{margin-top:13px;padding-top:13px;border-top:1px solid var(--line2)}
.fb .fh{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12.5px;font-weight:700;color:var(--acc-d)}
.fb .fh img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top center}
.fb .ft{font-size:14.5px;line-height:1.62;white-space:pre-wrap}
.fb audio{width:100%;margin-top:10px}
.fb .kl{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.kor{background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:var(--r2);padding:14px 16px;font-size:15px;line-height:1.9;white-space:pre-wrap;margin-bottom:13px}
.kor .x{color:var(--err);text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.72}
.kor .y{color:var(--acc-d);font-weight:600;background:#fff;border-radius:5px;padding:1px 5px;box-shadow:0 0 0 1px var(--acc-line)}
.tgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tg{font-size:12px;font-weight:600;color:var(--ink2);background:var(--line2);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.leer{text-align:center;padding:34px 20px;color:var(--ink2);font-size:14.5px;line-height:1.6}
.msg{border-radius:var(--r2);padding:13px 16px;font-size:14.5px;font-weight:500;margin-bottom:14px;display:none;line-height:1.55}
.msg.ok{display:block;background:var(--acc-soft);border:1px solid var(--acc-line);color:var(--acc-d)}
.msg.no{display:block;background:var(--err-soft);border:1px solid #F0D5D3;color:var(--err)}
.tip{display:flex;gap:10px;background:var(--line2);border-radius:var(--r2);padding:13px 15px;font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:14px}
.tip .ic{color:var(--ink3);flex:none;margin-top:1px}
@media(max-width:560px){.wrap{padding:16px 14px calc(80px + env(safe-area-inset-bottom))}.card{padding:18px 16px}.op{min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="icb" id="back" href="konto.html#dashboard" aria-label="Zurück"></a>
    <div class="tt"><div class="k">Dein Club</div><div class="t">Julia korrigiert</div></div>
  </div>
</header>
<main class="wrap"><div id="stage"><div class="leer">Wird geladen …</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="ui-icons.js"></script>
<script>
(function(){
'use strict';
var I=window.ICON||function(){return'';};
var CFG=window.SPRECHCLUB_CONFIG||{};
var SB_URL=CFG.SUPABASE_URL||'';
var SB_KEY=CFG.SUPABASE_ANON_KEY||'';
var sb=null, user=null, profil=null, typ='schreiben', kont={genutzt:0,gesamt:1};
function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dat(s){ try{ var d=new Date(s); return d.toLocaleDateString('de-DE',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }

async function start(){
  if(!window.supabase||!SB_KEY||!SB_URL){
    document.getElementById('stage').innerHTML=
      '<div class="card"><h1>Kurz noch einrichten</h1><p class="lead">Diese Seite braucht den Zugang zur Datenbank. Öffne einmal deinen Schülerbereich — danach funktioniert sie automatisch.</p>'
      +'<a class="btn btn-p" href="konto.html">'+I('arrowR',17)+'<span>Zum Schülerbereich</span></a></div>';
    return;
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  var s=await sb.auth.getSession();
  user=s&&s.data&&s.data.session?s.data.session.user:null;
  if(!user){
    document.getElementById('stage').innerHTML=
      '<div class="card"><h1>Bitte einloggen</h1><p class="lead">Melde dich in deinem Schülerbereich an, dann kannst du hier deine Texte einreichen.</p>'
      +'<a class="btn btn-p" href="index.html">'+I('user',17)+'<span>Zum Login</span></a></div>';
    return;
  }
  try{
    var pr=await sb.from('profiles').select('name,tier,status').eq('id',user.id).single();
    profil=pr.data||{};
  }catch(e){ profil={}; }
  try{
    var k=await sb.rpc('korrektur_kontingent');
    if(k&&k.data&&k.data[0]) kont={genutzt:k.data[0].genutzt||0, gesamt:k.data[0].gesamt||1};
  }catch(e){}
  zeichne();
  laden();
}

function zeichne(){
  var frei=Math.max(0,kont.gesamt-kont.genutzt);
  document.getElementById('stage').innerHTML=
     '<div class="jul"><span class="av"><img src="Julia.png" alt="Julia" onerror="this.style.display=\'none\'"></span>'
    +'<div class="jx"><b>Ich lese deinen Text — persönlich.</b>'
    +'<span>Keine KI-Korrektur, keine Automatik. Du bekommst eine Rückmeldung von mir, mit dem, was wirklich zählt.</span></div></div>'

    +'<div class="kt">'+I('spark',18)+'<span>Du hast diesen Monat <b>'+frei+' von '+kont.gesamt+'</b> '
    +(kont.gesamt===1?'Korrektur':'Korrekturen')+' frei.'
    +(kont.gesamt<4?' <b>Premium-Mitglieder</b> haben 4 pro Monat.':'')+'</span></div>'

    +'<div class="card"><h2>'+I('bookmark',19)+'Text einreichen</h2>'
    +'<p class="sub">Schreib etwas auf Deutsch — eine E-Mail, einen Prüfungsbrief, eine Beschreibung. Ich korrigiere und erkläre dir, warum.</p>'
    +'<div class="msg" id="msg"></div>'
    +'<div class="opts">'
    +'<button class="op on" data-typ="schreiben" onclick="__typ(this,\'schreiben\')"><b>Freier Text</b><span>E-Mail, Bericht, Erzählung — was du willst</span></button>'
    +'<button class="op" data-typ="pruefung" onclick="__typ(this,\'pruefung\')"><b>Prüfungsaufgabe</b><span>Ich prüfe nach Goethe-/telc-Kriterien</span></button>'
    +'</div>'
    +'<div class="fl"><label for="auf">Worum geht es? (kurz)</label>'
    +'<input class="inp" id="auf" maxlength="120" placeholder="z. B. Beschwerdebrief für telc B2"></div>'
    +'<div class="fl"><label for="txt">Dein Text auf Deutsch</label>'
    +'<textarea class="ta" id="txt" maxlength="3000" placeholder="Schreib hier deinen Text …" oninput="__zaehl()"></textarea>'
    +'<div class="cnt" id="cnt">0 / 3000 Zeichen</div></div>'
    +'<button class="btn btn-p" id="send" onclick="__senden()"'+(frei<=0?' disabled':'')+'>'+I('arrowR',17)+'<span>'+(frei>0?'An Julia schicken':'Kontingent aufgebraucht')+'</span></button>'
    +'<div class="tip">'+I('spark',16)+'<span>Schreib lieber kurz und ehrlich als lang und abgeschrieben. Ich sehe an deinen eigenen Fehlern viel besser, woran wir arbeiten müssen.</span></div>'
    +'</div>'

    +'<div class="card"><h2>'+I('chat',19)+'Deine Einreichungen</h2>'
    +'<div id="liste"><div class="leer">Wird geladen …</div></div></div>';
}

window.__typ=function(el,t){
  typ=t;
  document.querySelectorAll('.op').forEach(function(o){o.classList.toggle('on',o===el);});
};
window.__zaehl=function(){
  var v=document.getElementById('txt').value.length;
  var c=document.getElementById('cnt');
  c.textContent=v+' / 3000 Zeichen';
  c.classList.toggle('warn',v>2900);
};
function melde(art,txt){
  var m=document.getElementById('msg');
  m.className='msg '+art; m.innerHTML=txt;
  if(art==='ok') setTimeout(function(){ m.className='msg'; },6000);
}
window.__senden=async function(){
  var t=document.getElementById('txt').value.trim();
  var a=document.getElementById('auf').value.trim();
  if(t.length<30){ melde('no','Schreib bitte mindestens ein paar Sätze — sonst kann ich dir nicht viel sagen.'); return; }
  var b=document.getElementById('send'); b.disabled=true;
  b.innerHTML='<span>Wird gesendet …</span>';
  try{
    var r=await sb.from('korrekturen').insert({ user_id:user.id, typ:typ, aufgabe:a||null, inhalt:t });
    if(r.error) throw r.error;
    document.getElementById('txt').value=''; document.getElementById('auf').value=''; __zaehl();
    kont.genutzt++;
    melde('ok','Angekommen. Ich melde mich mit deiner Korrektur — meist innerhalb von zwei bis drei Tagen.');
    laden();
    var frei=Math.max(0,kont.gesamt-kont.genutzt);
    b.disabled=frei<=0;
    b.innerHTML=I('arrowR',17)+'<span>'+(frei>0?'An Julia schicken':'Kontingent aufgebraucht')+'</span>';
  }catch(e){
    melde('no','Das hat nicht geklappt: '+esc(e.message||'Unbekannter Fehler')+'. Versuch es bitte gleich nochmal.');
    b.disabled=false; b.innerHTML=I('arrowR',17)+'<span>An Julia schicken</span>';
  }
};
async function laden(){
  var el=document.getElementById('liste'); if(!el) return;
  try{
    var r=await sb.from('korrekturen').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);
    var rows=(r&&r.data)||[];
    if(!rows.length){
      el.innerHTML='<div class="leer">Noch nichts eingereicht.<br>Schreib deinen ersten Text — auch ein kurzer reicht.</div>';
      return;
    }
    el.innerHTML=rows.map(function(k,i){
      var fertig=k.status==='erledigt';
      return '<div class="ein">'
        +'<div class="eh"><span class="st '+(fertig?'fertig':'offen')+'">'+I(fertig?'check':'clock',13)+(fertig?'korrigiert':'bei Julia')+'</span>'
        +'<span class="dt">'+dat(k.created_at)+'</span></div>'
        +(k.aufgabe?'<div class="auf">'+esc(k.aufgabe)+'</div>':'')
        +'<div class="tx" id="tx'+i+'">'+esc(k.inhalt)+'</div>'
        +(k.inhalt.length>240?'<button class="mehr" onclick="__mehr('+i+',this)">Ganzen Text zeigen</button>':'')
        +(fertig&&(k.feedback||k.feedback_audio||k.korrigiert_html)
          ? '<div class="fb"><div class="fh"><img src="Julia.png" alt="" onerror="this.style.display=\'none\'">Julias Rückmeldung</div>'
            +(k.korrigiert_html?'<div class="kl">So wird ein runder Text daraus</div><div class="kor">'+k.korrigiert_html+'</div>':'')
            +(k.feedback?'<div class="ft">'+esc(k.feedback)+'</div>':'')
            +(k.feedback_audio?'<audio controls src="'+esc(k.feedback_audio)+'"></audio>':'')
            +((k.fehler_tags&&k.fehler_tags.length)?'<div class="tgs">'+k.fehler_tags.map(function(t){return '<span class="tg">'+esc(t)+'</span>';}).join('')+'</div>':'')
            +'</div>'
          : '')
        +'</div>';
    }).join('');
  }catch(e){
    el.innerHTML='<div class="leer">Deine Einreichungen konnten gerade nicht geladen werden.</div>';
  }
}
window.__mehr=function(i,b){
  var t=document.getElementById('tx'+i);
  t.classList.toggle('auf-zu');
  b.textContent=t.classList.contains('auf-zu')?'Weniger zeigen':'Ganzen Text zeigen';
};

document.getElementById('back').innerHTML=I('arrowL',19);
start();
})();
</script>
</body>
</html>
