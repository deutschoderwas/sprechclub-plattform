<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Die Zeichen des Clubs</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Shantell+Sans:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tuerkis:#39CCE3;--tuerkis-dunkel:#1990A4;--auf-tuerkis:#063138;--gelb:#FFE100;--gruen:#77D42A;--rot:#DD0000;--tinte:#20211F;--creme:#FFF8E0;--karte:#FFFDF3;--linie:#E7DFC7;
--hand:255px 12px 225px 15px/15px 225px 15px 255px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--creme);color:var(--tinte);padding:30px}
h1{font-family:'Caveat Brush',cursive;font-weight:400;font-size:40px;margin-bottom:6px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;margin:22px 0 34px}
.z{background:var(--karte);border:2.5px solid var(--tinte);border-radius:16px;box-shadow:3px 4px 0 rgba(32,33,31,.10);
  padding:16px 8px;text-align:center}
.z .zeichen{font-size:30px;margin-bottom:8px}
.z b{font-family:'Shantell Sans',cursive;font-size:12.5px;display:block}
.gross .zeichen{font-size:64px}
.menue{background:var(--karte);border:2.5px solid var(--tinte);border-radius:16px;padding:12px;max-width:270px;
  box-shadow:3px 4px 0 rgba(32,33,31,.10)}
.navlink{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:none;background:none;
  width:100%;text-align:left;font-family:'Shantell Sans',cursive;font-weight:700;font-size:14px;color:#54594a;cursor:pointer}
.navlink:hover{background:#EAFBFE;color:var(--tinte)}
.navlink.active{background:var(--tuerkis);color:var(--auf-tuerkis);border:2.5px solid var(--auf-tuerkis);
  box-shadow:2px 3px 0 rgba(6,49,56,.22);padding:8.5px 10.5px}
h2{font-family:'Shantell Sans',cursive;font-size:17px;margin:26px 0 10px}
</style></head><body>
<h1>Die Zeichen des Clubs</h1>
<p style="color:#54594a">Tintenstrich, gelbe Markierung leicht daneben, ein Tupfer Türkis.</p>
<div class="raster" id="alle"></div>
<h2>Groß</h2>
<div class="raster gross" id="gross"></div>
<h2>Im Menü</h2>
<div class="menue" id="menue"></div>
<script src="club-zeichen.js"></script>
<script>
var n = ZEICHEN.namen;
document.getElementById('alle').innerHTML = n.map(k =>
  '<div class="z"><span class="zeichen zeichen-hupf">'+ZEICHEN.html(k)+'</span><b>'+ZEICHEN.liste[k].titel+'</b></div>').join('');
document.getElementById('gross').innerHTML = ['lernen','ueben','vokabeln','schreiben','pruefung','fehler'].map(k =>
  '<div class="z"><span class="zeichen">'+ZEICHEN.html(k)+'</span></div>').join('');
document.getElementById('menue').innerHTML =
  [['start','Startseite',0],['kalender','Live Unterricht',0],['lernen','Lernbereich',1],
   ['ueben','Üben',0],['vokabeln','Vokabeln',0],['schreiben','Schreiben',0],['pruefung','Prüfung',0],
   ['fortschritt','Fortschritt',0],['profil','Profil',0]]
  .map(r => '<button class="navlink'+(r[2]?' active':'')+'"><span class="zeichen">'+ZEICHEN.html(r[0])+'</span><span>'+r[1]+'</span></button>').join('');
ZEICHEN.stil();
</script></body></html>
