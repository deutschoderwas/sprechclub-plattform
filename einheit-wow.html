.motif svg{width:100%;height:100%;stroke:#FFCE00;fill:none;stroke-width:1.2;}
.tex{position:fixed;inset:0;pointer-events:none;opacity:.45;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");}
.vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.6);}
/* === Bühne / Slides === */
.stage{position:relative;height:100%;padding:4.5vh 7vw 11vh;display:flex;flex-direction:column;justify-content:center;}
.slide{display:none;}
.slide.on{display:block;animation:slin .5s ease;}
@keyframes slin{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--ff-h);font-weight:800;font-size:.82rem;letter-spacing:.13em;text-transform:uppercase;color:#17110A;background:var(--gold);padding:8px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(224,176,0,.35);}
.kicker svg{width:16px;height:16px;}
.s-h{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.9rem,3.8vw,3rem);letter-spacing:-.02em;margin:16px 0 4px;text-shadow:0 10px 36px rgba(0,0,0,.4);}
.s-h .u{position:relative;white-space:nowrap;}
.s-h .u svg{position:absolute;left:-4px;right:-4px;bottom:-10px;width:calc(100% + 8px);height:16px;}
.s-h .u path{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;animation:draw 1s .3s forwards cubic-bezier(.6,0,.2,1);}
.s-sub{font-size:clamp(1.05rem,1.7vw,1.35rem);font-weight:700;color:#d7efe9;max-width:720px;margin-top:22px;}
/* Titel-Slide */
.clock{position:absolute;top:4vh;right:5vw;width:122px;height:122px;display:flex;align-items:center;justify-content:center;animation:bob 4.5s ease-in-out infinite;}
.clock .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7df,#f4e4a6);box-shadow:0 22px 40px rgba(0,0,0,.5),inset 0 -8px 16px rgba(180,140,0,.4),inset 0 6px 10px rgba(255,255,255,.7);border:4px solid var(--gold-d);}
.clock .em{position:relative;font-size:3.2rem;}
.spark{position:absolute;width:42px;height:42px;animation:tw 2.4s ease-in-out infinite;}
.spark line{stroke:var(--gold);stroke-width:3.6;stroke-linecap:round;}
.big-word{position:relative;display:inline-block;margin:10px 0;}
.big-word h1{font-family:var(--ff-h);font-weight:800;font-size:clamp(3rem,7.5vw,5.6rem);line-height:.98;letter-spacing:-.025em;text-shadow:0 14px 48px rgba(0,0,0,.55);}
.big-word .swoosh{position:absolute;left:-6px;bottom:-18px;width:102%;height:30px;}
.big-word .swoosh path{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;stroke-dasharray:460;stroke-dashoffset:460;animation:draw 1.1s .8s forwards cubic-bezier(.6,0,.2,1);filter:drop-shadow(0 4px 8px rgba(224,176,0,.4));}
/* Karten allgemein */
.grid{display:grid;gap:15px;margin-top:26px;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);}
.card{position:relative;background:var(--cream2);color:var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 26px 48px rgba(0,0,0,.4);border:1px solid rgba(0,0,0,.05);}
/* Fakten */
.fakt{display:flex;gap:14px;align-items:flex-start;}
.fakt+.fakt{margin-top:13px;}
.fakt .ic{flex:none;width:34px;height:34px;border-radius:999px;background:var(--tur);color:var(--tur-btn);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;box-shadow:0 8px 16px rgba(20,184,166,.3);}
.fakt .t{font-size:clamp(1rem,1.5vw,1.2rem);font-weight:700;line-height:1.45;padding-top:3px;}
/* Situationen */
.sit{position:relative;padding-left:62px;}
.sit::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:6px;border-radius:999px;}
.sit.s3::before{background:var(--rot);}.sit.s2::before{background:var(--gold-d);}.sit.s1::before{background:var(--tur);}
.sit .badge{position:absolute;left:-16px;top:16px;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 24px rgba(0,0,0,.3);}
.sit .badge svg{width:28px;height:28px;}
.s3 .badge{background:linear-gradient(150deg,#ff5a4d,var(--rot));}.s2 .badge{background:linear-gradient(150deg,#ffd84a,var(--gold-d));}.s1 .badge{background:linear-gradient(150deg,var(--tur),var(--tur-d));}
.sit .o{font-family:var(--ff-h);font-weight:800;font-size:1.18rem;display:flex;align-items:center;gap:9px;}
.sit .tag{font-family:var(--ff-h);font-weight:800;font-size:.68rem;padding:3px 11px;border-radius:999px;margin-left:auto;text-transform:uppercase;}
.s3 .tag{background:#FBE0DB;color:#a81710;}.s2 .tag{background:#FBEFC6;color:#7a5e00;}.s1 .tag{background:#D9F5EF;color:#0A6256;}
.sit .t{margin-top:5px;font-size:1rem;font-weight:700;color:#44515a;}
.meter{margin-top:10px;height:11px;border-radius:999px;background:#ece4cf;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);}
.meter i{display:block;height:100%;border-radius:999px;width:0;transition:width 1s .3s cubic-bezier(.5,0,.1,1);}
.s3 i{background:linear-gradient(90deg,var(--rot),#ff6a5d);}.s2 i{background:linear-gradient(90deg,var(--gold-d),var(--gold));}.s1 i{background:linear-gradient(90deg,var(--tur-d),var(--tur));}
/* Merke */
.merk{background:var(--ink);color:#fff;border-radius:22px;padding:24px 28px;box-shadow:0 28px 54px rgba(0,0,0,.5);position:relative;overflow:hidden;max-width:860px;}
.merk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(var(--ink) 0 34%,var(--rot) 34% 67%,var(--gold) 67% 100%);}
.merk .ml{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:5px 15px;font-family:var(--ff-h);font-weight:800;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;}
.merk .mt{font-family:var(--ff-h);font-weight:700;font-size:clamp(1.3rem,2.4vw,1.9rem);line-height:1.35;margin-top:14px;}
/* Ablauf */
.ablauf{display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.07);border:1px dashed rgba(45,212,191,.45);border-radius:20px;padding:20px 24px;max-width:860px;}
.ablauf .ic{flex:none;width:46px;height:46px;border-radius:999px;background:var(--tur);color:var(--tur-btn);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.ablauf .t{font-size:clamp(1rem,1.6vw,1.25rem);font-weight:700;line-height:1.5;}
.ablauf .t b{color:var(--gold);}
/* Frage-Slide */
.frage-q{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.7rem,3.6vw,2.9rem);line-height:1.15;letter-spacing:-.02em;max-width:900px;text-shadow:0 10px 30px rgba(0,0,0,.4);}
.frage-q .qn{display:inline-flex;width:clamp(42px,5vw,60px);height:clamp(42px,5vw,60px);border-radius:999px;background:var(--gold);color:#17110A;font-size:.5em;align-items:center;justify-content:center;margin-right:16px;vertical-align:middle;box-shadow:0 10px 22px rgba(224,176,0,.4);}
.fcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px;max-width:960px;}
.fbox{border-radius:20px;padding:18px 20px;box-shadow:0 20px 40px rgba(0,0,0,.35);}
.fbox .lbl{display:flex;align-items:center;gap:8px;font-family:var(--ff-h);font-weight:800;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;margin-bottom:11px;}
.fbox ul{list-style:none;}
.fbox li{font-size:clamp(.98rem,1.5vw,1.18rem);font-weight:700;line-height:1.45;padding:5px 0 5px 24px;position:relative;}
.fbox li::before{position:absolute;left:0;top:5px;font-weight:900;}
.folge{background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.35);}
.folge .lbl{color:var(--tur);} .folge li{color:#d7efe9;} .folge li::before{content:"↳";color:var(--tur);}
.antw{background:var(--cream2);color:var(--ink);}
.antw .lbl{color:var(--tur-ink);} .antw li{color:#2e3b43;} .antw li::before{content:"💬";font-size:.8em;top:7px;}
/* Chunks */
.chunk-card .h4{font-family:var(--ff-h);font-weight:800;font-size:1.1rem;color:var(--ink);margin-bottom:12px;display:flex;gap:8px;align-items:center;}
.chunk{background:var(--cream);border:1px solid rgba(0,0,0,.06);border-radius:13px;padding:11px 15px;font-size:clamp(.98rem,1.4vw,1.15rem);color:var(--ink);font-weight:800;margin-bottom:9px;}
/* Vokabel-Flip */
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:26px;}
.flipwrap{perspective:1200px;height:150px;}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.5,0,.2,1);cursor:pointer;}
.flip.on{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;justify-content:center;padding:18px;box-shadow:0 22px 44px rgba(0,0,0,.4);}
.ffront{background:var(--cream2);color:var(--ink);border:1px solid rgba(0,0,0,.05);}
.ffront .w{font-family:var(--ff-h);font-weight:800;font-size:1.22rem;}
.ffront .bsp{font-size:.9rem;color:#7a6f52;font-style:italic;font-weight:700;margin-top:7px;line-height:1.35;}
.ffront .hint2{position:absolute;bottom:12px;left:18px;font-size:.72rem;color:#b0a075;font-weight:800;}
.fback{background:linear-gradient(150deg,var(--tur),var(--tur-d));color:#fff;transform:rotateY(180deg);text-align:center;}
.fback .w{font-family:var(--ff-h);font-weight:800;font-size:1.1rem;opacity:.85;}
.fback .d{font-size:1.1rem;font-weight:800;margin-top:8px;line-height:1.35;}
/* Tipp */
.tipp{display:flex;gap:18px;align-items:center;background:linear-gradient(150deg,rgba(255,206,0,.16),rgba(255,206,0,.06));border:1px solid rgba(255,206,0,.4);border-radius:22px;padding:24px 28px;max-width:860px;}
.tipp .ic{font-size:2.4rem;}
.tipp .t{font-size:clamp(1.1rem,1.9vw,1.5rem);font-weight:700;line-height:1.45;}
/* Gloss */
.gloss{border-bottom:3px dotted var(--gold);cursor:pointer;font-weight:900;}
.gloss::after{content:"\24D8";font-size:.62em;vertical-align:super;color:var(--gold);margin-left:2px;}
.gpop{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.72);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.gpop.on{display:flex;}
.gpop-card{position:relative;background:var(--cream2);color:var(--ink);border-radius:28px;max-width:460px;width:100%;padding:38px 32px 30px;text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:pop .2s ease;}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:none;}}
.gpop-x{position:absolute;top:14px;right:16px;border:none;background:#efe6cd;width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:1rem;color:#7a6f52;font-weight:800;}
.gpop-em{font-size:3.4rem;width:104px;height:104px;border-radius:999px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:inset 0 -6px 14px rgba(180,140,0,.15);}
.gpop-w{font-family:var(--ff-h);font-weight:800;font-size:1.7rem;}
.gpop-t{font-size:1.18rem;line-height:1.55;color:#3a454d;margin-top:10px;font-weight:600;}
.gpop-hint{margin-top:18px;display:inline-block;font-family:var(--ff-h);font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tur-ink);background:#D9F5EF;border-radius:999px;padding:6px 15px;}
/* ===== HOME: Niveau- & Themenwahl ===== */
body.home .nav,body.home .counter,body.home .badge-niv,body.home .to-themen{display:none;}
.to-themen{position:fixed;top:4.5vh;left:7vw;z-index:25;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:var(--ff-h);font-weight:700;font-size:.82rem;border-radius:999px;padding:7px 14px;cursor:pointer;}
.to-themen:hover{background:rgba(255,255,255,.18);}
body:not(.home) .counter{display:none;}
.home-head{text-align:center;max-width:760px;margin:0 auto;}
.home-logo{font-family:var(--ff-h);font-weight:800;font-size:1.3rem;color:#fff;margin-bottom:26px;}
.home-logo .o{color:var(--tur);}
.home-step{display:inline-flex;align-items:center;gap:9px;font-family:var(--ff-h);font-weight:800;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;color:#17110A;background:var(--gold);padding:7px 15px;border-radius:999px;box-shadow:0 8px 20px rgba(224,176,0,.35);}
.home-h{font-family:var(--ff-h);font-weight:800;font-size:clamp(2rem,4.5vw,3.3rem);letter-spacing:-.02em;margin:16px 0 6px;text-shadow:0 4px 20px rgba(0,0,0,.7),0 10px 40px rgba(0,0,0,.5);}
.home-sub{font-size:1.15rem;font-weight:700;color:#eef7f4;text-shadow:0 2px 12px rgba(0,0,0,.7);}
.home-logo{text-shadow:0 2px 12px rgba(0,0,0,.6);}
/* Niveau-Karten */
.niv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:40px auto 0;}
.niv-card{position:relative;background:var(--cream2);color:var(--ink);border-radius:26px;padding:30px 24px 26px;text-align:center;cursor:pointer;box-shadow:0 26px 54px rgba(0,0,0,.42);border:1px solid rgba(0,0,0,.05);transition:transform .18s,box-shadow .18s;overflow:hidden;}
.niv-card:hover{transform:translateY(-6px);box-shadow:0 36px 66px rgba(0,0,0,.5);}
.niv-card .top{height:7px;position:absolute;left:0;right:0;top:0;}
.niv-card.ab .top{background:#E0A400;}.niv-card.bb .top{background:#2F72C9;}.niv-card.bc .top{background:#2E9E57;}
.niv-card .ring{width:84px;height:84px;border-radius:999px;margin:4px auto 16px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-h);font-weight:800;font-size:1.5rem;color:#fff;box-shadow:0 14px 28px rgba(0,0,0,.25);}
.niv-card.ab .ring{background:linear-gradient(150deg,#FFD24A,#E0A400);color:#4A3600;}.niv-card.bb .ring{background:linear-gradient(150deg,#5B97E6,#2F72C9);}.niv-card.bc .ring{background:linear-gradient(150deg,#4FC27A,#2E9E57);}
.niv-card .lab{font-family:var(--ff-h);font-weight:800;font-size:1.5rem;}
.niv-card .wort{color:#7a6f52;font-weight:700;font-size:.95rem;margin-top:3px;}
.niv-card .cnt{margin-top:14px;display:inline-block;font-family:var(--ff-h);font-weight:800;font-size:.76rem;color:var(--tur-ink);background:#D9F5EF;border-radius:999px;padding:4px 13px;}
/* Themen */
.back{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:var(--ff-h);font-weight:700;font-size:.9rem;border-radius:999px;padding:9px 16px;cursor:pointer;margin-bottom:6px;}
.back:hover{background:rgba(255,255,255,.18);}
.themen-wrap{max-width:1040px;margin:26px auto 0;}
.bereich-h{font-family:var(--ff-h);font-weight:800;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:22px 0 12px;display:flex;align-items:center;gap:10px;}
.bereich-h::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12);}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.t-card{position:relative;text-align:left;background:var(--cream2);color:var(--ink);border-radius:18px;padding:16px 17px;cursor:pointer;box-shadow:0 16px 34px rgba(0,0,0,.34);border:1px solid rgba(0,0,0,.05);transition:transform .15s,box-shadow .15s;}
.t-card:hover{transform:translateY(-4px);box-shadow:0 24px 44px rgba(0,0,0,.44);}
.t-card .em{width:46px;height:46px;border-radius:14px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:11px;box-shadow:inset 0 -4px 10px rgba(180,140,0,.1);}
.t-card .tt{font-family:var(--ff-h);font-weight:800;font-size:1.08rem;line-height:1.15;}
.t-card .meta{margin-top:9px;display:flex;align-items:center;gap:7px;}
.t-card .go{font-family:var(--ff-h);font-weight:800;font-size:.8rem;color:var(--tur-ink);}
.t-card.soon{opacity:.6;cursor:default;}
.t-card.soon:hover{transform:none;box-shadow:0 16px 34px rgba(0,0,0,.34);}
.t-card .soon-b{font-family:var(--ff-h);font-weight:800;font-size:.68rem;color:#9a8c5f;background:#efe6cd;border-radius:999px;padding:3px 10px;}
.lv2{font-family:var(--ff-h);font-weight:800;font-size:.7rem;border-radius:999px;padding:2px 9px;}
.lv2.ab{background:#FBEFC6;color:#7a5e00;}.lv2.bb{background:#DCE8F8;color:#1D4F91;}.lv2.bc{background:#DDF2E4;color:#1F6E3C;}
.badge-niv.ab .lv{background:#E0A400!important;color:#2b2000!important;}.badge-niv.bb .lv{background:#2F72C9!important;color:#fff!important;}.badge-niv.bc .lv{background:#2E9E57!important;color:#fff!important;}
/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;height:9vh;min-height:62px;display:flex;align-items:center;justify-content:center;gap:18px;background:linear-gradient(0deg,rgba(10,12,14,.85),transparent);z-index:30;}
.nav button{border:none;cursor:pointer;background:var(--cream2);color:var(--ink);width:46px;height:46px;border-radius:999px;font-size:1.2rem;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:.14s;}
.nav button:hover{background:var(--gold);} .nav button:disabled{opacity:.3;cursor:default;}
.dots{display:flex;gap:8px;}
.dot{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);cursor:pointer;transition:.15s;}
.dot.on{background:var(--gold);width:26px;}
.counter{position:fixed;top:4.5vh;left:7vw;font-family:var(--ff-h);font-weight:800;font-size:.85rem;color:rgba(255,255,255,.5);z-index:20;}
.badge-niv{position:fixed;top:4.5vh;right:7vw;z-index:20;}
.lv{font-family:var(--ff-h);font-weight:800;font-size:.78rem;border-radius:999px;padding:5px 14px;background:rgba(45,212,191,.16);color:var(--tur);border:1px solid rgba(45,212,191,.4);}
@media(max-width:900px){.g2,.g3,.fcols,.vgrid{grid-template-columns:1fr;}.clock{width:92px;height:92px;}.clock .em{font-size:2.4rem;}}
/* ===== HUD: Punkte · Timer · Fortschritt ===== */
.pbar{position:fixed;top:0;left:0;height:5px;background:linear-gradient(90deg,var(--tur),var(--gold));z-index:40;transition:width .4s;box-shadow:0 0 10px rgba(45,212,191,.6);}
.hud{position:fixed;top:4.3vh;left:50%;transform:translateX(-50%);z-index:26;display:flex;gap:10px;align-items:center;}
body.home .hud,body.home .pbar{display:none;}
.hud .pill{display:flex;align-items:center;gap:7px;background:rgba(20,16,10,.6);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:999px;padding:7px 15px;font-family:var(--ff-h);font-weight:800;font-size:.92rem;}
.hud .pts{color:var(--gold);} .hud .pts.pulse{animation:pp .4s;}
@keyframes pp{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
.hud .tmr{color:#cfe9e4;}
/* Rollen */
.rollen{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;max-width:900px;}
.rolle{background:var(--cream2);color:var(--ink);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 22px 46px rgba(0,0,0,.4);border-top:6px solid var(--tur);}
.rolle:nth-child(2){border-top-color:var(--gold-d);}.rolle:nth-child(3){border-top-color:var(--rot);}
.rolle .em{font-size:2.4rem;}
.rolle .rn{font-family:var(--ff-h);font-weight:800;font-size:1.2rem;margin-top:6px;}
.rolle .rd{font-size:.92rem;color:#55606a;font-weight:600;margin-top:6px;line-height:1.4;}
.rolle .who{margin-top:12px;font-family:var(--ff-h);font-weight:800;font-size:.8rem;color:var(--tur-ink);background:#D9F5EF;border-radius:999px;padding:4px 12px;display:inline-block;}
/* Mission */
.mission{display:flex;gap:16px;align-items:center;background:linear-gradient(150deg,rgba(255,206,0,.18),rgba(255,206,0,.06));border:1.5px solid rgba(255,206,0,.45);border-radius:20px;padding:18px 22px;max-width:760px;margin-top:18px;}
.mission .em{font-size:2rem;}
.mission .mt{font-family:var(--ff-h);font-weight:800;font-size:1.1rem;}
.mission .md{font-size:.95rem;color:#e9dcc0;font-weight:600;margin-top:3px;}
/* Aufgabe-geschafft Button */
.done-btn{margin-top:18px;background:var(--tur);color:var(--tur-btn);border:none;font-family:var(--ff-h);font-weight:800;font-size:1rem;border-radius:14px;padding:13px 22px;cursor:pointer;box-shadow:0 12px 26px rgba(20,184,166,.3);display:inline-flex;align-items:center;gap:9px;}
.done-btn:disabled{background:#2e7d43;color:#fff;cursor:default;}
.zusatz-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-h);font-weight:800;font-size:.72rem;color:#17110A;background:var(--gold);border-radius:999px;padding:4px 12px;margin-bottom:10px;}
/* Aktiv-Aufgabe Karten */
.task-card{background:var(--cream2);color:var(--ink);border-radius:20px;padding:20px 24px;box-shadow:0 22px 46px rgba(0,0,0,.4);max-width:820px;}
.task-card .tl{font-family:var(--ff-h);font-weight:800;font-size:1.3rem;display:flex;gap:10px;align-items:center;}
.task-card .ts{font-size:1.05rem;font-weight:700;color:#44515a;margin-top:10px;line-height:1.5;}
.task-card .hilfe{margin-top:14px;background:rgba(45,212,191,.12);border:1px solid #cdefe8;border-radius:12px;padding:12px 15px;}
.task-card .hilfe b{color:var(--tur-ink);}
.task-card .hilfe ul{margin:6px 0 0 0;padding-left:20px;}.task-card .hilfe li{font-weight:700;padding:3px 0;}
/* Quiz-Optionen */
.opt{background:var(--cream2);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:15px 18px;font-size:clamp(1rem,1.5vw,1.2rem);font-weight:800;font-family:var(--ff-h);cursor:pointer;text-align:left;box-shadow:0 14px 30px rgba(0,0,0,.3);transition:.15s;display:flex;align-items:center;gap:12px;}
.opt:hover{transform:translateY(-2px);}
.opt .mk{flex:none;width:30px;height:30px;border-radius:999px;background:#eadfc2;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.opt.right{border-color:#2e7d43;background:#eafaef;}.opt.right .mk{background:#2e7d43;color:#fff;}
.opt.wrong{border-color:var(--rot);background:#fdeeec;}.opt.wrong .mk{background:var(--rot);color:#fff;}
.opt.dim{opacity:.5;}
.stage{overflow-y:auto;}
/* Mission-Wörter */
.mwords{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;max-width:820px;}
.mword{display:inline-flex;align-items:center;gap:9px;background:var(--cream2);color:var(--ink);border:2px solid transparent;border-radius:999px;padding:12px 20px;font-family:var(--ff-h);font-weight:800;font-size:clamp(1rem,1.5vw,1.2rem);cursor:pointer;box-shadow:0 12px 26px rgba(0,0,0,.3);transition:.15s;}
.mword:hover{transform:translateY(-2px);}
.mword .chk{color:#b0a075;font-size:1.1em;}
.mword.done{background:#eafaef;border-color:#2e7d43;color:#1f5b33;}
.mword.done .chk{color:#2e7d43;}
.mgoal{margin-top:20px;font-family:var(--ff-h);font-weight:700;font-size:1.1rem;color:#d7efe9;}
.mgoal b{color:var(--gold);}
/* ===== Gerüst v2 (26.11.2026): Lernbogen verstehen → merken → üben → sprechen ===== */
.stage{justify-content:flex-start;}
.slide.on{margin:auto 0;}
.sogehts{display:inline-flex;align-items:center;gap:10px;margin-top:12px;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.38);color:#d7efe9;border-radius:999px;padding:8px 16px;font-weight:800;font-size:clamp(.92rem,1.3vw,1.05rem);}
.sogehts b{color:var(--gold);}
/* Foto + Platzhalter */
.foto{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(150deg,#2b2214,#3a2e17);box-shadow:0 24px 48px rgba(0,0,0,.45);aspect-ratio:4/3;}
.foto img{width:100%;height:100%;object-fit:cover;display:block;}
.foto .ph{display:none;}
.foto.leer{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:2px dashed rgba(255,206,0,.35);}
.foto.leer .ph{display:block;font-size:3.6rem;}
.foto.leer::after{content:"Foto folgt";font-family:var(--ff-h);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,206,0,.7);}
.zwei{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:26px;align-items:center;margin-top:20px;max-width:1100px;}
.optlist{display:flex;flex-direction:column;gap:11px;}
.feedback{margin-top:14px;border-radius:16px;padding:14px 18px;font-weight:800;font-size:clamp(1rem,1.4vw,1.15rem);line-height:1.45;display:none;}
.feedback.on{display:block;animation:pop .25s ease;}
.feedback.ok{background:#eafaef;color:#1f5b33;}
.feedback.no{background:#fdeeec;color:#8a1a12;}
.feedback.info{background:var(--cream2);color:var(--ink);}
/* Redemittel nach Funktion */
.rm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px;margin-top:20px;}
.rm-box{background:var(--cream2);color:var(--ink);border-radius:20px;padding:16px 16px 12px;box-shadow:0 22px 44px rgba(0,0,0,.4);border-top:7px solid var(--tur);}
.rm-box.gold{border-top-color:var(--gold-d);}.rm-box.rot{border-top-color:var(--rot);}.rm-box.lila{border-top-color:#7C5CD6;}
.rm-f{font-family:var(--ff-h);font-weight:800;font-size:1.02rem;margin-bottom:10px;}
.rm-i{display:block;width:100%;text-align:left;background:var(--cream);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:9px 12px;margin-bottom:8px;cursor:pointer;font-family:var(--ff-b);font-size:clamp(.95rem,1.25vw,1.08rem);font-weight:800;color:var(--ink);}
.rm-i:hover{border-color:var(--tur);}
.rm-i .bsp{display:none;font-weight:600;font-style:italic;color:#6f6450;margin-top:6px;font-size:.92em;}
.rm-i.open .bsp{display:flex;gap:8px;align-items:center;}
mark.m{background:linear-gradient(transparent 55%,rgba(255,206,0,.55) 55%);color:inherit;padding:0 2px;border-radius:3px;}
.gold mark.m{background:linear-gradient(transparent 55%,rgba(45,212,191,.45) 55%);}
.say{flex:none;border:none;background:var(--tur);color:var(--tur-btn);width:30px;height:30px;border-radius:999px;cursor:pointer;font-size:.9rem;}
/* Chat-Dialog */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:20px;max-width:860px;}
.bub{max-width:76%;border-radius:20px;padding:12px 16px;font-weight:700;font-size:clamp(1rem,1.45vw,1.2rem);line-height:1.45;box-shadow:0 14px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease;}
.bub .wer{flex:none;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-h);font-weight:800;font-size:.85rem;}
.bub.A{align-self:flex-start;background:var(--cream2);color:var(--ink);border-bottom-left-radius:6px;}
.bub.A .wer{background:var(--tur);color:var(--tur-btn);}
.bub.B{align-self:flex-end;background:#2a4b46;color:#fff;border-bottom-right-radius:6px;}
.bub.B .wer{background:var(--gold);color:#17110A;}
.bub.B mark.m{background:linear-gradient(transparent 55%,rgba(255,206,0,.45) 55%);}
.bub .say{margin-left:auto;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-family:var(--ff-h);font-weight:800;font-size:.95rem;border-radius:14px;padding:12px 18px;cursor:pointer;}
.ghost:hover{background:rgba(255,255,255,.18);}
/* Puzzle */
.pz{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;margin-top:20px;max-width:980px;}
.pz-col{display:flex;flex-direction:column;gap:10px;}
.pz-t{background:var(--cream2);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:12px 16px;font-weight:800;font-size:clamp(.98rem,1.4vw,1.15rem);cursor:pointer;text-align:left;font-family:var(--ff-b);box-shadow:0 12px 26px rgba(0,0,0,.3);}
.pz-t.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,206,0,.25);}
.pz-t.done{background:#eafaef;color:#1f5b33;border-color:#2e7d43;cursor:default;}
.pz-t.err{animation:shake .35s;border-color:var(--rot);}
@keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
/* Lücken */
.wbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.wbank span{background:rgba(255,206,0,.16);border:1px solid rgba(255,206,0,.45);color:#ffe27a;border-radius:999px;padding:6px 14px;font-weight:800;}
.gap{display:inline-block;min-width:80px;border:none;border-bottom:3px dashed var(--gold-d);background:rgba(255,206,0,.18);border-radius:8px 8px 0 0;padding:0 10px;font:inherit;font-weight:900;color:inherit;cursor:pointer;}
.gap.zeig{background:#eafaef;color:#1f5b33;border-bottom-color:#2e7d43;}
/* Rollenspiel-Karten */
.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px;max-width:1100px;}
.rp-card{background:var(--cream2);color:var(--ink);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 18px 36px rgba(0,0,0,.38);border:none;text-align:left;font-family:var(--ff-b);transition:transform .15s;}
.rp-card:hover{transform:translateY(-4px);}
.rp-card .foto{border-radius:0;box-shadow:none;aspect-ratio:16/10;}
.rp-card .foto.leer .ph{font-size:2.4rem;}
.rp-card .tt{font-family:var(--ff-h);font-weight:800;font-size:1.05rem;padding:11px 14px 4px;}
.rp-card .st{padding:0 14px 12px;font-size:.82rem;font-weight:800;color:var(--tur-ink);}
.rp-card.gespielt .st{color:#2e7d43;}
.rp-det{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:22px;margin-top:16px;max-width:1150px;align-items:start;}
.rolle2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rk{background:var(--cream2);color:var(--ink);border-radius:16px;padding:14px 16px;font-weight:800;line-height:1.4;box-shadow:0 14px 28px rgba(0,0,0,.3);border-left:6px solid var(--tur);}
.rk.b{border-left-color:var(--gold-d);}
.rk small{display:block;font-family:var(--ff-h);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#8a7d58;margin-bottom:4px;}
.ziel{margin-top:12px;background:rgba(255,206,0,.15);border:1px solid rgba(255,206,0,.45);border-radius:14px;padding:11px 15px;font-weight:800;color:#ffe9a6;}
/* Debatte */
.these{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.4rem,2.8vw,2.2rem);line-height:1.2;max-width:980px;margin-top:14px;}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;max-width:1000px;}
.pc .card h4{font-family:var(--ff-h);font-weight:800;margin-bottom:8px;}
.pc .card li{font-weight:700;margin:6px 0 6px 18px;line-height:1.4;}
.pc .pro{border-top:7px solid #2e7d43;}.pc .contra{border-top:7px solid var(--rot);}
/* 90-Sekunden-Challenge */
.ch-list{display:flex;flex-direction:column;gap:12px;margin-top:20px;max-width:960px;}
.ch{display:flex;gap:16px;align-items:center;background:var(--cream2);color:var(--ink);border-radius:18px;padding:14px 18px;box-shadow:0 16px 32px rgba(0,0,0,.34);}
.ch .q{font-family:var(--ff-h);font-weight:800;font-size:clamp(1.02rem,1.5vw,1.2rem);}
.ch .hw{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.ch .hw span{background:#efe6cd;border-radius:999px;padding:3px 11px;font-size:.85rem;font-weight:800;color:#5d5036;}
.ch .go2{margin-left:auto;flex:none;border:none;border-radius:14px;padding:12px 16px;background:var(--gold);color:#17110A;font-family:var(--ff-h);font-weight:800;cursor:pointer;min-width:110px;font-size:1rem;}
.ch .go2.run{background:var(--rot);color:#fff;}
.ch .go2.fertig{background:#2e7d43;color:#fff;}
/* Quiz-Anschluss */
.anschluss{margin-top:14px;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.4);border-radius:16px;padding:13px 17px;font-weight:800;color:#d7efe9;max-width:640px;}
.anschluss b{color:var(--gold);}
/* Simulator */
.sim{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start;margin-top:16px;max-width:1120px;}
.sim-text{font-size:clamp(1.08rem,1.6vw,1.3rem);font-weight:800;line-height:1.5;}
.sim-hint{margin:12px 0;font-weight:800;color:#ffe27a;}
.sim-folge{margin-top:14px;background:var(--cream2);color:var(--ink);border-radius:16px;padding:14px 18px;font-weight:800;line-height:1.45;display:flex;gap:12px;align-items:flex-start;}
.sim-folge .gs{font-size:2rem;line-height:1;}
.sim-ende{max-width:760px;margin:20px auto 0;text-align:center;}
.sim-ende .gross{font-family:var(--ff-h);font-weight:800;font-size:clamp(3rem,7vw,5rem);color:var(--gold);}
.slide > .big-word{display:table;margin-top:18px;}
.clock{top:13vh;}
@media(max-width:900px){.zwei,.rp-det,.sim,.pz,.pc,.rolle2{grid-template-columns:1fr;}}

/* ===== Papier-Look (Julia 26.11.: „zu schwarz“, „zu KI-mäßig“) – hell, warm, handgemacht ===== */
:root{--paper:#FBF3DF;--paper2:#FFFDF6;--line:#1E1B16;--dust:#DCE8EC;--dust-d:#2F6F7D;}
body{background:var(--paper);color:var(--ink);}
.scene{background:var(--paper);} .scene .photo,.blob{display:none;} .scene::after{display:none;}
.tex{opacity:.6;mix-blend-mode:multiply;} .vig{box-shadow:inset 0 0 160px rgba(120,90,30,.10);} .motif{opacity:.07;}
.motif svg{stroke:var(--line);}
.s-h,.frage-q,.these,.big-word h1,.home-h,.home-logo{color:var(--ink);text-shadow:none;}
.s-sub,.home-sub{color:#5b5242;text-shadow:none;}
.card,.opt,.rm-box,.pz-t,.ch,.rp-card,.t-card,.rolle,.task-card,.fbox.antw,.bub.A,.rk,.sim-folge,.feedback,.niv-card,.ffront,.gpop-card{background:var(--paper2);border:2px solid var(--line)!important;box-shadow:4px 4px 0 var(--line)!important;}
.card:hover,.t-card:hover,.rp-card:hover,.opt:hover{box-shadow:6px 6px 0 var(--line)!important;}
.rm-box{border-top:8px solid var(--tur)!important;} .rm-box.gold{border-top-color:var(--gold-d)!important;} .rm-box.rot{border-top-color:var(--rot)!important;} .rm-box.lila{border-top-color:#7C5CD6!important;}
.rolle{border-top:8px solid var(--tur)!important;} .rolle:nth-child(2){border-top-color:var(--gold-d)!important;} .rolle:nth-child(3){border-top-color:var(--rot)!important;}
.pc .pro{border-top:8px solid #2e7d43!important;} .pc .contra{border-top:8px solid var(--rot)!important;}
.rk{border-left:8px solid var(--tur)!important;} .rk.b{border-left-color:var(--gold-d)!important;}
.opt.right,.pz-t.done{background:#E6F6EA!important;border-color:#2e7d43!important;color:#1f5b33;}
.opt.wrong{background:#FDECEA!important;border-color:var(--rot)!important;}
.opt.dim{opacity:.45;}
.pz-t.sel{border-color:var(--gold-d)!important;box-shadow:4px 4px 0 var(--gold-d)!important;}
.bub.B,.folge,.anschluss{background:var(--dust);color:var(--ink);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);}
.bub.B .wer{background:var(--dust-d);color:#fff;} .bub.A .wer{background:var(--tur);color:var(--ink);}
.folge .lbl,.folge li,.anschluss b{color:var(--ink);} .folge li::before{color:var(--dust-d);}
.antw .lbl{color:var(--tur-ink);}
.sogehts{background:transparent;border:none;border-left:4px solid var(--gold-d);border-radius:0;color:#3f382c;padding:4px 0 4px 12px;}
.sogehts b{color:var(--ink);background:linear-gradient(transparent 58%,rgba(255,206,0,.65) 58%);}
.kicker,.zusatz-badge,.lv{border:2px solid var(--line);box-shadow:none;}
.lv{background:var(--paper2);color:var(--ink);}
.done-btn{border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);color:var(--ink);}
.ghost,.back,.to-themen{background:var(--paper2);border:2px solid var(--line);color:var(--ink);}
.hud .pill{background:var(--paper2);border:2px solid var(--line);color:var(--ink);backdrop-filter:none;}
.hud .pts{color:#8a6600;} .hud .tmr{color:var(--ink);}
.nav{background:none;} .nav button{border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);}
.dot{background:rgba(30,27,22,.18);} .dot.on{background:var(--ink);}
.counter{color:rgba(30,27,22,.45);} .pbar{box-shadow:none;}
.merk{box-shadow:6px 6px 0 var(--gold-d);border:2px solid var(--line);}
.tipp{background:#FFF3C4;border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);} .tipp .t{color:var(--ink);}
.ablauf{background:var(--paper2);border:2px dashed var(--line);} .ablauf .t b{color:var(--ink);}
.mgoal,.sim-hint{color:#5b5242;} .mgoal b{color:var(--ink);}
.ziel,.wbank span{background:#FFF3C4;border:2px solid var(--line);color:var(--ink);}
.foto{background:repeating-linear-gradient(45deg,#F3E8CC 0 12px,#EEE0BD 12px 24px);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);}
.foto.leer::after{color:#7a6326;} .rp-card .foto{border:none;border-bottom:2px solid var(--line);box-shadow:none;}
.bereich-h{color:var(--ink);} .bereich-h::after{background:rgba(30,27,22,.15);}
[style*="color:var(--gold)"]{color:#8a6600!important;}
.gloss::after{color:#b38600;} .chunk{background:var(--paper);}
.say{border:2px solid var(--line);}
.gap{background:#FFF3C4;}

/* ===== EIN Design (Julia 26.11.2026, Variante C) – Werte kommen aus dow-design.css ===== */
:root{--tur:var(--dow-tuerkis);--tur-d:var(--dow-tuerkis-dunkel);--tur-ink:var(--dow-tuerkis-dunkel);--tur-btn:#fff;
  --ink:var(--dow-ink);--rot:var(--dow-rot);--gold:var(--dow-gold-hell);--gold-d:var(--dow-gold);--gold-ink:var(--dow-ink);
  --ff-h:var(--dow-ff-h);--ff-b:var(--dow-ff-b);--paper:var(--dow-bg);--paper2:var(--dow-card);--line:var(--dow-ink);
  --dust:var(--dow-staubblau);--dust-d:var(--dow-tuerkis-dunkel);--cream:#F4EFE2;--cream2:var(--dow-card);}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;z-index:41;background:linear-gradient(90deg,var(--dow-ink) 0 25%,var(--dow-rot) 25% 50%,var(--dow-gold) 50% 75%,var(--dow-tuerkis) 75% 100%);}
.pbar{top:4px;height:4px;background:var(--dow-tuerkis);}
.tex{opacity:.35;}
.card,.opt,.rm-box,.pz-t,.ch,.rp-card,.t-card,.rolle,.task-card,.fbox.antw,.bub.A,.rk,.sim-folge,.feedback,.niv-card,.ffront,.gpop-card,
.bub.B,.folge,.anschluss,.tipp,.foto,.ziel,.wbank span{border-width:1.5px!important;box-shadow:var(--dow-schatten)!important;}
.card:hover,.t-card:hover,.rp-card:hover,.opt:hover{box-shadow:var(--dow-schatten-hover)!important;}
.wbank span,.ziel{box-shadow:none!important;}
.rp-card .foto{box-shadow:none!important;}
.opt.right,.pz-t.done{background:var(--dow-tuerkis-soft)!important;border-color:var(--dow-tuerkis)!important;color:var(--dow-tuerkis-dunkel);}
.done-btn{background:var(--dow-gold);color:var(--dow-ink);border:1.5px solid var(--dow-ink);box-shadow:var(--dow-schatten);}
.done-btn:disabled{background:var(--dow-gruen-soft);color:var(--dow-gruen);}
.ghost,.back,.to-themen,.hud .pill,.nav button,.lv,.kicker,.zusatz-badge{border-width:1.5px;}
.kicker,.zusatz-badge{background:var(--dow-gold-hell);}
.merk{box-shadow:5px 5px 0 var(--dow-gold);}

/* ===================== ENDE INHALTE ===================== */
let T=EINHEITEN.puenktlichkeit.ab;

/* ============ GLOSS ============ */
function gloss(x){return x.replace(/<g>(.*?)<\/g>/g,(m,w)=>{
  const key=Object.keys(T.glossar).find(k=>w.includes(k))||w;
  return `<span class="gloss" onclick="openGloss('${key}')">${w}</span>`;});}
function lhBlock(titel,inhalt,klasse){return inhalt?`<div class="lh ${klasse||''}"><div class="lh-t">${titel}</div>${inhalt}</div>`:'';}
function lhSag(t){return t?`<span class="say" onclick="event.stopPropagation();sag(${JSON.stringify(String(t).replace(/<[^>]+>/g,''))})">🔊</span>`:'';}
/* Vokabel antippen: einfach erklärt + Beispiel + in 3 Zeiten (+ locker gesagt). Julia 27.11.:
   „wenn man draufklickt Worterklärung mit Beispiel, wie man es nutzt, auch in 3 Zeiten“.
   Felder je Wort: t (Erklärung), bsp, zeiten {jetzt, perfekt, praeteritum} oder [3], ugs, merk */
function openGloss(k){const g=T.glossar[k];if(!g)return;gEm.textContent='';gW.textContent=k;gT.innerHTML=mk(g.t||'');
  const z=g.zeiten?(Array.isArray(g.zeiten)?g.zeiten:[g.zeiten.jetzt,g.zeiten.perfekt,g.zeiten.praeteritum]):null;
  const zn=['jetzt','Perfekt','Präteritum'];
  gMehr.innerHTML=lhBlock('So benutzt man es',g.bsp?`<div class="lh-bsp">${lhSag(g.bsp)}${mk(g.bsp)}</div>`:'')
   +lhBlock('In 3 Zeiten',z?z.map((x,i)=>x?`<div class="lh-zeit"><small>${zn[i]}</small>${lhSag(x)}${mk(x)}</div>`:'').join(''):'')
   +lhBlock('Locker gesagt',g.ugs?[].concat(g.ugs).map(u=>`<div class="lh-ugs">${lhSag(u)}${mk(u)}</div>`).join(''):'','locker')
   +(g.merk?`<div class="lh-merk dow-hand">${g.merk}</div>`:'');
  gHint.textContent='einfach erklärt';gpop.classList.add('on');}
/* Redemittel antippen: Erklärung, Beispiel, Varianten, Umgangssprache, Merkhilfe – alles im
   Hintergrund, die Folie bleibt ruhig. Felder je Satz: s, bsp, erkl, var[], ugs[], merk */
function openRM(i,j){const it=T.redemittel[i].items[j];gEm.textContent='';gW.innerHTML=mk(it.s);
  gT.innerHTML=it.erkl?mk(it.erkl):'';
  gMehr.innerHTML=lhBlock('Beispiel',it.bsp?`<div class="lh-bsp">${lhSag(it.bsp)}${mk(it.bsp)}</div>`:'')
   +lhBlock('Andere Möglichkeiten',it.var?[].concat(it.var).map(v=>`<div class="lh-var">${lhSag(v)}${mk(v)}</div>`).join(''):'')
   +lhBlock('Locker gesagt – unter Freunden',it.ugs?[].concat(it.ugs).map(u=>`<div class="lh-ugs">${lhSag(u)}${mk(u)}</div>`).join(''):'','locker')
   +(it.merk?`<div class="lh-merk dow-hand">${it.merk}</div>`:'');
  gHint.textContent='Sagt den Satz laut – jeder einmal!';gpop.classList.add('on');}
function closeGloss(){gpop.classList.remove('on');}

/* ============ SLIDES ============ */
const dot='●',cir='○';
function meterline(n){return dot.repeat(n)+cir.repeat(3-n);}
let SL=[];
/* ================= Gerüst v2 (26.11.2026) =================
   Jede Station erscheint nur, wenn das Thema Daten dafür hat.
   Reihenfolge = Lernbogen: verstehen → merken → gelenkt üben → frei sprechen → festigen.
   Alte Felder (vokabeln, mission, aktiv, chunks) laufen weiter, falls vorhanden. */
const mk=s=>String(s==null?'':s).replace(/<m>(.*?)<\/m>/g,'<mark class="m">$1</mark>');

/* „Jetzt ihr!“ – nach jeder Aufgabe sofort anwenden (Julia 27.11.: „Fragen nach jeder
   Aufgabe bitte nicht vergessen, um das Gelernte sofort ANZUWENDEN“). Eigene Fragen
   kommen aus den Inhalten: T.anwenden = { einstieg:[…], dach:[…], karte:[…], situationen:[…],
   redemittel:[…], dialog:[…], wassagen:[…], puzzle:[…], luecken:[…], quiz:[…], simulator:[…] }.
   Fehlt ein Eintrag, steht eine allgemeine Frage da. */
const ANW_STANDARD={
  einstieg:['Was hat euch überrascht? Jeder sagt einen Satz: „Ich dachte, …“','Wie ist das bei euch? Erzählt kurz.'],
  dach:['Wie ist das in eurem Land? Jeder vergleicht: „Bei uns …, in Deutschland …“','Was findet ihr gut, was komisch? Warum?'],

  situationen:['Wo ist es bei euch genauso, wo anders? Jeder wählt eine Situation.','Wart ihr schon einmal in so einer Situation? Erzählt.'],
  redemittel:['Jeder wählt zwei Redemittel und sagt einen eigenen Satz über sich.','Fragt euch gegenseitig – und antwortet mit einem Redemittel.'],
  dialog:['Spielt den Dialog zu zweit nach – ändert dabei den Ort oder die Person.','Was hättet ihr an Amiras Stelle gesagt?'],
  wassagen:['Hattet ihr schon einmal so eine Situation? Was habt ihr gesagt?','Welche Antwort war für euch schwierig? Warum?'],
  puzzle:['Jeder nimmt einen Satz und erzählt damit etwas Echtes über sich.'],
  luecken:['Lest den Dialog zu zweit – dann ändert ihr ihn so, dass er zu euch passt.'],
  quiz:['Welche Antwort hat euch überrascht? Erzählt, warum.','Stellt euch gegenseitig noch eine eigene Quizfrage.'],
  simulator:['Was hättet ihr im echten Leben gemacht?','Welche Szene war am schwierigsten? Warum?']
};
let ANW_N=0;
/* Abwechslung (Julia 27.11. abends: „wirkt langweilig, es muss doch abwechslungsreicher sein“):
   „Jetzt ihr!“ kommt jedes Mal in einem anderen Format – Karten ziehen, Blitzrunde mit Uhr,
   Meinungs-Ampel, Würfel, Interview-Kette, Zettel an der Wand. Inhalt = dieselben Fragen. */
const ANW_FORMATE=['karten','blitz','ampel','wuerfel','interview','zettel'];
function anwHilfe(){const rm=(T.redemittel||[]).flatMap(g=>g.items||[]).slice(0,4).map(i=>i.s);
  return rm.length?`<div class="anw-hilfe"><div class="dow-hand" style="font-size:1.4rem">Das hilft euch:</div>${rm.map(r=>`<div class="anw-rm">${mk(r)}</div>`).join('')}</div>`:'';}
function anw(k){ const nr=ANW_N++; SL.push(()=>{const q=((T.anwenden&&T.anwenden[k])||ANW_STANDARD[k]||[]);
  const f=ANW_FORMATE[nr%ANW_FORMATE.length]; const id='anw'+nr;
  const kopf=(titel,sub)=>`<span class="kicker">Jetzt ihr!</span><div class="s-h">${titel}</div><p class="s-sub">${sub}</p>`;
  let mitte='';
  if(f==='karten'){ mitte=kopf('Karten ziehen','Jede Person tippt auf eine Karte und beantwortet ihre Frage. Die anderen fragen nach.')
    +`<div class="anw-karten">${q.concat(q.length<3?['Erzählt ein Beispiel aus eurem Leben.']:[]).slice(0,3).map((x,i)=>`<button class="anw-karte" onclick="this.classList.add('auf')"><span class="rueck">${i+1}</span><span class="vorn">${gloss(x)}</span></button>`).join('')}</div>`; }
  else if(f==='blitz'){ mitte=kopf('Blitzrunde','Reihum: Jede Person sagt <b>einen</b> Satz. Wer nichts weiß, sagt „Weiter!“.')
    +`<div class="anw-blitz"><div class="anw-gross">${gloss(q[0]||'')}</div><button class="anw-uhr" onclick="anwUhr(this,60)"><span>60</span><small>Sekunden starten</small></button></div>${q[1]?`<div class="anw-noch">Noch Zeit? ${gloss(q[1])}</div>`:''}`; }
  else if(f==='ampel'){ mitte=kopf('Meinungs-Ampel','Jede Person wählt eine Farbe und sagt warum. Benutzt: „Ich finde …, weil …“')
    +`<div class="anw-gross">${gloss(q[0]||'')}</div><div class="anw-ampel"><div class="gr">Ja, genau!</div><div class="ge">Teils, teils</div><div class="ro">Gar nicht</div></div>${q[1]?`<div class="anw-noch">Danach: ${gloss(q[1])}</div>`:''}`; }
  else if(f==='wuerfel'){ mitte=kopf('Würfelt eure Frage','Tippt auf den Würfel. Die Frage, die leuchtet, beantwortet ihr alle.')
    +`<div class="anw-wuerfel-wrap"><button class="anw-wuerfel" onclick="anwWuerfel('${id}',this)">?</button><div class="anw-liste" id="${id}">${q.map((x,i)=>`<div class="anw-f2"><span class="nr">${i+1}</span>${gloss(x)}</div>`).join('')}</div></div>`; }
  else if(f==='interview'){ mitte=kopf('Interview-Kette','Person A fragt B, B fragt C, C fragt A (zu viert: … D fragt A). Fragt immer einmal nach: „Wieso?“ „Wirklich?“')
    +`<div class="anw-interview">${q.map((x,i)=>`<div class="anw-bub ${i%2?'r':''}"><b>${String.fromCharCode(65+i)} fragt:</b> ${gloss(x)}</div>`).join('')}</div>`; }
  else { mitte=kopf('Zettel an der Wand','Sucht euch einen Zettel aus. Erzählt – die anderen stellen eine Frage dazu.')
    +`<div class="anw-zettel">${q.map((x,i)=>`<div class="zt z${i%3}">${gloss(x)}</div>`).join('')}</div>`; }
  return `<div class="slide anw fmt-${f}"><div class="anw-grid2"><div>${mitte}</div>${anwHilfe()}</div></div>`;}); }
function anwUhr(btn,sek){if(btn.dataset.l)return;btn.dataset.l=1;let t=sek;const sp=btn.querySelector('span'),sm=btn.querySelector('small');sm.textContent='läuft …';
  const iv=setInterval(()=>{t--;sp.textContent=t;btn.style.setProperty('--p',(1-t/sek)*360+'deg');if(t<=0){clearInterval(iv);sm.textContent='Zeit!';winPts(3);}},1000);}
function anwWuerfel(id,btn){const fs=[...document.querySelectorAll('#'+id+' .anw-f2')];if(!fs.length)return;let n=0;btn.classList.add('rollt');
  const iv=setInterval(()=>{fs.forEach(f=>f.classList.remove('an'));const i=Math.floor(Math.random()*fs.length);fs[i].classList.add('an');btn.textContent=i+1;if(++n>9){clearInterval(iv);btn.classList.remove('rollt');}},110);}

// Timer
let t0=null,tTick=null;
function startTimer(){if(tTick)return;t0=Date.now();tTick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);document.getElementById('tmr').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},1000);}
// Quiz
let qi=0,QORD=[];
function renderQuiz(){const q=T.quiz[qi];const el=document.getElementById('quiz');if(!el)return;
  QORD=q.o.map((_,i)=>i);for(let k=QORD.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QORD[k],QORD[j]]=[QORD[j],QORD[k]];}
  el.innerHTML=`<div class="q-prog" style="font-family:var(--ff-h);font-weight:800;color:var(--gold);margin-bottom:10px">Frage ${qi+1} von ${T.quiz.length}</div>
   <div class="frage-q" style="font-size:clamp(1.3rem,2.4vw,2rem)">${q.q}</div>
   <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px;max-width:640px">${QORD.map((oi,pos)=>`<button class="opt" onclick="qAns(${oi})"><span class="mk">${String.fromCharCode(65+pos)}</span>${q.o[oi]}</button>`).join('')}</div>
   <div class="q-next" id="qnext" style="margin-top:18px;display:none"><button class="done-btn" onclick="qNext()">${qi<T.quiz.length-1?'Nächste ›':'Fertig 🏆'}</button></div>`;
}
function qAns(i){const q=T.quiz[qi];const opts=document.querySelectorAll('#quiz .opt');if(document.querySelector('#quiz .opt.right,#quiz .opt.wrong'))return;
  opts.forEach((o,j)=>{o.onclick=null;const oi=QORD[j];if(oi===q.r)o.classList.add('right');else if(oi===i)o.classList.add('wrong');else o.classList.add('dim');});
  if(i===q.r)winPts(10);
  if(q.anschluss){const a=document.createElement('div');a.className='anschluss';a.innerHTML='🗣️ <b>Und du?</b> '+q.anschluss;document.getElementById('qnext').before(a);}
  document.getElementById('qnext').style.display='inline-flex';}
function qNext(){if(qi<T.quiz.length-1){qi++;renderQuiz();}else{go(1);}}
function show(i){cur=Math.max(0,Math.min(SL.length-1,i));
  stage.innerHTML=SL[cur]();
  stage.firstElementChild.classList.add('on');
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===SL.length-1;
  document.getElementById('pbar').style.width=((cur+1)/SL.length*100)+'%';
  stage.querySelectorAll('.meter i').forEach(el=>{requestAnimationFrame(()=>el.style.width=el.dataset.w+'%');});
  if(SL[cur].toString().includes('id="quiz"')){qi=0;renderQuiz();}
  ohneEmoji(stage);
  const ini=stage.querySelector('[data-init]'); if(ini && typeof window[ini.dataset.init]==='function') window[ini.dataset.init]();
  stage.scrollTop=0;
}
function ohneEmoji(root){ /* Papier-Look: keine Emojis in Überschriften/Etiketten */
  const RE=/[\p{Extended_Pictographic}\p{Regional_Indicator}\u{FE0F}\u{200D}]/gu;
  root.querySelectorAll('.s-h,.kicker,.zusatz-badge,.fbox .lbl,.rm-f,.home-h,.sogehts,.ziel,.hilfe b,.rk small,.pc h4,.ch-list .go2').forEach(el=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())) n.nodeValue=n.nodeValue.replace(RE,'').replace(/^\s+/,n.previousSibling?' ':''); });
}
function go(d){show(cur+d);}
addEventListener('keydown',e=>{if(document.body.classList.contains('home'))return;if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')closeGloss();});
homeNiveau();
</script>
</body>
