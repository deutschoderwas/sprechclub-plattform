<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — deutschoderwas club</title>
<!--
  Diese Seite war eine zweite, alte Community-Oberflaeche. Sie las aus
  community_posts / community_replies — der echte Chat liegt aber in
  community_messages und wird von community.js in konto.html gezeichnet.
  Ergebnis: Die Kanaele waren zu sehen, aber jeder Kanal war leer, egal
  wie viel darin stand. Seit dem 1. September zeigten ausserdem 1149
  Benachrichtigungen hierher.

  Die Seite leitet jetzt in den echten Chat weiter und uebersetzt dabei
  den alten Parameter ?k=<kanal> in ?kanal=<kanal>#community, damit auch
  schon verschickte Links wieder funktionieren.
  Die alte Fassung liegt in _to_delete/community-alt-tote-seite.html.
-->
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
       background:#FFF8E0;color:#1A1A1A;
       font:500 1rem/1.6 Inter,"Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
  a{color:#0F766E}
</style>
<script>
  (function(){
    var p = new URLSearchParams(location.search);
    var k = p.get('kanal') || p.get('k') || '';
    var n = p.get('nachricht') || p.get('m') || '';
    var ziel = '/konto.html';
    var q = [];
    if (k) q.push('kanal=' + encodeURIComponent(k));
    if (n) q.push('nachricht=' + encodeURIComponent(n));
    if (q.length) ziel += '?' + q.join('&');
    ziel += '#community';
    location.replace(ziel);
  })();
</script>
</head>
<body>
  <p>Einen Moment — wir bringen dich in die Community.<br>
     <a href="/konto.html#community">Hier geht es direkt weiter.</a></p>
</body>
</html>
