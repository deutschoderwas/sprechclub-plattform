<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verben · deutschoderwas</title>
<meta name="description" content="Deutsche Verben nach Bereichen üben — mit Bild, Bedeutung und Beispielsatz. Offline, A1 bis C2.">
<meta name="theme-color" content="#F6F9FA">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="/logo.PNG">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verben">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Shantell+Sans:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Verben — die Mechanik von Duolingo, die Handschrift von
   deutschoderwas

   Julia, 20.11.2026, in drei Schritten: "zu KI maessig" — "noch
   professioneller" — "copy duolingo".

   Kopiert wird das, was frei ist: der Pfad aus runden Knoten, die
   kurze Lektion mit Balken und Abbrechen-Kreuz, die drei Herzen, das
   farbige Band, das nach der Antwort von unten hochfaehrt, und die
   dicken Knoepfe mit Unterkante, die sich beim Druecken senken. Das
   sind Bedienmuster, keine Marke.

   NICHT kopiert: Logo, Eule, deren Gruen, deren Schrift, deren Texte.
   Die Farben und Schriften sind die aus club-stil.css — Petrol,
   Tuerkis, Caveat Brush, Shantell Sans.
   ============================================================ */
:root{
  --tuerkis:#39CCE3; --tuerkis-tief:#1FA8C4; --petrol:#10627A; --petrol-tief:#063138;
  --tuerkis-hauch:#E6F8FC; --gelb:#FFE100;
  --gruen:#58CC02; --gruen-tief:#46A302; --gruen-hauch:#EBFBE0;
  --rot:#D42A21; --rot-tief:#A81D16; --rot-hauch:#FDECEB;
  --tinte:#14181B; --tinte-2:#5A6B72; --tinte-3:#9FB0B7;
  --grund:#F6F9FA; --karte:#FFFFFF; --linie:#DDE6E9; --gleis:#E4EBEE;
  --hand:255px 12px 225px 15px/15px 225px 15px 255px;
  --titel:'Caveat Brush',cursive; --kopf:'Shantell Sans','Inter',sans-serif; --text:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--text);color:var(--tinte);background:var(--grund);line-height:1.55;font-size:16px;
  overscroll-behavior-y:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.huelle{max-width:540px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px 150px}

/* ---------- Kopfleiste: Herzen und Punkte ---------- */
.leiste{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.leiste .marke{font-family:var(--kopf);font-weight:700;font-size:13.5px;color:var(--tinte-3)}
.leiste .rechts{margin-left:auto;display:flex;align-items:center;gap:14px;
  font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
.leiste .pkt{color:var(--petrol)}
.leiste .hz{color:var(--rot);letter-spacing:1px}

h1{font-family:var(--titel);font-weight:400;font-size:42px;line-height:1}
.unter{color:var(--tinte-2);font-size:15px;margin-top:6px}

/* ---------- Der Pfad ---------- */
.bereich{margin-top:34px}
.bereich-kopf{display:flex;align-items:center;gap:12px;background:var(--petrol);color:#fff;
  border-radius:16px;padding:13px 18px;box-shadow:0 4px 0 var(--petrol-tief)}
.bereich-kopf b{font-family:var(--kopf);font-weight:700;font-size:16.5px;flex:1}
.bereich-kopf span{font-size:13px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}

.pfad{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 4px}
.knoten{display:flex;flex-direction:column;align-items:center;gap:5px}
.knoten button{width:78px;height:70px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--kopf);font-weight:700;font-size:21px;color:#fff;
  background:var(--gleis);box-shadow:0 7px 0 #CBD6DA;transition:transform .09s,box-shadow .09s}
.knoten button:active{transform:translateY(5px);box-shadow:0 2px 0 #CBD6DA}
.knoten.offen button{background:var(--tuerkis);box-shadow:0 7px 0 var(--tuerkis-tief);color:var(--petrol-tief)}
.knoten.fertig button{background:var(--gruen);box-shadow:0 7px 0 var(--gruen-tief)}
.knoten.zu button{color:var(--tinte-3);cursor:default}
.knoten small{font-size:11.5px;font-weight:700;color:var(--tinte-3);letter-spacing:.03em}
.knoten.offen small{color:var(--petrol)}
.knoten:nth-child(2){margin-left:84px}.knoten:nth-child(3){margin-left:110px}
.knoten:nth-child(4){margin-left:40px}.knoten:nth-child(5){margin-left:-62px}
.knoten:nth-child(6){margin-left:-96px}.knoten:nth-child(7){margin-left:-30px}
@media(max-width:380px){.knoten:nth-child(n){margin-left:0}}

/* ---------- Lektion ---------- */
.lek-kopf{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.lek-kopf .x{font-size:26px;line-height:1;color:var(--tinte-3);padding:2px 4px}
.gleis{flex:1;height:14px;background:var(--gleis);border-radius:999px;overflow:hidden}
.gleis i{display:block;height:100%;background:var(--tuerkis);border-radius:999px;transition:width .35s ease}
.lek-kopf .hz{color:var(--rot);font-weight:800;font-size:15px;letter-spacing:1px}

.frage{font-family:var(--kopf);font-weight:700;font-size:21px;line-height:1.3;margin-bottom:22px}
.bild{width:100%;max-width:270px;aspect-ratio:1/1;margin:0 auto 24px;overflow:hidden;background:var(--karte);
  border:2px solid var(--linie);border-radius:20px}
.bild img{width:100%;height:100%;object-fit:cover}
.satz{background:var(--karte);border:2px solid var(--linie);border-radius:14px;padding:15px 17px;
  font-size:18px;line-height:1.5;margin-bottom:24px}
.hinweis{font-size:16.5px;color:var(--tinte-2);margin-bottom:22px}

.wahl{display:grid;gap:11px}
.wahl button{font-family:var(--kopf);font-weight:700;font-size:16.5px;text-align:left;background:var(--karte);
  border:2px solid var(--linie);border-bottom-width:4px;border-radius:14px;padding:15px 18px;min-height:58px;
  transition:transform .09s,border-color .12s,background .12s}
.wahl button:active:not([disabled]){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.wahl button.gewaehlt{border-color:var(--tuerkis);background:var(--tuerkis-hauch);color:var(--petrol)}
.wahl button.ja{border-color:var(--gruen-tief);background:var(--gruen-hauch);color:#3A7A02}
.wahl button.nein{border-color:var(--rot-tief);background:var(--rot-hauch);color:var(--rot)}
input[type=text]{width:100%;padding:16px 18px;border:2px solid var(--linie);border-bottom-width:4px;
  border-radius:14px;font-family:var(--kopf);font-weight:700;font-size:18px;background:var(--karte);outline:none}
input[type=text]:focus{border-color:var(--tuerkis)}

/* ---------- Das Band von unten ---------- */
.band{position:fixed;left:0;right:0;bottom:0;background:var(--karte);border-top:2px solid var(--linie);
  padding:16px 20px max(18px,env(safe-area-inset-bottom));z-index:40}
.band-in{max-width:540px;margin:0 auto}
.band.ja{background:var(--gruen-hauch);border-top-color:#C7EFA8}
.band.nein{background:var(--rot-hauch);border-top-color:#F3C9C6}
.band b{display:block;font-family:var(--kopf);font-weight:700;font-size:18px;margin-bottom:3px}
.band.ja b{color:#3A7A02} .band.nein b{color:var(--rot-tief)}
.band .wort{font-size:15px;color:var(--tinte-2)}
.band .bsp{font-size:14.5px;color:var(--tinte-2);font-style:italic;margin-top:2px}
.knopf{display:block;width:100%;margin-top:14px;font-family:var(--kopf);font-weight:700;font-size:17px;
  color:#fff;background:var(--petrol);border-radius:var(--hand);padding:15px;min-height:56px;
  box-shadow:0 5px 0 var(--petrol-tief);transition:transform .09s,box-shadow .09s}
.knopf:active{transform:translateY(3px);box-shadow:0 2px 0 var(--petrol-tief)}
.knopf.gruen{background:var(--gruen);box-shadow:0 5px 0 var(--gruen-tief)}
.knopf.rot{background:var(--rot);box-shadow:0 5px 0 var(--rot-tief)}
.knopf.grau{background:var(--gleis);color:var(--tinte-3);box-shadow:0 5px 0 #CBD6DA;cursor:default}
.knopf.still{background:var(--karte);color:var(--tinte);box-shadow:0 0 0 2px var(--linie) inset}

/* ---------- Ende ---------- */
.ende{text-align:center;padding:46px 0 10px}
.ende h2{font-family:var(--titel);font-weight:400;font-size:40px;line-height:1.05;margin-bottom:6px}
.ende p{color:var(--tinte-2);margin-bottom:26px}
.ende .zahlen{display:flex;gap:10px;justify-content:center;margin-bottom:26px}
.ende .zahlen div{flex:1;max-width:150px;background:var(--karte);border:2px solid var(--linie);
  border-bottom-width:4px;border-radius:14px;padding:12px 8px}
.ende .zahlen b{display:block;font-family:var(--kopf);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.ende .zahlen small{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--tinte-3)}
.fein{font-size:13px;color:var(--tinte-3);margin-top:30px;text-align:center}
.fein a{color:var(--petrol)}
</style>
</head>
<body>
<div class="huelle" id="app"></div>
<div id="unten"></div>

<script src="verben-daten.js"></script>
<script>
(function(){
  'use strict';
  var VERBEN=(window.VERBEN||[]).slice(), BEREICHE=window.BEREICHE||[];
  var PRO=5, FRAGEN=10, HERZEN=3, SPEICHER='dow_verben_v3';

  var stand={fertig:{},xp:0};
  try{ var r=localStorage.getItem(SPEICHER); if(r) stand=Object.assign(stand,JSON.parse(r)); }catch(e){}
  function sichern(){ try{ localStorage.setItem(SPEICHER,JSON.stringify(stand)); }catch(e){} }

  var lektionen=[];
  BEREICHE.forEach(function(g){
    var dr=VERBEN.filter(function(v){return v.g===g;});
    for(var i=0;i<dr.length;i+=PRO){ var t=dr.slice(i,i+PRO);
      if(t.length) lektionen.push({id:g+'#'+(i/PRO+1),g:g,nr:i/PRO+1,verben:t}); }
  });
  function lekVon(g){ return lektionen.filter(function(l){return l.g===g;}); }

  function mischen(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function schlicht(s){return String(s||'').toLowerCase().trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z]/g,'');}
  function andere(v,n){var nah=VERBEN.filter(function(x){return x.w!==v.w&&x.g===v.g;});
    var pool=nah.length>=n?nah:VERBEN.filter(function(x){return x.w!==v.w;});return mischen(pool).slice(0,n);}

  function aufgaben(lek){
    var arten=['bild','bedeutung','satz','tippen'],liste=[];
    mischen(lek.verben.concat(lek.verben)).slice(0,FRAGEN).forEach(function(v,i){
      var a=arten[i%arten.length]; if(a==='bild'&&!v.bild)a='bedeutung';
      var f=andere(v,3);
      if(a==='bild') liste.push({art:a,v:v,frage:'Welches Verb siehst du?',bild:v.bild,wahl:mischen([v.w].concat(f.map(function(x){return x.w;}))),loesung:v.w});
      else if(a==='bedeutung') liste.push({art:a,v:v,frage:'Was bedeutet „'+v.w+'“?',wahl:mischen([v.b].concat(f.map(function(x){return x.b;}))),loesung:v.b});
      else if(a==='satz') liste.push({art:a,v:v,frage:'Welches Verb steckt im Satz?',satz:v.s,wahl:mischen([v.w].concat(f.map(function(x){return x.w;}))),loesung:v.w});
      else liste.push({art:'tippen',v:v,frage:'Schreib das Verb',bild:v.bild,hinweis:v.b,loesung:v.w});
    });
    return mischen(liste);
  }

  var app=document.getElementById('app'), unten=document.getElementById('unten'), lauf=null;
  function band(h){ unten.innerHTML = h || ''; }

  function leiste(herzen){
    return '<div class="leiste"><span class="marke">deutschoderwas</span><span class="rechts">'
      + (herzen!=null ? '<span class="hz">'+Array(herzen+1).join('♥')+(herzen===0?'—':'')+'</span>' : '')
      + '<span class="pkt">'+(stand.xp||0)+' XP</span></span></div>';
  }

  /* ---------- Pfad ---------- */
  function zeigeStart(){
    band('');
    var h = leiste() + '<h1>Verben</h1><p class="unter">'+VERBEN.length+' Verben mit Bild — Lektion für Lektion.</p>';
    BEREICHE.forEach(function(g){
      var alle=lekVon(g), f=alle.filter(function(l){return stand.fertig[l.id];}).length;
      var offenGesetzt=false;
      h += '<section class="bereich"><div class="bereich-kopf"><b>'+esc(g)+'</b>'
        + '<span>'+f+' / '+alle.length+'</span></div><div class="pfad">'
        + alle.map(function(l){
            var ist=!!stand.fertig[l.id];
            var offen = !ist && !offenGesetzt; if(offen) offenGesetzt=true;
            var zu = !ist && !offen;
            return '<div class="knoten '+(ist?'fertig':offen?'offen':'zu')+'">'
              + '<button type="button" '+(zu?'disabled':'')+' data-l="'+esc(l.id)+'">'+(ist?'✓':l.nr)+'</button>'
              + '<small>'+esc(l.verben[0].n)+'</small></div>';
          }).join('')
        + '</div></section>';
    });
    h += '<p class="fein">Dein Fortschritt bleibt auf diesem Gerät. <a href="https://www.deutschoderwas-club.de/" target="_blank" rel="noopener">deutschoderwas club</a></p>';
    app.innerHTML=h;
    Array.prototype.forEach.call(app.querySelectorAll('[data-l]'),function(b){
      if(!b.disabled) b.onclick=function(){ starte(b.getAttribute('data-l')); };
    });
  }

  function starte(id){
    var lek=lektionen.filter(function(l){return l.id===id;})[0]; if(!lek) return;
    lauf={lek:lek,a:aufgaben(lek),i:0,richtig:0,herzen:HERZEN};
    zeigeAufgabe();
  }

  function zeigeAufgabe(){
    if(lauf.i>=lauf.a.length) return zeigeEnde(true);
    var a=lauf.a[lauf.i];
    var h = '<div class="lek-kopf"><button class="x" id="x" aria-label="Abbrechen">✕</button>'
      + '<span class="gleis"><i style="width:'+Math.round(lauf.i/lauf.a.length*100)+'%"></i></span>'
      + '<span class="hz">'+Array(lauf.herzen+1).join('♥')+'</span></div>'
      + '<div class="frage">'+esc(a.frage)+'</div>';
    if(a.bild) h+='<div class="bild"><img src="'+esc(a.bild)+'" alt=""></div>';
    if(a.satz) h+='<div class="satz">'+esc(a.satz)+'</div>';
    if(a.art==='tippen'){
      h+='<p class="hinweis">'+esc(a.hinweis)+'</p>'
       + '<input id="feld" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Verb">';
    } else {
      h+='<div class="wahl" id="wahl">'+a.wahl.map(function(w){
        return '<button type="button" data-w="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div>';
    }
    app.innerHTML=h;
    document.getElementById('x').onclick=zeigeStart;

    if(a.art==='tippen'){
      var feld=document.getElementById('feld');
      band('<div class="band"><div class="band-in"><button class="knopf" id="p">Prüfen</button></div></div>');
      document.getElementById('p').onclick=function(){ pruefe(a, schlicht(feld.value)===schlicht(a.loesung), feld); };
      feld.addEventListener('keydown',function(e){ if(e.key==='Enter') pruefe(a, schlicht(feld.value)===schlicht(a.loesung), feld); });
      setTimeout(function(){ try{feld.focus();}catch(e){} },60);
    } else {
      var gewaehlt=null;
      band('<div class="band"><div class="band-in"><button class="knopf grau" id="p" disabled>Prüfen</button></div></div>');
      Array.prototype.forEach.call(app.querySelectorAll('#wahl button'),function(b){
        b.onclick=function(){
          Array.prototype.forEach.call(app.querySelectorAll('#wahl button'),function(x){ x.className=''; });
          b.className='gewaehlt'; gewaehlt=b;
          var k=document.getElementById('p'); k.className='knopf'; k.disabled=false;
          k.onclick=function(){
            var ok=gewaehlt.getAttribute('data-w')===a.loesung;
            Array.prototype.forEach.call(app.querySelectorAll('#wahl button'),function(x){
              x.disabled=true;
              if(x.getAttribute('data-w')===a.loesung) x.className='ja';
            });
            if(!ok) gewaehlt.className='nein';
            pruefe(a, ok);
          };
        };
      });
    }
  }

  function pruefe(a, ok, feld){
    if(ok){ lauf.richtig++; stand.xp=(stand.xp||0)+10; sichern(); }
    else { lauf.herzen--; }
    if(feld) feld.disabled=true;
    var v=a.v;
    var hz=document.querySelector('.lek-kopf .hz'); if(hz) hz.textContent=Array(Math.max(0,lauf.herzen)+1).join('♥');
    band('<div class="band '+(ok?'ja':'nein')+'"><div class="band-in">'
      + '<b>'+(ok?'Richtig':'Richtig wäre: '+esc(a.loesung))+'</b>'
      + '<div class="wort">'+esc(v.w)+' — '+esc(v.b)+'</div>'
      + '<div class="bsp">'+esc(v.s)+'</div>'
      + '<button class="knopf '+(ok?'gruen':'rot')+'" id="w">Weiter</button>'
      + '</div></div>');
    document.getElementById('w').onclick=function(){
      if(lauf.herzen<=0) return zeigeEnde(false);
      lauf.i++; zeigeAufgabe();
    };
  }

  function zeigeEnde(geschafft){
    band('');
    if(geschafft){ stand.fertig[lauf.lek.id]=true; sichern(); }
    var naechste=lektionen.filter(function(l){ return !stand.fertig[l.id]; })[0];
    app.innerHTML = leiste()
      + '<div class="ende"><h2>'+(geschafft?'Geschafft!':'Herzen alle')+'</h2>'
      + '<p>'+esc(lauf.lek.g)+' · Lektion '+lauf.lek.nr+'</p>'
      + '<div class="zahlen">'
      + '<div><b>'+lauf.richtig+'/'+lauf.a.length+'</b><small>RICHTIG</small></div>'
      + '<div><b>+'+(lauf.richtig*10)+'</b><small>XP</small></div>'
      + '</div>'
      + (geschafft && naechste ? '<button class="knopf gruen" id="n">Weiter mit Lektion '+naechste.nr+'</button>' : '')
      + (!geschafft ? '<button class="knopf rot" id="n2">Noch einmal</button>' : '')
      + '<button class="knopf still" id="z" style="margin-top:10px">Zur Übersicht</button></div>';
    document.getElementById('z').onclick=zeigeStart;
    var n=document.getElementById('n'); if(n) n.onclick=function(){ starte(naechste.id); };
    var n2=document.getElementById('n2'); if(n2) n2.onclick=function(){ starte(lauf.lek.id); };
  }

  zeigeStart();
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
